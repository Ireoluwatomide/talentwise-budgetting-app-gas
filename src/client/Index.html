<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Budget Tracker</title>

  <!--
    ┌─────────────────────────────────────────────────────────────────────────┐
    │  Index.html — Root Page Shell                                           │
    │                                                                         │
    │  Served by doGet() in Main.gs via:                                      │
    │    HtmlService.createTemplateFromFile('src/client/Index')               │
    │               .evaluate()                                               │
    │               .setTitle('Budget Tracker')                               │
    │                                                                         │
    │  INCLUDE ORDER (dependencies before dependents — do not reorder):       │
    │    1. styles.css      — CSS variables + all component styles            │
    │    2. bootstrapScript — window.__BOOTSTRAP__ injected by Main.gs        │
    │    3. Chart.js CDN    — must load before any screen JS                  │
    │    4. Metric.html     — makeMetric() helper used by screen renders      │
    │    5. utils.js        — AppState, callServer, fmt, renderAll, etc.      │
    │    6. AlertBanner     — updateAlertBanners() + alert zone divs          │
    │    7. Header          — updateHeader() + header DOM                     │
    │    8. Tabs            — tab strip DOM                                   │
    │    9. BottomNav       — mobile bottom nav bar + swipe gesture           │
    │   10. Screen panes    — each pane div + its inline <script>             │
    │   11. Boot sequence   — renderAll() called once, after all includes     │
    └─────────────────────────────────────────────────────────────────────────┘
  -->

  <!-- ── 1. Master Stylesheet ──────────────────────────────────────────────── -->
  <?!= include('src/client/utils/styles.css') ?>

</head>
<body>

<!-- ── 2. Bootstrap Data ─────────────────────────────────────────────────── -->
<!--
  Injected by doGet() in Main.gs as a template variable.
  Must appear BEFORE utils.js so window.__BOOTSTRAP__ is defined
  when AppState initialises on the next line.
-->
<?!= bootstrapScript ?>
<?!= userProfile ?>

<?!= include('src/client/utils/utils.js') ?>

<div id="app" class="app">

  <!-- ── 6. Alert Banners ────────────────────────────────────────────────── -->
  <?!= include('src/client/components/AlertBanner') ?>

  <!-- ── 7. Header ───────────────────────────────────────────────────────── -->
  <?!= include('src/client/components/Header') ?>

</div><!-- /#app -->

<!-- ── 11. Boot Sequence ─────────────────────────────────────────────────── -->
<!--
  Runs once after ALL includes above have been parsed by the browser.
  At this point: AppState is populated, all render functions are defined,
  all DOM elements exist. Safe to call renderAll() immediately.

  Do NOT wrap in DOMContentLoaded — HtmlService finishes rendering the
  entire document before executing any script, so the DOM is always ready.
-->
<script>
  (function boot() {
    // 1. Apply persisted dark mode BEFORE first render to avoid a flash
    //    of the light theme appearing then immediately switching to dark.
    if (AppState.darkMode) {
      document.getElementById('app').classList.add('dark');
      var darkBtn = document.getElementById('dark-btn');
      if (darkBtn) darkBtn.textContent = 'Light';
    }

    // 2. Sync the currency selector in the header to the stored preference.
    var currencySel = document.getElementById('currency-sel');
    if (currencySel) currencySel.value = AppState.currency;

    // 3. Populate all category <select> dropdowns from AppState.categories.
    //    Must run before renderAll() so the Overview add-form select is filled.
    if (typeof populateCategorySelects === 'function') {
      populateCategorySelects();
    }

    // 4. Set the initial active state on the mobile bottom nav bar.
    //    Overview is the default first tab — bnav-overview starts active.
    var bnavOverview = document.getElementById('bnav-overview');
    if (bnavOverview) bnavOverview.classList.add('active');

    // 5. First full render — populates metric cards, transaction list,
    //    goals, bills, etc. from the bootstrap data already in AppState.
    if (typeof renderAll === 'function') {
      renderAll();
    }
  })();
</script>

</body>
</html>
