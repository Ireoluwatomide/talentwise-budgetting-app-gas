<!DOCTYPE html>

  <title>Budget Tracker</title>

  <!--
    Index.html — Root Page Shell

    PURPOSE:
      This is the single HTML file served by doGet() in Main.gs via:
        HtmlService.createTemplateFromFile('src/client/Index')
                   .evaluate()
                   .setTitle('Budget Tracker')

    COMPOSITION PATTERN:
      This file does NOT contain inline styles or business logic.
      Everything is pulled in via the <?!= include('...') ?> scriptlet tag,
      which calls the include() helper in Main.gs:

        function include(filename) {
          return HtmlService.createHtmlOutputFromFile(filename).getContent();
        }

      The result is a single concatenated HTML document served to the browser.

    BOOTSTRAP DATA INJECTION:
      Main.gs injects initial app data as a JSON script block so the first
      render requires zero extra server round-trips:

        <?!= bootstrapScript ?>

      Where bootstrapScript is built in Main.gs as:
        const data = getBootstrapData();
        const bootstrapScript = `<script>window.__BOOTSTRAP__ = ${JSON.stringify(data)};<\/script>`;

    INCLUDE ORDER (matters — dependencies must come before dependents):
      1. styles.css.html     — CSS variables + all component styles (must be first)
      2. Bootstrap data      — window.__BOOTSTRAP__ injected by Main.gs
      3. Chart.js CDN        — loaded before any screen JS that references Chart
      4. Metric.html         — makeMetric() helper (used by screen render functions)
      5. utils.js.html       — AppState, callServer, fmt, toast, switchTab, renderAll, etc.
      6. AlertBanner.html    — updateAlertBanners() + the two alert zone divs
      7. Header.html         — updateHeader() + the header DOM
      8. Tabs.html           — the tab strip DOM
      9. Screen panes        — each pane div + its inline <script> block
      10. Component init     — call renderAll() once DOM is ready

    FILE NAMING IN APPS SCRIPT:
      Apps Script flattens the file tree — there are no real subdirectories
      in the editor. When using clasp to sync from a local folder, the path
      separator becomes part of the filename. The include() call uses the
      path as written here (e.g. 'src/client/utils/styles.css') and clasp
      maps that to the file 'src/client/utils/styles.css.html' on disk.

      ⚠ In the Apps Script web editor, files appear with '/' replaced by spaces
        or as flat names. Use clasp for local development to preserve structure.
  -->

<!--
  TODO: <?!= include('src/client/components/Metric') ?>

  Provides makeMetric() string-builder helper used by multiple screen
  render functions. Included after the pane divs so it is available
  when the inline screen scripts define their render functions.

  NOTE ON INCLUDE ORDER vs EXECUTION ORDER:
    All <script> blocks are parsed top-to-bottom by the browser.
    Function *definitions* (function foo(){}) are hoisted, so the
    order of include matters less for function declarations.
    However, any immediately-invoked code (like renderAll() at the
    bottom of this file) must come LAST.
-->
