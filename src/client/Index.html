<!-- ── 12. Boot Sequence ─────────────────────────────────────────────────── -->
<script>
  (function boot() {
    // 1. Apply persisted dark mode BEFORE first render to avoid flash
    if (AppState.darkMode) {
      document.getElementById('app').classList.add('dark');
      document.body.classList.add('dark');
      var darkBtn = document.getElementById('dark-btn');
      if (darkBtn) darkBtn.textContent = 'Light';
    }

    // 2. Sync all currency selectors to stored preference
    ['currency-sel', 'currency-sel-dd', 'currency-sel-mobile'].forEach(function(id) {
      var el = document.getElementById(id);
      if (el) el.value = AppState.currency;
    });

    // 3. Populate category <select> dropdowns
    if (typeof populateCategorySelects === 'function') {
      populateCategorySelects();
    }

    // 4. Ensure all .btn-primary buttons have label+spinner structure
    if (typeof initAllBtnStructures === 'function') {
      initAllBtnStructures();
    }

    // 4b. Wire comma formatting on all amount inputs
    if (typeof initAmountInputs === 'function') {
      initAmountInputs();
    }

    // 5. Set initial active state on mobile bottom nav
    var bnavOverview = document.getElementById('bnav-overview');
    if (bnavOverview) bnavOverview.classList.add('active');

    // 6. First full render
    if (typeof renderAll === 'function') {
      renderAll();
    }
  })();
</script>
