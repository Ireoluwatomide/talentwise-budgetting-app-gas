<!-- ─────────────────────────────────────────────────────────────────────────
     AlertBanner.html — Over-Budget & Bill-Due Alert Banners

     Two empty div zones, populated dynamically by updateAlertBanners().
     Sits between the header and the tab strip in Index.html.
     ───────────────────────────────────────────────────────────────────────── -->

<!-- Budget goal alert zone -->
<div id="alerts-budget"></div>

<!-- Bill due-date alert zone -->
<div id="alerts-bills"></div>

<script>
    // Spending threshold that triggers a "approaching limit" warning.
    // 85% matches the prototype and the server-side Goals.checkBudgetAlerts().
    var ALERT_THRESHOLD = 0.85;

    // How many days ahead to warn about upcoming bills.
    var BILLS_WARN_DAYS = 5;

    /**
     * updateAlertBanners()
     *
     * Regenerates both alert zones from the current AppState.
     * Called from renderAll() on every state mutation.
     *
     * ── Budget goal alerts ────────────────────────────────────────────────────
     * Compares each goal's monthly_limit against actual expense spending
     * for the current month. Produces danger (over) or warning (approaching) banners.
     *
     * ── Bill due-date alerts ──────────────────────────────────────────────────
     * Scans AppState.bills for unpaid bills due within BILLS_WARN_DAYS days.
     * Produces a single consolidated warning listing all due-soon bills.
     */
    function updateAlertBanners() {
        _updateBudgetAlerts();
        _updateBillAlerts();
    }

    // ── Budget alerts ──────────────────────────────────────────────────────────

    function _updateBudgetAlerts() {
        var budgetEl = document.getElementById('alerts-budget');
        if (!budgetEl) return;

        // CHANGED: goals are now keyed by month
        var goals = (AppState.goals && AppState.goals[curKey()]) || [];

        if (goals.length === 0) {
            budgetEl.innerHTML = '';
            return;
        }

        var spendMap = _buildSpendMap();
        var html = '';

        goals.forEach(function(goal) {
            var limit = parseFloat(goal.monthly_limit) || 0;
            if (limit <= 0) return; // skip goals with no limit set

            var spent = spendMap[goal.category] || 0;
            var ratio = limit > 0 ? spent / limit : 0;

            if (spent > limit) {
                // Over budget — danger banner
                html += (
                    '<div class="alert alert-danger">' +
                    '⚠ Over budget on <strong>' + _esc(goal.category) + '</strong>: ' +
                    'spent ' + fmt(spent) + ', limit ' + fmt(limit) +
                    ' (' + pct(spent, limit) + '% used)' +
                    '</div>'
                );
            } else if (ratio >= ALERT_THRESHOLD) {
                // Approaching limit — warning banner
                html += (
                    '<div class="alert alert-warning">' +
                    '⚡ Approaching limit on <strong>' + _esc(goal.category) + '</strong>: ' +
                    pct(spent, limit) + '% of ' + fmt(limit) + ' used' +
                    '</div>'
                );
            }
        });

        budgetEl.innerHTML = html;
    }

    // ── Bill alerts ────────────────────────────────────────────────────────────

    function _updateBillAlerts() {
        var billsEl = document.getElementById('alerts-bills');
        if (!billsEl) return;

        var bills = AppState.bills || [];
        if (bills.length === 0) {
            billsEl.innerHTML = '';
            return;
        }

        var today    = new Date().getDate();
        var dueSoon  = [];

        bills.forEach(function(bill) {
            // Skip already-paid bills
            if (bill.paid === true || bill.paid === 'true' || bill.paid === 1) return;

            var dueDay = parseInt(bill.due_day, 10);
            if (isNaN(dueDay)) return;

            // Days until due — wrap around end of month
            var daysUntil = dueDay >= today
                ? dueDay - today
                : (31 - today) + dueDay;

            if (daysUntil <= BILLS_WARN_DAYS) {
                dueSoon.push({ bill: bill, daysUntil: daysUntil });
            }
        });

        if (dueSoon.length === 0) {
            billsEl.innerHTML = '';
            return;
        }

        // Sort by most urgent first
        dueSoon.sort(function(a, b) { return a.daysUntil - b.daysUntil; });

        var listParts = dueSoon.map(function(item) {
            var label = item.daysUntil === 0
                ? 'due today'
                : 'in ' + item.daysUntil + 'd';
            return '<strong>' + _esc(item.bill.name) + '</strong> (' + fmt(item.bill.amount) + ', ' + label + ')';
        });

        billsEl.innerHTML = (
            '<div class="alert alert-warning">' +
            '⏰ Bills due soon: ' + listParts.join(' · ') +
            '</div>'
        );
    }

    // ── Helpers ────────────────────────────────────────────────────────────────

    /**
     * _buildSpendMap()
     * Sums expense transactions by category for the current month.
     * Returns { categoryName: totalAmount }.
     */
    function _buildSpendMap() {
        var map = {};
        var txs = (AppState.transactions && AppState.transactions[curKey()]) || [];

        txs.forEach(function(tx) {
            if (tx.type !== 'expense') return;
            var cat = tx.category || 'Other';
            map[cat] = (map[cat] || 0) + (parseFloat(tx.amount) || 0);
        });

        return map;
    }

    /**
     * _esc(str)
     * Minimal HTML escape — prevents XSS from category/bill names
     * containing angle brackets or ampersands.
     */
    function _esc(str) {
        return String(str)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;');
    }
</script>
