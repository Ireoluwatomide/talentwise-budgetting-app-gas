<script>
    // =============================================================================
    // Bottom navigation + swipe gesture
    // =============================================================================

    // Primary tabs visible in the bottom bar
    var BNAV_PRIMARY = ['overview', 'goals', 'bills', 'savings'];

    /**
     * switchTabMobile(tabId)
     *
     * Wrapper around switchTab() that also updates bottom nav active states.
     * Used by both the bottom nav buttons and the More sheet items.
     */
    function switchTabMobile(tabId) {
        switchTab(tabId); // from utils.js

        // Update bottom nav active state
        BNAV_PRIMARY.forEach(function(id) {
            var el = document.getElementById('bnav-' + id);
            if (el) el.classList.toggle('active', id === tabId);
        });

        // If none of the primary tabs match, "More" gets active treatment
        var moreBtn = document.getElementById('bnav-more');
        if (moreBtn) {
            moreBtn.classList.toggle('active', BNAV_PRIMARY.indexOf(tabId) === -1);
        }

        // Update More sheet item active state
        var tsItem = document.getElementById('tsitem-' + tabId);
        document.querySelectorAll('.tab-sheet-item').forEach(function(el) {
            el.classList.remove('active');
        });
        if (tsItem) tsItem.classList.add('active');
    }

    /**
     * openTabSheet()
     * Opens the "More" bottom sheet.
     */
    function openTabSheet() {
        var sheet = document.getElementById('tab-sheet');
        if (sheet) {
            sheet.classList.add('open');
            document.body.style.overflow = 'hidden';
        }
    }

    /**
     * closeTabSheet()
     * Closes the "More" bottom sheet.
     */
    function closeTabSheet() {
        var sheet = document.getElementById('tab-sheet');
        if (sheet) {
            sheet.classList.remove('open');
            document.body.style.overflow = '';
        }
    }

    // ─── SWIPE GESTURE FOR MONTH NAVIGATION ──────────────────────────────────────
    //
    // On mobile, swipe left to go to next month, swipe right to go to prev month.
    // Applied to the #app div so it captures swipes anywhere on the screen.

    (function() {
        var touchStartX = 0;
        var touchStartY = 0;
        var SWIPE_THRESHOLD = 60;  // minimum px horizontal travel
        var DIRECTION_LOCK  = 30;  // max px vertical deviation to count as horizontal

        var app = document.getElementById('app');
        if (!app) return;

        app.addEventListener('touchstart', function(e) {
            touchStartX = e.touches[0].clientX;
            touchStartY = e.touches[0].clientY;
        }, { passive: true });

        app.addEventListener('touchend', function(e) {
            var dx = e.changedTouches[0].clientX - touchStartX;
            var dy = e.changedTouches[0].clientY - touchStartY;

            // Only register horizontal swipes — ignore near-vertical gestures
            if (Math.abs(dy) > DIRECTION_LOCK) return;
            if (Math.abs(dx) < SWIPE_THRESHOLD) return;

            // Ignore swipes that start inside scrollable elements (tables, tab sheet)
            var target = e.target;
            while (target && target !== app) {
                var style = window.getComputedStyle(target);
                if (style.overflowX === 'auto' || style.overflowX === 'scroll') return;
                target = target.parentElement;
            }

            if (dx < 0) {
                // Swipe left → next month
                if (typeof nextMonth === 'function') nextMonth();
            } else {
                // Swipe right → previous month
                if (typeof prevMonth === 'function') prevMonth();
            }
        }, { passive: true });
    })();

    // ─── HEADER USER DISPLAY ─────────────────────────────────────────────────────
    //
    // If window.__USER__ was injected by Main.gs, display the user's name/avatar
    // in the header. Falls back gracefully if not present.

    (function() {
        var user = window.__USER__;
        if (!user || !user.email) return;

        var headerEl = document.querySelector('.app-header, [style*="justify-content:space-between"]');
        if (!headerEl) return;

        // Build a small avatar pill and sign-out link
        var name    = user.display_name || user.email.split('@')[0];
        var initials = name.slice(0, 2).toUpperCase();

        var avatarHtml = (
            '<div style="display:flex;align-items:center;gap:8px;flex-shrink:0;">' +
            '<div style="width:28px;height:28px;border-radius:50%;background:var(--text);' +
            'color:var(--bg);display:flex;align-items:center;justify-content:center;' +
            'font-size:11px;font-weight:500;">' + initials + '</div>' +
            '<button class="btn-sm" onclick="signOut()" ' +
            'style="font-size:11px;" title="Sign out">Sign out</button>' +
            '</div>'
        );

        // Insert avatar before the last child of the header
        var tempDiv = document.createElement('div');
        tempDiv.innerHTML = avatarHtml;
        headerEl.insertBefore(tempDiv.firstChild, headerEl.lastChild);
    })();

    /**
     * signOut()
     * Redirects to the landing page. Google handles actual session termination.
     */
    function signOut() {
        if (typeof google !== 'undefined' && google.script && google.script.run) {
            google.script.run
                .withSuccessHandler(function(url) { window.top.location.href = url; })
                .withFailureHandler(function() {
                    window.top.location.href = window.top.location.href.split('?')[0] + '?page=landing';
                })
                .getSignOutUrl();
        } else {
            window.top.location.href = window.top.location.href.split('?')[0] + '?page=landing';
        }
    }
</script>
