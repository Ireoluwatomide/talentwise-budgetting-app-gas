<!-- ─────────────────────────────────────────────────────────────────────────
     Header.html — Top Bar Component

     Renders the persistent top bar with app label, month navigation,
     currency selector, dark mode toggle, CSV export, and net balance.

     DOM is static — updateHeader() updates text/colour values on each renderAll().
     ───────────────────────────────────────────────────────────────────────── -->

<div class="app-header">

    <!-- LEFT: App label + month navigation ──────────────────────────────────── -->
    <div>
        <div class="label-caps" style="margin-bottom:5px;">Budget Tracker</div>

        <div style="display:flex;align-items:center;gap:8px;">
            <!-- prev month button — 26×26px square feel -->
            <button
                    onclick="prevMonth()"
                    class="btn-sm"
                    style="width:26px;height:26px;padding:0;display:flex;align-items:center;justify-content:center;font-size:14px;"
                    title="Previous month">‹</button>

            <!-- month label — min-width prevents layout shift between long/short names -->
            <div id="hd-month" style="font-size:14px;font-weight:500;min-width:130px;text-align:center;">
                <!-- updated by updateHeader() -->
            </div>

            <!-- next month button -->
            <button
                    onclick="nextMonth()"
                    class="btn-sm"
                    style="width:26px;height:26px;padding:0;display:flex;align-items:center;justify-content:center;font-size:14px;"
                    title="Next month">›</button>
        </div>
    </div>

    <!-- RIGHT: Controls + Net Balance ───────────────────────────────────────── -->
    <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end;">

        <!-- Currency selector -->
        <select
                id="currency-sel"
                onchange="setCurrency(this.value)"
                class="inp"
                style="width:auto;padding:5px 28px 5px 8px;font-size:11px;">
            <option value="NGN">₦ NGN</option>
            <option value="USD">$ USD</option>
            <option value="EUR">€ EUR</option>
            <option value="GBP">£ GBP</option>
        </select>

        <!-- Dark mode toggle -->
        <button
                id="dark-btn"
                onclick="toggleDark()"
                class="btn-sm">Dark</button>

        <!-- CSV export -->
        <button
                onclick="exportCSV()"
                class="btn-sm"
                title="Export current month as CSV">CSV</button>

        <!-- Net Balance display -->
        <div style="text-align:right;margin-left:4px;">
            <div class="label-caps" style="margin-bottom:2px;">Net Balance</div>
            <div
                    id="hd-bal"
                    style="font-family:var(--mono);font-size:22px;font-weight:500;color:var(--acc);">
                <!-- updated by updateHeader() -->
            </div>
        </div>

    </div>
</div>

<script>
    /**
     * updateHeader()
     *
     * Called from renderAll() after every state change.
     * Updates the month label, net balance value + colour,
     * currency selector, and dark mode button text.
     */
    function updateHeader() {
        // 1. Month label
        var monthEl = document.getElementById('hd-month');
        if (monthEl) {
            monthEl.textContent = monthLabel(AppState.curYear, AppState.curMonth);
        }

        // 2. Net balance — computed from client-side AppState cache
        var stats  = getMonthStats(curKey());
        var bal    = stats.bal;
        var balEl  = document.getElementById('hd-bal');
        if (balEl) {
            balEl.textContent = fmt(bal);
            balEl.style.color = bal >= 0 ? 'var(--acc)' : 'var(--red)';
        }

        // 3. Sync currency selector to AppState
        var currSel = document.getElementById('currency-sel');
        if (currSel) currSel.value = AppState.currency;

        // 4. Dark mode button label
        var darkBtn = document.getElementById('dark-btn');
        if (darkBtn) darkBtn.textContent = AppState.darkMode ? 'Light' : 'Dark';
    }
</script>
