<!-- ─────────────────────────────────────────────────────────────────────────
     Header.html — Top Bar Component

     Renders:
       1. .app-header  — the visible top bar row
       2. #avatar-dropdown  — desktop dropdown (position:fixed, not absolute)
       3. #dropdown-backdrop — click-outside trap for dropdown
       4. #profile-sheet — mobile bottom sheet
     ───────────────────────────────────────────────────────────────────────── -->

<!-- ══ 1. TOP BAR ══════════════════════════════════════════════════════════ -->
<div class="app-header">

    <!-- LEFT: label + month nav -->
    <div class="header-left">
        <div class="label-caps" style="margin-bottom:4px;">Budget Tracker</div>
        <div style="display:flex;align-items:center;gap:6px;">
            <button id="btn-prev-month" onclick="prevMonth()" class="month-nav-btn" title="Previous month" aria-label="Previous month">
                <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" width="14" height="14" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
            </button>
            <div id="hd-month" class="header-month-label"></div>
            <button id="btn-next-month" onclick="nextMonth()" class="month-nav-btn" title="Next month" aria-label="Next month">
                <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" width="14" height="14" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
            </button>
        </div>
    </div>

    <!-- RIGHT: desktop controls + balance + avatar -->
    <div class="header-right">

        <!-- Desktop-only controls (hidden on mobile via CSS) -->
        <div class="hdr-desktop-ctrls">
            <select id="currency-sel" onchange="setCurrency(this.value)" class="inp hdr-currency-sel">
                <option value="NGN">₦ NGN</option>
                <option value="USD">$ USD</option>
                <option value="EUR">€ EUR</option>
                <option value="GBP">£ GBP</option>
            </select>
            <button id="dark-btn" onclick="toggleDark()" class="btn-sm">Dark</button>
            <button onclick="exportCSV()" class="btn-sm" title="Export CSV">CSV</button>
        </div>

        <!-- Net Balance (always visible) -->
        <div style="text-align:right;">
            <div class="label-caps" style="margin-bottom:2px;">Net Balance</div>
            <div id="hd-bal" style="font-family:var(--mono);font-size:22px;font-weight:600;color:var(--acc);"></div>
        </div>

        <!-- Avatar button — desktop opens dropdown, mobile opens sheet -->
        <div id="hdr-avatar-wrap" style="flex-shrink:0;"></div>

    </div>
</div>


<!-- ══ 2. DESKTOP DROPDOWN ════════════════════════════════════════════════ -->
<!--
  position:fixed so it escapes any overflow:hidden ancestors.
  Top/left co-ordinates are set in JS via getBoundingClientRect().
-->
<div id="dropdown-backdrop" onclick="closeAvatarDropdown()" style="display:none;position:fixed;inset:0;z-index:998;"></div>

<div id="avatar-dropdown" style="display:none;position:fixed;z-index:999;width:240px;background:var(--bg);border:0.5px solid var(--border2);border-radius:12px;box-shadow:0 8px 32px rgba(0,0,0,0.14);overflow:hidden;">

    <!-- User info -->
    <div id="dd-user-info" style="padding:14px 16px;border-bottom:0.5px solid var(--border);background:var(--bg2);">
        <!-- populated by JS -->
    </div>

    <!-- Currency -->
    <div style="padding:10px 12px;border-bottom:0.5px solid var(--border);">
        <div class="label-caps" style="margin-bottom:6px;padding:0 4px;">Currency</div>
        <select id="currency-sel-dd" onchange="setCurrency(this.value)" class="inp" style="font-size:13px;">
            <option value="NGN">₦ NGN</option>
            <option value="USD">$ USD</option>
            <option value="EUR">€ EUR</option>
            <option value="GBP">£ GBP</option>
        </select>
    </div>

    <!-- Actions -->
    <div style="padding:6px 8px;">
        <button class="dd-item" onclick="toggleDark();_syncDropdownState();">
            <span id="dd-dark-icon" style="font-size:15px;">🌙</span>
            <span id="dd-dark-label">Dark mode</span>
            <span id="dd-dark-state" style="margin-left:auto;font-size:11px;color:var(--text2);">Off</span>
        </button>
        <button class="dd-item" onclick="exportCSV();closeAvatarDropdown();">
            <span style="font-size:15px;">📥</span>
            <span>Export CSV</span>
        </button>
        <div style="height:0.5px;background:var(--border);margin:4px 0;"></div>
        <button class="dd-item" onclick="signOut();" style="color:var(--red);">
            <span style="font-size:15px;">🚪</span>
            <span>Sign out</span>
        </button>
    </div>
</div>


<!-- ══ 3. MOBILE PROFILE SHEET ════════════════════════════════════════════ -->
<div id="profile-sheet" style="display:none;position:fixed;inset:0;z-index:400;">
    <div id="profile-sheet-backdrop" onclick="closeProfileSheet()" style="position:absolute;inset:0;background:rgba(0,0,0,0.4);"></div>
    <div id="profile-sheet-panel" style="position:absolute;bottom:0;left:0;right:0;background:var(--bg);border-radius:20px 20px 0 0;padding:12px 20px 32px;max-height:80vh;overflow-y:auto;">
        <div style="width:36px;height:4px;background:var(--border2);border-radius:2px;margin:0 auto 20px;"></div>

        <!-- User info row -->
        <div id="ps-user-info" style="margin-bottom:1.25rem;"></div>

        <!-- Currency -->
        <div style="margin-bottom:12px;">
            <div class="label-caps" style="margin-bottom:6px;">Currency</div>
            <select id="currency-sel-mobile" onchange="setCurrency(this.value)" class="inp" style="width:100%;">
                <option value="NGN">₦ NGN</option>
                <option value="USD">$ USD</option>
                <option value="EUR">€ EUR</option>
                <option value="GBP">£ GBP</option>
            </select>
        </div>

        <!-- Actions -->
        <div style="display:flex;flex-direction:column;gap:4px;">
            <button class="ps-action-btn" onclick="toggleDark();_syncSheetState();">
                <span id="ps-dark-icon">🌙</span>
                <span id="ps-dark-label">Dark mode</span>
                <span id="ps-dark-state" style="margin-left:auto;font-size:12px;color:var(--text2);">Off</span>
            </button>
            <button class="ps-action-btn" onclick="exportCSV();closeProfileSheet();">
                <span>📥</span><span>Export CSV</span>
                <span style="margin-left:auto;font-size:12px;color:var(--text2);">→</span>
            </button>
            <button class="ps-action-btn" onclick="signOut();" style="color:var(--red);margin-top:8px;">
                <span>🚪</span><span>Sign out</span>
                <span style="margin-left:auto;font-size:12px;color:var(--text2);">→</span>
            </button>
        </div>
    </div>
</div>


<!-- ══ 4. SCOPED STYLES ═══════════════════════════════════════════════════ -->
<style>
    /* Header layout */
    .header-left {
        display: flex;
        flex-direction: column;
    }

    .header-right {
        display: flex;
        align-items: center;
        gap: 12px;
        flex-wrap: nowrap;
    }

    /* Desktop controls */
    .hdr-desktop-ctrls {
        display: flex;
        align-items: center;
        gap: 8px;
    }

    .hdr-currency-sel {
        width: auto;
        padding: 5px 28px 5px 8px;
        font-size: 12px;
    }

    /* Month nav circular buttons */
    .month-nav-btn {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 30px;
        height: 30px;
        border-radius: 50%;
        background: var(--bg2);
        border: 0.5px solid var(--border);
        cursor: pointer;
        color: var(--text2);
        padding: 0;
        transition: background 0.15s, color 0.15s;
        flex-shrink: 0;
    }

    .month-nav-btn:hover:not(:disabled) {
        background: var(--border);
        color: var(--text);
    }

    .month-nav-btn:disabled {
        opacity: 0.4;
        cursor: not-allowed;
    }

    .header-month-label {
        font-size: 18px;
        font-weight: 500;
        min-width: 145px;
        text-align: center;
        color: var(--text);
    }

    /* Avatar circle */
    .hdr-avatar-btn {
        display: flex;
        align-items: center;
        justify-content: center;
        background: none;
        border: none;
        cursor: pointer;
        padding: 0;
    }

    .hdr-avatar-circle {
        width: 32px;
        height: 32px;
        border-radius: 50%;
        background: var(--text);
        color: var(--bg);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 12px;
        font-weight: 700;
        font-family: var(--font);
        user-select: none;
        transition: opacity 0.15s;
    }

    .hdr-avatar-btn:hover .hdr-avatar-circle { opacity: 0.78; }

    /* Dropdown items */
    .dd-item {
        display: flex;
        align-items: center;
        gap: 10px;
        width: 100%;
        background: none;
        border: none;
        border-radius: 8px;
        padding: 10px 10px;
        font-family: var(--font);
        font-size: 13px;
        font-weight: 500;
        color: var(--text);
        cursor: pointer;
        text-align: left;
        transition: background 0.12s;
    }

    .dd-item:hover { background: var(--bg2); }

    /* Mobile profile sheet action buttons */
    .ps-action-btn {
        display: flex;
        align-items: center;
        gap: 12px;
        width: 100%;
        background: var(--bg2);
        border: none;
        border-radius: 8px;
        padding: 14px 16px;
        font-family: var(--font);
        font-size: 15px;
        font-weight: 500;
        color: var(--text);
        cursor: pointer;
        text-align: left;
    }

    .ps-action-btn:active { opacity: 0.7; }

    /* Dropdown open animation */
    @keyframes ddIn {
        from { opacity: 0; transform: translateY(-6px); }
        to   { opacity: 1; transform: translateY(0); }
    }

    #avatar-dropdown.dd-open {
        animation: ddIn 0.15s ease;
    }

    /* ── Responsive ─────────────────────────────────────────────────────── */
    @media (max-width: 600px) {
        .hdr-desktop-ctrls { display: none; }

        .header-month-label {
            font-size: 14px !important;
            min-width: 90px !important;
        }

        .month-nav-btn { width: 28px !important; height: 28px !important; }

        #hd-bal { font-size: 18px !important; }
    }

    @media (max-width: 390px) {
        .header-month-label { font-size: 13px !important; min-width: 80px !important; }
        .month-nav-btn { width: 26px !important; height: 26px !important; }
        #hd-bal { font-size: 16px !important; }
    }
</style>


<!-- ══ 5. HEADER JAVASCRIPT ═══════════════════════════════════════════════ -->
<script>
    // ─── Master update called from renderAll() ────────────────────────────────

    function updateHeader() {
        // Month label
        var el = document.getElementById('hd-month');
        if (el) el.textContent = monthLabel(AppState.curYear, AppState.curMonth);

        // Net balance
        var stats = getMonthStats(curKey());
        var balEl = document.getElementById('hd-bal');
        if (balEl) {
            balEl.textContent = fmt(stats.bal);
            balEl.style.color = stats.bal >= 0 ? 'var(--acc)' : 'var(--red)';
        }

        // Sync all currency selectors
        ['currency-sel', 'currency-sel-dd', 'currency-sel-mobile'].forEach(function(id) {
            var s = document.getElementById(id);
            if (s) s.value = AppState.currency;
        });

        // Dark button label
        var darkBtn = document.getElementById('dark-btn');
        if (darkBtn) darkBtn.textContent = AppState.darkMode ? 'Light' : 'Dark';

        // Avatar button
        _buildAvatar();

        // Sync dropdown + sheet labels
        _syncDropdownState();
        _syncSheetState();
    }


    // ─── Build avatar button ──────────────────────────────────────────────────

    function _buildAvatar() {
        var wrap = document.getElementById('hdr-avatar-wrap');
        if (!wrap) return;

        var user     = (typeof window !== 'undefined' && window.__USER__) ? window.__USER__ : null;
        var name     = user && user.display_name ? user.display_name
            : user && user.email        ? user.email.split('@')[0]
                : '';
        var initials = name ? name.slice(0, 2).toUpperCase() : '?';

        var isMobile = window.innerWidth <= 600;
        var handler  = isMobile ? 'openProfileSheet()' : 'toggleAvatarDropdown(event)';

        wrap.innerHTML = (
            '<button class="hdr-avatar-btn" onclick="' + handler + '" ' +
            'id="avatar-trigger-btn" aria-label="Account menu">' +
            '<div class="hdr-avatar-circle">' + initials + '</div>' +
            '</button>'
        );

        // Populate dropdown user info
        var ddUser = document.getElementById('dd-user-info');
        if (ddUser && name) {
            ddUser.innerHTML = (
                '<div style="font-size:14px;font-weight:600;color:var(--text);margin-bottom:2px;">' + _hesc(name) + '</div>' +
                (user && user.email ? '<div style="font-size:12px;color:var(--text2);">' + _hesc(user.email) + '</div>' : '')
            );
        }

        // Populate sheet user info
        var psUser = document.getElementById('ps-user-info');
        if (psUser && name) {
            psUser.innerHTML = (
                '<div style="display:flex;align-items:center;gap:12px;">' +
                '<div class="hdr-avatar-circle" style="width:44px;height:44px;font-size:16px;">' + initials + '</div>' +
                '<div>' +
                '<div style="font-size:16px;font-weight:600;">' + _hesc(name) + '</div>' +
                (user && user.email ? '<div style="font-size:13px;color:var(--text2);">' + _hesc(user.email) + '</div>' : '') +
                '</div></div>'
            );
        }
    }


    // ─── Dropdown open / close ────────────────────────────────────────────────

    function toggleAvatarDropdown(event) {
        if (event) event.stopPropagation();

        var dd = document.getElementById('avatar-dropdown');
        var bk = document.getElementById('dropdown-backdrop');
        if (!dd) return;

        var isOpen = dd.style.display === 'block';

        if (isOpen) {
            closeAvatarDropdown();
        } else {
            // Position using fixed coords from the trigger button
            var btn = document.getElementById('avatar-trigger-btn');
            if (btn) {
                var r = btn.getBoundingClientRect();
                dd.style.top   = (r.bottom + 8) + 'px';
                dd.style.right = (window.innerWidth - r.right) + 'px';
                dd.style.left  = 'auto';
            }
            _syncDropdownState();
            dd.style.display = 'block';
            dd.classList.add('dd-open');
            if (bk) bk.style.display = 'block';
        }
    }

    function closeAvatarDropdown() {
        var dd = document.getElementById('avatar-dropdown');
        var bk = document.getElementById('dropdown-backdrop');
        if (dd) { dd.style.display = 'none'; dd.classList.remove('dd-open'); }
        if (bk) bk.style.display = 'none';
    }

    // Close on Escape
    document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape') closeAvatarDropdown();
    });


    // ─── Sync state labels ────────────────────────────────────────────────────

    function _syncDropdownState() {
        var on = AppState.darkMode;
        var icon  = document.getElementById('dd-dark-icon');
        var label = document.getElementById('dd-dark-label');
        var state = document.getElementById('dd-dark-state');
        var sel   = document.getElementById('currency-sel-dd');
        if (icon)  icon.textContent  = on ? '☀️' : '🌙';
        if (label) label.textContent = on ? 'Light mode' : 'Dark mode';
        if (state) state.textContent = on ? 'On' : 'Off';
        if (sel)   sel.value         = AppState.currency;
    }

    function _syncSheetState() {
        var on = AppState.darkMode;
        var icon  = document.getElementById('ps-dark-icon');
        var label = document.getElementById('ps-dark-label');
        var state = document.getElementById('ps-dark-state');
        var sel   = document.getElementById('currency-sel-mobile');
        if (icon)  icon.textContent  = on ? '☀️' : '🌙';
        if (label) label.textContent = on ? 'Light mode' : 'Dark mode';
        if (state) state.textContent = on ? 'On' : 'Off';
        if (sel)   sel.value         = AppState.currency;
    }


    // ─── Mobile sheet open / close ────────────────────────────────────────────

    function openProfileSheet() {
        _syncSheetState();
        var sheet = document.getElementById('profile-sheet');
        if (sheet) { sheet.style.display = 'block'; document.body.style.overflow = 'hidden'; }
    }

    function closeProfileSheet() {
        var sheet = document.getElementById('profile-sheet');
        if (sheet) { sheet.style.display = 'none'; document.body.style.overflow = ''; }
    }


    // ─── Month nav loading state ──────────────────────────────────────────────

    function setMonthNavLoading(isLoading) {
        ['btn-prev-month', 'btn-next-month'].forEach(function(id) {
            var btn = document.getElementById(id);
            if (btn) btn.disabled = isLoading;
        });
    }


    // ─── Helpers ─────────────────────────────────────────────────────────────

    function _hesc(str) {
        return String(str || '')
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;');
    }
</script>
