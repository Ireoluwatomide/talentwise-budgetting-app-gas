<script>
    /**
     * makeMetric(label, value, color)
     *
     * Returns an HTML string for a single metric card.
     * Used by Overview, Savings, Debt, NetWorth, Forecast, and Report screens.
     *
     * Parameters:
     *   label  {string} — card label e.g. 'Income', 'Total Saved'
     *   value  {string} — formatted value e.g. '₦450,000'
     *   color  {string} — optional CSS color for the value. Defaults to 'var(--text)'
     *
     * Usage:
     *   container.innerHTML = [
     *     makeMetric('Income',   fmt(inc), 'var(--acc)'),
     *     makeMetric('Expenses', fmt(exp), 'var(--red)'),
     *     makeMetric('Saved',    fmt(sav), 'var(--blue)'),
     *     makeMetric('Balance',  fmt(bal), bal >= 0 ? 'var(--acc)' : 'var(--red)')
     *   ].join('');
     */
    function makeMetric(label, value, color) {
        color = color || 'var(--text)';
        return (
            '<div class="metric">' +
            '<div class="lbl">' + label + '</div>' +
            '<div class="val" style="color:' + color + ';">' + value + '</div>' +
            '</div>'
        );
    }
</script>
