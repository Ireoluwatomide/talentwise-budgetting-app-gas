<!-- ─────────────────────────────────────────────────────────────────────────
     Sidebar.html — Desktop Left Navigation Sidebar

     LAYOUT:
       The sidebar is a flex column INSIDE #layout-root (the max-width container).
       Expanded → 220px wide. Collapsed → 56px wide.
       The main #app column fills the remaining width automatically via flex:1.
       Everything stays inside the 1100px max-width frame.

     COLLAPSE TOGGLE:
       Uses the sidebar layout icon (two-panel SVG) — top of sidebar in both states.
       When expanded: icon + "Budget Tracker" text on same row.
       When collapsed: only the toggle icon is shown. Logo disappears.

     COLLAPSED STATE:
       - Nav items: icon only, centred in a 36×36px rounded square when active/hover
       - Avatar: larger circle with initials only, centred
       - Tooltips on hover via CSS ::after

     Desktop only — hidden on mobile (BottomNav handles navigation there).
     ───────────────────────────────────────────────────────────────────────── -->

<aside id="app-sidebar" class="sidebar" role="navigation" aria-label="Main navigation">

    <!-- ── TOP ROW: toggle icon (always) + logo text (expanded only) ───────── -->
    <div class="sidebar-header">

        <!-- The sidebar toggle — same icon in both states -->
        <button class="sidebar-toggle" id="sidebar-toggle-btn" onclick="toggleSidebar()" aria-label="Toggle sidebar">
            <!-- Sidebar layout icon: two-panel rectangle with lines in left panel -->
            <svg width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
                <rect x="1.5" y="2.5" width="17" height="15" rx="3" stroke="currentColor" stroke-width="1.5"/>
                <line x1="7" y1="2.5" x2="7" y2="17.5" stroke="currentColor" stroke-width="1.5"/>
                <line x1="3" y1="6.5" x2="5.5" y2="6.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                <line x1="3" y1="9.5" x2="5.5" y2="9.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                <line x1="3" y1="12.5" x2="5.5" y2="12.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
            </svg>
        </button>

        <!-- Logo text — hidden when collapsed -->
        <span class="sidebar-logo-text">Budget Tracker</span>

    </div>

    <!-- ── MONTH NAV — hidden when collapsed ───────────────────────────────── -->
    <div class="sidebar-month-row" id="sidebar-month-nav">
        <button onclick="prevMonth()" class="sidebar-month-btn" title="Previous month" aria-label="Previous month">
            <svg width="12" height="12" viewBox="0 0 12 12" fill="none">

        <div id="sidebar-month-label" class="sidebar-month-label">March 2026</div>

        </button>
    </div>

    <!-- ── NAV ─────────────────────────────────────────────────────────────── -->

        <div class="snav-group-label">Main</div>

<!-- ══ SIDEBAR CSS ══════════════════════════════════════════════════════════ -->
<style>

    /* ── Shell ─────────────────────────────────────────────────────────── */
    .sidebar {
        /* Width transitions smoothly between expanded and collapsed */
        width: 220px;
        flex-shrink: 0;
        background: var(--bg2);
        border-right: 0.5px solid var(--border);
        display: flex;
        flex-direction: column;
        /* Stick to top, fill full height of the scroll container */
        position: sticky;
        top: 0;
        height: 100vh;
        align-self: flex-start;
        overflow: hidden;
        transition: width 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        /* Prevent any child from overflowing the sidebar width */
        min-width: 0;
    }

    .sidebar.collapsed { width: 56px; }

    /* ── Header row: toggle + logo text ────────────────────────────────── */
    .sidebar-header {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 14px 12px 12px;
        flex-shrink: 0;
        min-height: 52px;
    }

    /* Sidebar toggle button */
    .sidebar-toggle {
        width: 32px;
        height: 32px;
        flex-shrink: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: none;
        border: none;
        border-radius: 7px;
        cursor: pointer;
        color: var(--text2);
        padding: 0;
        transition: background var(--transition), color var(--transition);
    }

    .sidebar-toggle:hover {
        background: var(--border);
        color: var(--text);
    }

    /* Logo text — fades out and takes no space when collapsed */
    .sidebar-logo-text {
        font-size: 13px;
        font-weight: 600;
        color: var(--text);
        white-space: nowrap;
        opacity: 1;
        max-width: 160px;
        overflow: hidden;
        transition: opacity 0.15s ease, max-width 0.2s ease;
        flex-shrink: 0;
    }

    .sidebar.collapsed .sidebar-logo-text {
        opacity: 0;
        max-width: 0;
        pointer-events: none;
    }

    /* ── Month nav ──────────────────────────────────────────────────────── */
    .sidebar-month-row {
        display: flex;
        align-items: center;
        gap: 4px;
        padding: 0 12px 12px;
        border-bottom: 0.5px solid var(--border);
        flex-shrink: 0;
        overflow: hidden;
        /* Height transition for smooth hide/show */
        max-height: 48px;
        opacity: 1;
        transition: max-height 0.2s ease, opacity 0.15s ease, padding 0.2s ease;
    }

    .sidebar.collapsed .sidebar-month-row {
        max-height: 0;
        opacity: 0;
        padding-top: 0;
        padding-bottom: 0;
        pointer-events: none;
        border-bottom-color: transparent;
    }

    .sidebar-month-btn {
        width: 24px;
        height: 24px;
        background: var(--bg);
        border: 0.5px solid var(--border);
        border-radius: 6px;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        color: var(--text2);
        padding: 0;
        flex-shrink: 0;
        transition: background var(--transition);
    }

    .sidebar-month-btn:hover { background: var(--border); color: var(--text); }

    .sidebar-month-label {
        flex: 1;
        text-align: center;
        font-size: 12px;
        font-weight: 600;
        color: var(--text);
        white-space: nowrap;
    }

    /* ── Nav ────────────────────────────────────────────────────────────── */
    .sidebar-nav {
        flex: 1;
        overflow-y: auto;
        overflow-x: hidden;
        padding: 8px 8px;
        scrollbar-width: none;
    }
    .sidebar-nav::-webkit-scrollbar { display: none; }

    .snav-group-label {
        font-size: 10px;
        font-weight: 600;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--text2);
        padding: 8px 6px 4px;
        white-space: nowrap;
        opacity: 1;
        overflow: hidden;
        max-height: 30px;
        transition: opacity 0.15s ease, max-height 0.2s ease, padding 0.2s ease;
    }

    .sidebar.collapsed .snav-group-label {
        opacity: 0;
        max-height: 0;
        padding: 0;
        pointer-events: none;
    }

    /* Nav item — wraps icon + label */
    .snav-item {
        display: flex;
        align-items: center;
        gap: 10px;
        width: 100%;
        padding: 4px 6px;
        border: none;
        border-radius: 8px;
        background: transparent;
        font-family: var(--font);
        font-size: 13px;
        font-weight: 400;
        color: var(--text2);
        cursor: pointer;
        text-align: left;
        white-space: nowrap;
        margin-bottom: 1px;
        transition: background var(--transition), color var(--transition);
        /* Prevent text overflowing during collapse animation */
        overflow: hidden;
        min-height: 36px;
    }

    /* Hover: full row gets a background — icon + text together */
    .snav-item:hover {
        color: var(--text);
        background: rgba(0,0,0,0.06);
    }

    /* Active: full row highlight */
    .snav-item.active {
        color: var(--text);
        font-weight: 600;
        background: var(--bg);
        box-shadow: 0 0 0 0.5px var(--border2);
    }

    /* Icon wrapper — centres the SVG, no own background in expanded state */
    .snav-icon-wrap {
        width: 36px;
        height: 36px;
        flex-shrink: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 8px;
        /* background handled by .snav-item in expanded state;
           by .snav-icon-wrap directly in collapsed state (icon-only pill) */
        transition: background var(--transition), box-shadow var(--transition);
    }

    .snav-icon-wrap svg {
        opacity: 0.6;
        transition: opacity var(--transition);
        flex-shrink: 0;
    }

    .snav-item:hover .snav-icon-wrap svg,
    .snav-item.active .snav-icon-wrap svg { opacity: 1; }

    /* Nav item label */
    .snav-label {
        opacity: 1;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        flex: 1;
        transition: opacity 0.15s ease;
    }

    .sidebar.collapsed .snav-label {
        opacity: 0;
        pointer-events: none;
        width: 0;
        flex: 0;
    }

    /* Collapsed: item fills the full 56px column and centres its icon-wrap */
    .sidebar.collapsed .sidebar-nav {
        padding: 8px 0;
    }

    .sidebar.collapsed .snav-item {
        justify-content: center;
        padding: 4px 0;
        width: 56px;
        /* Remove the row-level background in collapsed mode — pill goes on icon-wrap */
        background: transparent !important;
        box-shadow: none !important;
    }

    /* In collapsed mode, active/hover pill is on the icon-wrap only, centred */
    .sidebar.collapsed .snav-item:hover .snav-icon-wrap {
        background: rgba(0,0,0,0.06);
    }

    .sidebar.collapsed .snav-item.active .snav-icon-wrap {
        background: var(--bg);
        box-shadow: 0 0 0 0.5px var(--border2);
    }

    /* Tooltip on hover when collapsed */
    .sidebar.collapsed .snav-item {
        position: relative;
    }

    .sidebar.collapsed .snav-item::after {
        content: attr(title);
        position: absolute;
        left: calc(100% + 10px);
        top: 50%;
        transform: translateY(-50%);
        background: var(--text);
        color: var(--bg);
        font-size: 11px;
        font-weight: 500;
        padding: 5px 10px;
        border-radius: 6px;
        white-space: nowrap;
        pointer-events: none;
        opacity: 0;
        transition: opacity 0.1s ease;
        z-index: 9999;
    }

    .sidebar.collapsed .snav-item:hover::after { opacity: 1; }

    /* ── Footer: avatar ─────────────────────────────────────────────────── */
    .sidebar-footer {
        border-top: 0.5px solid var(--border);
        padding: 10px 8px;
        flex-shrink: 0;
    }

    .sidebar-avatar-btn {
        display: flex;
        align-items: center;
        gap: 10px;
        width: 100%;
        background: transparent;
        border: none;
        border-radius: 8px;
        padding: 4px 6px;
        cursor: pointer;
        text-align: left;
        min-height: 44px;
        transition: background var(--transition);
        overflow: hidden;
    }

    .sidebar-avatar-btn:hover { background: var(--border); }

    /* Avatar circle — sized to match the 36px icon wraps */
    .sidebar-avatar-circle {
        width: 36px;
        height: 36px;
        flex-shrink: 0;
        border-radius: 50%;
        background: var(--text);
        color: var(--bg);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 13px;
        font-weight: 700;
        font-family: var(--font);
        transition: opacity var(--transition);
    }

    .sidebar-avatar-btn:hover .sidebar-avatar-circle { opacity: 0.82; }

    .sidebar-avatar-info {
        flex: 1;
        min-width: 0;
        overflow: hidden;
        opacity: 1;
        transition: opacity 0.15s ease;
    }

    .sidebar-avatar-name {
        font-size: 12px;
        font-weight: 600;
        color: var(--text);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }

    .sidebar-avatar-email {
        font-size: 11px;
        color: var(--text2);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }

    /* Collapsed footer — centre the avatar circle */
    .sidebar.collapsed .sidebar-footer {
        padding: 10px 0;
    }

    .sidebar.collapsed .sidebar-avatar-btn {
        justify-content: center;
        padding: 4px 0;
        width: 56px;
        background: transparent !important;
    }

    .sidebar.collapsed .sidebar-avatar-info {
        opacity: 0;
        pointer-events: none;
        width: 0;
        flex: 0;
        overflow: hidden;
    }

    /* Tooltip for avatar when collapsed */
    .sidebar.collapsed .sidebar-avatar-btn {
        position: relative;
    }

    .sidebar.collapsed .sidebar-avatar-btn::after {
        content: 'Account';
        position: absolute;
        left: calc(100% + 10px);
        top: 50%;
        transform: translateY(-50%);
        background: var(--text);
        color: var(--bg);
        font-size: 11px;
        font-weight: 500;
        padding: 5px 10px;
        border-radius: 6px;
        white-space: nowrap;
        pointer-events: none;
        opacity: 0;
        transition: opacity 0.1s ease;
        z-index: 9999;
    }

    .sidebar.collapsed .sidebar-avatar-btn:hover::after { opacity: 1; }

    /* ── Mobile: hide sidebar entirely ─────────────────────────────────── */
    @media (max-width: 767px) {
        .sidebar { display: none; }
    }

</style>


<!-- ══ SIDEBAR JS ════════════════════════════════════════════════════════════ -->
<script>

    function toggleSidebar() {
        var sidebar = document.getElementById('app-sidebar');
        if (!sidebar) return;

        var isCollapsed = sidebar.classList.toggle('collapsed');

        var btn = document.getElementById('sidebar-collapse-btn');
        if (btn) btn.setAttribute('aria-label', isCollapsed ? 'Expand sidebar' : 'Collapse sidebar');

        // Persist silently
        if (typeof callServerSilent === 'function') {
            callServerSilent('setPreference', 'sidebar_collapsed', isCollapsed ? 'true' : 'false')
                .catch(function() {});
        }
    }

    function updateSidebar() {
        // Month label
        var ml = document.getElementById('sidebar-month-label');
        if (ml && typeof monthLabel === 'function') {
            ml.textContent = monthLabel(AppState.curYear, AppState.curMonth);
        }
        // Active nav item
        _updateSidebarActiveItem(AppState.activeTab || 'overview');
        // Avatar info
        _updateSidebarAvatar();
    }

    function switchTabSidebar(tabId) {
        if (typeof switchTab === 'function') switchTab(tabId);
        _updateSidebarActiveItem(tabId);
        if (typeof updateHeader === 'function') updateHeader();
        if (typeof switchTabMobile === 'function') switchTabMobile(tabId);
    }

    function _updateSidebarActiveItem(tabId) {
        document.querySelectorAll('.snav-item').forEach(function(btn) {
            btn.classList.remove('active');
        });
        var active = document.getElementById('snav-' + tabId);
        if (active) active.classList.add('active');
    }

    function _updateSidebarAvatar() {
        var user     = (typeof window !== 'undefined' && window.__USER__) ? window.__USER__ : null;
        var name     = user && user.display_name ? user.display_name
            : user && user.email ? user.email.split('@')[0] : '';
        var initials = name ? name.slice(0, 2).toUpperCase() : '?';

        var circleEl = document.getElementById('sidebar-avatar-initials');
        var nameEl   = document.getElementById('sidebar-avatar-name');
        var emailEl  = document.getElementById('sidebar-avatar-email');

        if (circleEl) circleEl.textContent = initials;
        if (nameEl)   nameEl.textContent   = name || '—';
        if (emailEl)  emailEl.textContent  = (user && user.email) ? user.email : '';
    }

    // Restore collapsed state from persisted preference
    (function _restoreSidebarState() {
        var prefs = (typeof window !== 'undefined' && window.__BOOTSTRAP__ && window.__BOOTSTRAP__.preferences)
            ? window.__BOOTSTRAP__.preferences : {};
        if (prefs.sidebar_collapsed === true || prefs.sidebar_collapsed === 'true') {
            var sidebar = document.getElementById('app-sidebar');
            if (sidebar) sidebar.classList.add('collapsed');
        }
    })();

</script>
