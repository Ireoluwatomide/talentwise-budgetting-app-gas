<!-- ─────────────────────────────────────────────────────────────────────────
     Tabs.html — Horizontal Tab Navigation Strip

     Desktop: tabs wrap into two rows — primary tabs on row 1,
              secondary (analytics/settings) tabs on row 2.
              No horizontal scrolling needed on desktop.
     Mobile:  tab strip hidden; bottom nav handles navigation.

     Primary tabs (row 1 — core actions):
       Overview, Goals, Bills, Savings, Debt, Net Worth, Recurring, Templates

     Secondary tabs (row 2 — analytics & config):
       Charts, Categories, Insights, Forecast, Multi-Month, Report, Settings
     ───────────────────────────────────────────────────────────────────────── -->

<div class="tabs" id="tab-strip" role="tablist">

    <!-- ── Row 1: Primary tabs ──────────────────────────────────────────────── -->
    <button class="tab active" id="tab-overview"   onclick="switchTab('overview')"   role="tab">Overview</button>
    <button class="tab"        id="tab-goals"      onclick="switchTab('goals')"      role="tab">Goals</button>
    <button class="tab"        id="tab-bills"      onclick="switchTab('bills')"      role="tab">Bills</button>
    <button class="tab"        id="tab-savings"    onclick="switchTab('savings')"    role="tab">Savings</button>
    <button class="tab"        id="tab-debt"       onclick="switchTab('debt')"       role="tab">Debt</button>
    <button class="tab"        id="tab-networth"   onclick="switchTab('networth')"   role="tab">Net Worth</button>
    <button class="tab"        id="tab-recurring"  onclick="switchTab('recurring')"  role="tab">Recurring</button>
    <button class="tab"        id="tab-templates"  onclick="switchTab('templates')"  role="tab">Templates</button>

    <!-- Row break — full-width invisible flex element that forces the wrap -->
    <div class="tab-row-break" aria-hidden="true"></div>

    <!-- ── Row 2: Analytics & config tabs ──────────────────────────────────── -->
    <button class="tab tab-secondary" id="tab-charts"     onclick="switchTab('charts')"     role="tab">Charts</button>
    <button class="tab tab-secondary" id="tab-categories" onclick="switchTab('categories')" role="tab">Categories</button>
    <button class="tab tab-secondary" id="tab-insights"   onclick="switchTab('insights')"   role="tab">Insights</button>
    <button class="tab tab-secondary" id="tab-forecast"   onclick="switchTab('forecast')"   role="tab">Forecast</button>
    <button class="tab tab-secondary" id="tab-multimonth" onclick="switchTab('multimonth')" role="tab">Multi-Month</button>
    <button class="tab tab-secondary" id="tab-report"     onclick="switchTab('report')"     role="tab">Report</button>
    <button class="tab tab-secondary" id="tab-settings"   onclick="switchTab('settings')"   role="tab">Settings</button>

</div>
