<!-- ─────────────────────────────────────────────────────────────────────────
     Tabs.html — Horizontal Tab Navigation Strip

     Desktop (≥ 768px): HIDDEN — the sidebar (Sidebar.html) handles navigation.
     Mobile  (< 768px): HIDDEN — BottomNav handles navigation.

     This file is kept for compatibility. The tab buttons still exist in the
     DOM (so switchTab() can find #tab-{id} elements for active-state tracking)
     but the strip itself is not visible.

     NOTE: If you need to make the horizontal tab strip visible again on any
     breakpoint, remove the display:none from .tabs in styles.css.html.
     ───────────────────────────────────────────────────────────────────────── -->

<div class="tabs" id="tab-strip" role="tablist" aria-hidden="true" style="display:none;">

    <!-- Primary tabs -->
    <button class="tab active" id="tab-overview"   role="tab" onclick="switchTabSidebar('overview')">Overview</button>
    <button class="tab"        id="tab-goals"       role="tab" onclick="switchTabSidebar('goals')">Goals</button>
    <button class="tab"        id="tab-bills"       role="tab" onclick="switchTabSidebar('bills')">Bills</button>
    <button class="tab"        id="tab-savings"     role="tab" onclick="switchTabSidebar('savings')">Savings</button>
    <button class="tab"        id="tab-debt"        role="tab" onclick="switchTabSidebar('debt')">Debt</button>
    <button class="tab"        id="tab-networth"    role="tab" onclick="switchTabSidebar('networth')">Net Worth</button>
    <button class="tab"        id="tab-recurring"   role="tab" onclick="switchTabSidebar('recurring')">Recurring</button>
    <button class="tab"        id="tab-templates"   role="tab" onclick="switchTabSidebar('templates')">Templates</button>

    <!-- Analytics tabs -->
    <button class="tab tab-secondary" id="tab-charts"      role="tab" onclick="switchTabSidebar('charts')">Charts</button>
    <button class="tab tab-secondary" id="tab-categories"  role="tab" onclick="switchTabSidebar('categories')">Categories</button>
    <button class="tab tab-secondary" id="tab-insights"    role="tab" onclick="switchTabSidebar('insights')">Insights</button>
    <button class="tab tab-secondary" id="tab-forecast"    role="tab" onclick="switchTabSidebar('forecast')">Forecast</button>
    <button class="tab tab-secondary" id="tab-multimonth"  role="tab" onclick="switchTabSidebar('multimonth')">Multi-Month</button>
    <button class="tab tab-secondary" id="tab-report"      role="tab" onclick="switchTabSidebar('report')">Report</button>
    <button class="tab tab-secondary" id="tab-settings"    role="tab" onclick="switchTabSidebar('settings')">Settings</button>

</div>
