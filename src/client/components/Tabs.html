<!-- ─────────────────────────────────────────────────────────────────────────
     Tabs.html — Horizontal Tab Navigation Strip

     All 15 tabs in prototype order. switchTab() in utils.js manages
     the .active class on both the button (tab-X) and the pane (pane-X).
     The strip is overflow-x: auto so it scrolls on mobile without wrapping.
     ───────────────────────────────────────────────────────────────────────── -->

<div class="tabs" role="tablist">
    <button class="tab active" id="tab-overview"    onclick="switchTab('overview')"    role="tab">Overview</button>
    <button class="tab"        id="tab-charts"      onclick="switchTab('charts')"      role="tab">Charts</button>
    <button class="tab"        id="tab-categories"  onclick="switchTab('categories')"  role="tab">Categories</button>
    <button class="tab"        id="tab-insights"    onclick="switchTab('insights')"    role="tab">Insights</button>
    <button class="tab"        id="tab-forecast"    onclick="switchTab('forecast')"    role="tab">Forecast</button>
    <button class="tab"        id="tab-multimonth"  onclick="switchTab('multimonth')"  role="tab">Multi-Month</button>
    <button class="tab"        id="tab-report"      onclick="switchTab('report')"      role="tab">Report</button>
    <button class="tab"        id="tab-goals"       onclick="switchTab('goals')"       role="tab">Goals</button>
    <button class="tab"        id="tab-savings"     onclick="switchTab('savings')"     role="tab">Savings</button>
    <button class="tab"        id="tab-debt"        onclick="switchTab('debt')"        role="tab">Debt</button>
    <button class="tab"        id="tab-networth"    onclick="switchTab('networth')"    role="tab">Net Worth</button>
    <button class="tab"        id="tab-recurring"   onclick="switchTab('recurring')"   role="tab">Recurring</button>
    <button class="tab"        id="tab-templates"   onclick="switchTab('templates')"   role="tab">Templates</button>
    <button class="tab"        id="tab-bills"       onclick="switchTab('bills')"       role="tab">Bills</button>
    <button class="tab"        id="tab-settings"    onclick="switchTab('settings')"    role="tab">Settings</button>
</div>
