<!-- ─────────────────────────────────────────────────────────────────────────
     Tabs.html — Tab Navigation Bar

     PURPOSE:
       Horizontal scrollable tab strip. Each tab button activates the
       corresponding screen pane via switchTab() from utils.js.

     TAB ORDER (matches prototype):
       Overview | Charts | Categories | Insights | Forecast | Multi-Month |
       Report | Goals | Savings | Debt | Net Worth | Recurring | Templates |
       Bills | Settings

     INCLUDED VIA:
       <?!= include('src/client/components/Tabs') ?> in the main page template

     STATE:
       Active tab is tracked via the .active CSS class.
       switchTab(tabId) in utils.js manages adding/removing .active.
     ───────────────────────────────────────────────────────────────────────── -->

<div class="tabs">

    <!-- TODO: Each button follows the pattern:
         <button class="tab active" id="tab-overview" onclick="switchTab('overview')">Overview</button>

         Notes:
         - id must be tab-{tabId} to match switchTab() and pane-{tabId} pattern
         - Only Overview gets .active on initial load (first tab visible by default)
         - All other tabs get class="tab" (no .active)
         - white-space: nowrap is handled by .tab in styles.css (prevents wrapping)
         - The strip is overflow-x: auto so it scrolls on narrow mobile screens
    -->

    <button class="tab active" id="tab-overview"    onclick="switchTab('overview')">Overview</button>
    <button class="tab"        id="tab-charts"      onclick="switchTab('charts')">Charts</button>
    <button class="tab"        id="tab-categories"  onclick="switchTab('categories')">Categories</button>
    <button class="tab"        id="tab-insights"    onclick="switchTab('insights')">Insights</button>
    <button class="tab"        id="tab-forecast"    onclick="switchTab('forecast')">Forecast</button>
    <button class="tab"        id="tab-multimonth"  onclick="switchTab('multimonth')">Multi-Month</button>
    <button class="tab"        id="tab-report"      onclick="switchTab('report')">Report</button>
    <button class="tab"        id="tab-goals"       onclick="switchTab('goals')">Goals</button>
    <button class="tab"        id="tab-savings"     onclick="switchTab('savings')">Savings</button>
    <button class="tab"        id="tab-debt"        onclick="switchTab('debt')">Debt</button>
    <button class="tab"        id="tab-networth"    onclick="switchTab('networth')">Net Worth</button>
    <button class="tab"        id="tab-recurring"   onclick="switchTab('recurring')">Recurring</button>
    <button class="tab"        id="tab-templates"   onclick="switchTab('templates')">Templates</button>
    <button class="tab"        id="tab-bills"       onclick="switchTab('bills')">Bills</button>
    <button class="tab"        id="tab-settings"    onclick="switchTab('settings')">Settings</button>

</div>
