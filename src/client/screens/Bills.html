<!-- ─────────────────────────────────────────────────────────────────────────
     Bills.html — Bill Tracker Screen

     TAB: Bills

     SECTIONS:
       1. Bills list with due-date badges and pay/unpay toggle
       2. Add Bill form

     STATE: AppState.bills
     SERVER CALLS: addBill, toggleBillPaid, deleteBill
     ───────────────────────────────────────────────────────────────────────── -->

<div class="pane" id="pane-bills">

    <div style="font-size:12px;color:var(--text2);margin-bottom:1.25rem;">
        Recurring bills — alerts fire 5 days before the due date.
    </div>

    <!-- ── 1. Bills List ──────────────────────────────────────────────────────── -->
    <div id="bills-list">
        <!-- populated by renderBills() -->
    </div>

    <!-- ── 2. Add Bill Form ───────────────────────────────────────────────────── -->
    <div class="sec">Add Bill</div>
    <div style="display:grid;grid-template-columns:1fr 1fr 70px auto;gap:8px;">
        <input id="b-name" class="inp" placeholder="Bill name"/>
        <input id="b-amt"  class="inp" placeholder="Amount"   type="number" min="0" step="any"/>
        <input id="b-day"  class="inp" placeholder="Day"      type="number" min="1" max="31"/>
        <button id="btn-add-bill" onclick="addBillForm()" class="btn-primary">
            <span class="btn-label">Add</span>
            <span class="btn-spinner"></span>
        </button>
    </div>

</div>


<script>
    // =============================================================================
    // Bills screen — render + action functions
    // =============================================================================

    /**
     * renderBills()
     * Called from renderAll() when the Bills pane is active.
     * Computes days-until-due for each bill and renders a row with
     * status badge, pay/unpay toggle, and delete button.
     */
    function renderBills() {
        var listEl = document.getElementById('bills-list');
        if (!listEl) return;

        var bills = AppState.bills || [];

        if (bills.length === 0) {
            listEl.innerHTML = (
                '<div style="text-align:center;color:var(--text2);padding:2rem 0;font-size:13px;">' +
                'No bills added yet.' +
                '</div>'
            );
            return;
        }

        var today = new Date().getDate();
        var html  = '';

        // Sort: unpaid and most-urgent first, then paid bills at the bottom.
        var sorted = bills.slice().sort(function(a, b) {
            if (a.paid && !b.paid) return 1;
            if (!a.paid && b.paid) return -1;
            return _daysUntil(a.due_day, today) - _daysUntil(b.due_day, today);
        });

        sorted.forEach(function(bill) {
            var daysUntil    = _daysUntil(bill.due_day, today);
            var dueLabelText = _dueBadgeText(bill, daysUntil);
            var dueLabelColor= _dueBadgeColor(bill, daysUntil);
            var dueSubline   = bill.due_day + ordinal(bill.due_day) + ' monthly';

            html += (
                '<div class="tx-row">' +

                // LEFT: name + due sub-line
                '<div class="tx-left">' +
                '<div class="tx-meta">' +
                '<div class="tx-name">' + _escB(bill.name) + '</div>' +
                '<div class="tx-cat">'  + dueSubline + '</div>' +
                '</div>' +
                '</div>' +

                // RIGHT: amount, status badge, pay toggle, delete
                '<div class="tx-right" style="gap:8px;">' +
                '<span style="font-family:var(--mono);font-size:13px;">' +
                fmt(bill.amount) +
                '</span>' +
                '<span style="font-size:11px;font-weight:500;color:' + dueLabelColor + ';">' +
                dueLabelText +
                '</span>' +
                // Pay/Unpay button — passes itself so we can disable it during the call
                '<button ' +
                'class="btn-sm" ' +
                'onclick="toggleBillPaid(\'' + bill.id + '\', this)">' +
                (bill.paid ? 'Unpay' : 'Pay') +
                '</button>' +
                // Delete button — passes itself for optimistic dimming
                '<button ' +
                'class="tx-delete" ' +
                'onclick="deleteBill(\'' + bill.id + '\', this)" ' +
                'title="Delete bill">×</button>' +
                '</div>' +

                '</div>'
            );
        });

        listEl.innerHTML = html;
    }


    // ─── ADD BILL ────────────────────────────────────────────────────────────────

    /**
     * addBillForm()
     * Uses withButtonLoading() to show an inline spinner while saving.
     */
    async function addBillForm() {
        var btn    = document.getElementById('btn-add-bill');
        var name   = getVal('b-name');
        var amtRaw = getVal('b-amt');
        var dayRaw = getVal('b-day');

        if (!name) {
            showToast('Please enter a bill name.', 'error');
            document.getElementById('b-name').focus();
            return;
        }

        var amount = parseFloat(amtRaw);
        if (!amtRaw || isNaN(amount) || amount <= 0) {
            showToast('Please enter a valid amount.', 'error');
            document.getElementById('b-amt').focus();
            return;
        }

        var dueDay = parseInt(dayRaw, 10);
        if (!dayRaw || isNaN(dueDay) || dueDay < 1 || dueDay > 31) {
            showToast('Please enter a due day between 1 and 31.', 'error');
            document.getElementById('b-day').focus();
            return;
        }

        await withButtonLoading(btn, async function() {
            try {
                var newBill = await callServer('addBill', name, amount, dueDay);

                if (!AppState.bills) AppState.bills = [];
                AppState.bills.push(newBill);

                clearInputs('b-name', 'b-amt', 'b-day');
                renderAll();
                showToast('Bill added!', 'success');

            } catch (e) {
                // Error toast shown by callServer.
            }
        });
    }


    // ─── TOGGLE PAID ─────────────────────────────────────────────────────────────

    /**
     * toggleBillPaid(billId, payBtnEl)
     * Disables the Pay/Unpay button while the server call is in flight.
     */
    async function toggleBillPaid(billId, payBtnEl) {
        if (payBtnEl) {
            payBtnEl.disabled = true;
            payBtnEl.style.opacity = '0.5';
        }

        try {
            var updated = await callServer('toggleBillPaid', billId);

            AppState.bills = (AppState.bills || []).map(function(b) {
                return b.id === billId ? updated : b;
            });

            renderAll();

        } catch (e) {
            if (payBtnEl) {
                payBtnEl.disabled = false;
                payBtnEl.style.opacity = '';
            }
            // Error toast shown by callServer.
        }
    }


    // ─── DELETE BILL ─────────────────────────────────────────────────────────────

    /**
     * deleteBill(billId, deleteBtnEl)
     * Dims the delete button immediately as optimistic feedback.
     */
    async function deleteBill(billId, deleteBtnEl) {
        if (deleteBtnEl) {
            deleteBtnEl.disabled = true;
            deleteBtnEl.style.opacity = '0.35';
        }

        try {
            await callServer('deleteBill', billId);

            AppState.bills = (AppState.bills || []).filter(function(b) {
                return b.id !== billId;
            });

            renderAll();
            showToast('Bill removed.', 'info');

        } catch (e) {
            if (deleteBtnEl) {
                deleteBtnEl.disabled = false;
                deleteBtnEl.style.opacity = '';
            }
            // Error toast shown by callServer.
        }
    }


    // ─── HELPERS ─────────────────────────────────────────────────────────────────

    /**
     * ordinal(n)
     * Returns the ordinal suffix for a day number.
     * Handles the 11th/12th/13th special cases correctly.
     *
     * ordinal(1)  → 'st'
     * ordinal(11) → 'th'  (not 'st')
     * ordinal(22) → 'nd'
     */
    function ordinal(n) {
        var mod100 = n % 100;
        var mod10  = n % 10;
        if (mod100 >= 11 && mod100 <= 13) return 'th';
        if (mod10 === 1) return 'st';
        if (mod10 === 2) return 'nd';
        if (mod10 === 3) return 'rd';
        return 'th';
    }

    /**
     * _daysUntil(dueDay, today)
     * Computes days until the bill is due, wrapping around month boundaries.
     */
    function _daysUntil(dueDay, today) {
        var d = parseInt(dueDay, 10);
        return d >= today ? d - today : (31 - today) + d;
    }

    /**
     * _dueBadgeText(bill, daysUntil)
     * Returns the status label string for the badge column.
     */
    function _dueBadgeText(bill, daysUntil) {
        if (bill.paid)       return 'Paid';
        if (daysUntil === 0) return 'Due today';
        return 'Due in ' + daysUntil + 'd';
    }

    /**
     * _dueBadgeColor(bill, daysUntil)
     * Returns the CSS colour for the status badge.
     */
    function _dueBadgeColor(bill, daysUntil) {
        if (bill.paid)      return 'var(--acc)';
        if (daysUntil <= 5) return 'var(--red)';
        return 'var(--text2)';
    }

    /**
     * _escB(str) — minimal HTML escape for bill names.
     */
    function _escB(str) {
        return String(str || '')
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;');
    }
</script>
