<!-- ─────────────────────────────────────────────────────────────────────────
     Forecast.html — 6-Month Cash Flow Forecast

     TAB: Forecast

     SECTIONS:
       1. Subtitle
       2. Projected metric cards (Income / Expenses / Savings) + projected net note
       3. 6-month line chart — actual data for past months, projected for future

     All data computed client-side from AppState.transactions.
     Requires ≥ 2 months of data; shows an empty state otherwise.
     switchTab('forecast') calls renderForecast() after a 50ms delay.
     ───────────────────────────────────────────────────────────────────────── -->

<div class="pane" id="pane-forecast">

    <div style="font-size:12px;color:var(--text2);margin-bottom:1.25rem;">
        Based on your average spending over all recorded months.
        Future months show projected figures; past months show actual data.
    </div>

    <!-- Projected metric summary -->
    <div id="forecast-body">
        <!-- populated by renderForecast() -->
    </div>

    <!-- Line chart -->
    <div style="position:relative;width:100%;height:220px;margin-top:1.5rem;">
        <canvas id="forecast-chart"></canvas>
    </div>

</div>


<script>
    // =============================================================================
    // Forecast screen
    // =============================================================================

    /**
     * renderForecast()
     *
     * 1. Collects all loaded month keys from AppState.transactions and sorts them.
     * 2. Requires ≥ 2 months of data — shows a message otherwise.
     * 3. Computes historical averages across all recorded months.
     * 4. Renders the projected metric cards + a note about the projected net.
     * 5. Builds a 6-month label array starting at curMonth.
     *    For each month: uses actual data if available, otherwise uses the averages.
     * 6. Creates a Chart.js line chart with 3 datasets (Income, Expenses, Savings).
     *
     * Called by switchTab('forecast') after a 50ms delay.
     * Also called by renderAll() if this pane is already active.
     */
    function renderForecast() {
        var bodyEl = document.getElementById('forecast-body');
        if (!bodyEl) return;

        // ── Collect recorded months ───────────────────────────────────────────────
        var allKeys = Object.keys(AppState.transactions || {})
            .filter(function(k) {
                var txs = AppState.transactions[k];
                return txs && txs.length > 0;
            })
            .sort(); // YYYY-MM strings sort chronologically

        if (allKeys.length < 2) {
            bodyEl.innerHTML = (
                '<div style="color:var(--text2);font-size:13px;padding:1rem 0;">' +
                'Need at least 2 months of transaction data to generate a forecast.' +
                '</div>'
            );
            destroyChart('forecast-chart');
            return;
        }

        // ── Compute historical averages ───────────────────────────────────────────
        var totInc = 0, totExp = 0, totSav = 0;
        allKeys.forEach(function(k) {
            var s = getMonthStats(k);
            totInc += s.inc;
            totExp += s.exp;
            totSav += s.sav;
        });

        var n      = allKeys.length;
        var avgInc = Math.round(totInc / n);
        var avgExp = Math.round(totExp / n);
        var avgSav = Math.round(totSav / n);
        var avgBal = avgInc - avgExp - avgSav;

        // ── Projected metrics HTML ────────────────────────────────────────────────
        var netColor = avgBal >= 0 ? 'var(--acc)' : 'var(--red)';
        bodyEl.innerHTML = (
            '<div class="row3" style="margin-bottom:1rem;">' +
            makeMetric('Projected Income',   fmt(avgInc), 'var(--acc)') +
            makeMetric('Projected Expenses', fmt(avgExp), 'var(--red)') +
            makeMetric('Projected Savings',  fmt(avgSav), 'var(--blue)') +
            '</div>' +
            '<div style="font-size:12px;color:var(--text2);">' +
            'Based on a ' + n + '-month average. ' +
            'Projected net: <strong style="color:' + netColor + ';">' + fmt(avgBal) + '</strong>/month.' +
            '</div>'
        );

        // ── Build 6-month forward label + data arrays ─────────────────────────────
        // Start from curMonth and step forward 6 months.
        var chartLabels = [];
        var incData     = [];
        var expData     = [];
        var savData     = [];

        var fy = AppState.curYear;
        var fm = AppState.curMonth;

        for (var i = 0; i < 6; i++) {
            var key   = monthKey(fy, fm);
            var label = MONTHS[fm - 1].slice(0, 3) + ' ' + String(fy).slice(2);

            chartLabels.push(label);

            // Use actual data if available for this month, otherwise use averages.
            var hasActual = AppState.transactions[key] && AppState.transactions[key].length > 0;
            if (hasActual) {
                var s = getMonthStats(key);
                incData.push(s.inc);
                expData.push(s.exp);
                savData.push(s.sav);
            } else {
                incData.push(avgInc);
                expData.push(avgExp);
                savData.push(avgSav);
            }

            // Advance to next month, wrapping year.
            fm++;
            if (fm > 12) { fm = 1; fy++; }
        }

        // ── Line chart ────────────────────────────────────────────────────────────
        destroyChart('forecast-chart');

        var canvas = document.getElementById('forecast-chart');
        if (!canvas) return;

        var chart = new Chart(canvas, {
            type: 'line',
            data: {
                labels: chartLabels,
                datasets: [
                    {
                        label:       'Income',
                        data:        incData,
                        borderColor: '#1D9E75',
                        backgroundColor: 'transparent',
                        tension:     0.3,
                        fill:        false,
                        pointRadius: 4,
                        pointBackgroundColor: '#1D9E75'
                    },
                    {
                        label:       'Expenses',
                        data:        expData,
                        borderColor: '#D85A30',
                        backgroundColor: 'transparent',
                        tension:     0.3,
                        fill:        false,
                        pointRadius: 4,
                        pointBackgroundColor: '#D85A30'
                    },
                    {
                        label:       'Savings',
                        data:        savData,
                        borderColor: '#185FA5',
                        backgroundColor: 'transparent',
                        tension:     0.3,
                        fill:        false,
                        pointRadius: 4,
                        pointBackgroundColor: '#185FA5'
                    }
                ]
            },
            options: {
                responsive:          true,
                maintainAspectRatio: false,
                plugins: {
                    legend: { display: false }
                },
                scales: {
                    x: {
                        grid:  { display: false },
                        ticks: { color: '#888', font: { size: 11 } }
                    },
                    y: {
                        grid:  { color: 'rgba(128,128,128,0.1)' },
                        ticks: {
                            color: '#888',
                            font:  { size: 11 },
                            maxTicksLimit: 5,
                            callback: function(v) {
                                var sym  = (typeof FX_SYMBOLS !== 'undefined' && FX_SYMBOLS[AppState.currency]) || '₦';
                                var rate = (typeof FX_RATES   !== 'undefined' && FX_RATES[AppState.currency])   || 1;
                                return sym + Math.round(v * rate).toLocaleString();
                            }
                        }
                    }
                }
            }
        });

        registerChart('forecast-chart', chart);
    }
</script>
