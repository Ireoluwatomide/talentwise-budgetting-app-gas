<!-- ─────────────────────────────────────────────────────────────────────────
     Goals.html — Monthly Budget Goals Screen

     TAB: Goals

     SECTIONS:
       1. Goals list with progress bars (spent vs limit per category)
       2. Add Goal form

     NOTE: Goal categories are always expense-type — budget goals track
     spending limits. The category <select> is populated with only expense
     categories via getCategoriesByType('expense').

     STATE: AppState.goals, AppState.transactions (current month)
     SERVER CALLS: addGoal, deleteGoal
     ───────────────────────────────────────────────────────────────────────── -->

<div class="pane" id="pane-goals">

    <div style="font-size:12px;color:var(--text2);margin-bottom:1.25rem;">
        Monthly spending limits per category. Progress updates live as you add transactions.
    </div>

    <!-- ── 1. Goals List ──────────────────────────────────────────────────────── -->
    <div id="goals-list">
        <!-- populated by renderGoals() -->
    </div>

    <!-- ── 2. Add Goal Form ───────────────────────────────────────────────────── -->
    <div class="sec">Add Goal</div>
    <div style="display:grid;grid-template-columns:1fr 1fr auto;gap:8px;">
        <!--
          g-cat is populated by populateCategorySelects() which always
          fills it with expense-type categories (typeId === null → 'expense').
        -->
        <select id="g-cat"   class="inp"></select>
        <input  id="g-limit" class="inp" type="number" min="1" placeholder="Monthly limit"/>
        <button id="btn-add-goal" onclick="addGoalForm()" class="btn-primary">
            <span class="btn-label">Add</span>
            <span class="btn-spinner"></span>
        </button>
    </div>

</div>


<script>
    // =============================================================================
    // Goals screen — render + action functions
    // =============================================================================

    /**
     * renderGoals()
     * Called from renderAll() whenever the Goals pane is active.
     * Computes current-month spending per category from AppState.transactions
     * and renders a progress bar for each goal.
     */
    function renderGoals() {
        var listEl = document.getElementById('goals-list');
        if (!listEl) return;

        var goals = AppState.goals || [];

        if (goals.length === 0) {
            listEl.innerHTML = (
                '<div style="text-align:center;color:var(--text2);padding:2rem 0;font-size:13px;">' +
                'No goals set. Add a goal below to start tracking your spending.' +
                '</div>'
            );
            return;
        }

        // Build a spending map for the current month: { category: totalSpent }
        var spendMap = _buildGoalSpendMap();
        var html     = '';

        goals.forEach(function(goal) {
            var limit  = parseFloat(goal.monthly_limit) || 0;
            var spent  = spendMap[goal.category]        || 0;
            var p      = pct(spent, limit);           // 0–100, capped
            var isOver = spent > limit;

            // Progress bar colour: red if over, amber if > 70%, green otherwise
            var barColor = isOver        ? 'var(--red)'
                : p > 70       ? 'var(--amber)'
                    :                 'var(--acc)';

            // Amount display colour: red if over budget
            var amtColor = isOver ? 'var(--red)' : 'var(--text2)';

            var overBadge = isOver
                ? ' <span class="badge badge-red">Over limit</span>'
                : '';

            var subLabel = p + '% used' + (isOver ? ' — over budget!' : '');

            html += (
                '<div style="margin-bottom:1.25rem;">' +

                // Header row
                '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;">' +
                '<div style="font-size:13px;font-weight:500;">' +
                _escG(goal.category) + overBadge +
                '</div>' +
                '<div style="display:flex;align-items:center;gap:10px;">' +
                '<span style="font-family:var(--mono);font-size:12px;color:' + amtColor + ';">' +
                fmt(spent) + ' / ' + fmt(limit) +
                '</span>' +
                // Delete button passes itself so we can dim it optimistically
                '<button ' +
                'class="tx-delete" ' +
                'onclick="deleteGoal(\'' + goal.id + '\', this)" ' +
                'title="Remove goal">×</button>' +
                '</div>' +
                '</div>' +

                // Progress bar
                '<div class="prog-track">' +
                '<div class="prog-fill" style="width:' + p + '%;background:' + barColor + ';"></div>' +
                '</div>' +

                // Sub-label
                '<div style="font-size:11px;color:' + (isOver ? 'var(--red)' : 'var(--text2)') + ';margin-top:3px;">' +
                subLabel +
                '</div>' +

                '</div>'
            );
        });

        listEl.innerHTML = html;
    }


    // ─── ADD GOAL ────────────────────────────────────────────────────────────────

    /**
     * addGoalForm()
     * Reads the add-goal form, validates, calls the server, updates AppState.
     * Uses withButtonLoading() to show an inline spinner while saving.
     */
    async function addGoalForm() {
        var btn      = document.getElementById('btn-add-goal');
        var category = getVal('g-cat');
        var limitRaw = getVal('g-limit');
        var limit    = parseFloat(limitRaw);

        if (!category) {
            showToast('Please select a category.', 'error');
            return;
        }
        if (!limitRaw || isNaN(limit) || limit <= 0) {
            showToast('Please enter a valid limit greater than zero.', 'error');
            document.getElementById('g-limit').focus();
            return;
        }

        await withButtonLoading(btn, async function() {
            try {
                var newGoal = await callServer('addGoal', category, limit);

                // Upsert into AppState — replace if same category exists, append otherwise.
                var exists = false;
                AppState.goals = (AppState.goals || []).map(function(g) {
                    if (g.category.toLowerCase() === category.toLowerCase()) {
                        exists = true;
                        return newGoal; // replace with updated object from server
                    }
                    return g;
                });
                if (!exists) AppState.goals.push(newGoal);

                clearInputs('g-limit');
                renderAll();
                showToast('Goal saved!', 'success');

            } catch (e) {
                // Error toast shown by callServer's failure handler.
            }
        });
    }


    // ─── DELETE GOAL ─────────────────────────────────────────────────────────────

    /**
     * deleteGoal(goalId, deleteBtnEl)
     * Removes a goal from AppState and the server.
     * Dims the delete button immediately as optimistic feedback.
     */
    async function deleteGoal(goalId, deleteBtnEl) {
        if (deleteBtnEl) {
            deleteBtnEl.disabled = true;
            deleteBtnEl.style.opacity = '0.35';
        }

        try {
            await callServer('deleteGoal', goalId);

            AppState.goals = (AppState.goals || []).filter(function(g) {
                return g.id !== goalId;
            });

            renderAll();
            showToast('Goal removed.', 'info');

        } catch (e) {
            if (deleteBtnEl) {
                deleteBtnEl.disabled = false;
                deleteBtnEl.style.opacity = '';
            }
            // Error toast shown by callServer.
        }
    }


    // ─── PRIVATE HELPERS ─────────────────────────────────────────────────────────

    /**
     * _buildGoalSpendMap()
     * Sums expense transactions by category for the current month.
     * Returns { categoryName: totalAmount }.
     * Only 'expense' type transactions count toward budget goals.
     */
    function _buildGoalSpendMap() {
        var map = {};
        curTxs().forEach(function(tx) {
            if (tx.type !== 'expense') return;
            var cat = tx.category || 'Other Expense';
            map[cat] = (map[cat] || 0) + (parseFloat(tx.amount) || 0);
        });
        return map;
    }

    /**
     * _escG(str) — minimal HTML escape for goal category names in innerHTML.
     */
    function _escG(str) {
        return String(str || '')
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;');
    }
</script>
