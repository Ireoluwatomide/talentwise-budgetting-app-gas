<!-- ─────────────────────────────────────────────────────────────────────────
     Insights.html — Auto-Generated Spending Insights

     PHASE 3C ENHANCEMENTS (all retained):
       Financial Health Score, data minimums, CTAs, multi-month trend,
       recurring commitment ratio, insight prioritization (top 5)

     PHASE 4 ENHANCEMENTS:
       4.4 — Data density banner at top of pane
       4.5 — All CTA buttons use navigateTo() for context-aware cross-tab nav
       4.6 — savingsRate(key) used for savings rate component in health score
     ───────────────────────────────────────────────────────────────────────── -->

<div class="pane" id="pane-insights">

    <!-- ── 4.4 Data Density Banner ──────────────────────────────────────────── -->
    <div id="insights-density-banner-slot"></div>

    <!-- ── Financial Health Score (3C.1) ─────────────────────────────────────── -->
    <div id="insights-health-section" style="margin-bottom:1.5rem;"></div>

    <!-- ── Insight Cards ──────────────────────────────────────────────────────── -->
    <div id="insights-body"></div>

</div>


<style>
    /* 3C.1 Financial Health Score */
    .fhs-card {
        background: var(--bg2);
        border: 0.5px solid var(--border);
        border-radius: var(--radius-lg);
        padding: 16px 18px;
        display: flex;
        align-items: center;
        gap: 20px;
        margin-bottom: 1.5rem;
    }

    .fhs-ring-wrap {
        position: relative;
        flex-shrink: 0;
        width: 80px;
        height: 80px;
    }

    .fhs-ring-wrap svg { transform: rotate(-90deg); }

    .fhs-grade {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        font-weight: 700;
        line-height: 1;
    }

    .fhs-grade-letter { font-size: 26px; }
    .fhs-grade-score  { font-size: 11px; color: var(--text2); margin-top: 2px; font-weight: 500; }
    .fhs-meta         { flex: 1; min-width: 0; }
    .fhs-title        { font-size: 15px; font-weight: 600; color: var(--text); margin-bottom: 4px; }
    .fhs-summary      { font-size: 13px; color: var(--text2); line-height: 1.5; margin-bottom: 10px; }
    .fhs-components   { display: flex; flex-wrap: wrap; gap: 5px; }

    .fhs-chip {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        font-size: 11px;
        font-weight: 500;
        padding: 2px 8px;
        border-radius: 20px;
    }

    .fhs-chip-pass { background: rgba(29,158,117,0.12); color: var(--acc); }
    .fhs-chip-fail { background: rgba(136,135,128,0.10); color: var(--text2); }

    /* 3C.6 Insight cards with urgency border */
    .insight-card {
        background: var(--bg2);
        border: 0.5px solid var(--border);
        border-radius: var(--radius-lg);
        padding: 14px 16px 14px 18px;
        margin-bottom: 10px;
        display: flex;
        gap: 12px;
        border-left: 3px solid transparent;
        transition: border-color 0.15s;
    }

    .insight-card.urgency-red    { border-left-color: var(--red);   }
    .insight-card.urgency-amber  { border-left-color: var(--amber); }
    .insight-card.urgency-green  { border-left-color: var(--acc);   }
    .insight-card.urgency-blue   { border-left-color: var(--blue);  }

    .insight-icon  { font-size: 22px; flex-shrink: 0; line-height: 1.4; }
    .insight-body  { flex: 1; min-width: 0; }
    .insight-title { font-size: 13px; font-weight: 600; margin-bottom: 4px; }
    .insight-text  { font-size: 12px; color: var(--text2); line-height: 1.6; }
    .insight-cta   { margin-top: 6px; }

    .insight-cta button {
        background: none;
        border: 0.5px solid var(--border2);
        border-radius: 5px;
        padding: 3px 10px;
        font-size: 11px;
        font-weight: 500;
        font-family: var(--font);
        cursor: pointer;
        color: var(--text2);
        transition: border-color .12s, color .12s, background .12s;
    }

    .insight-cta button:hover {
        border-color: var(--acc);
        color: var(--acc);
        background: rgba(29,158,117,0.06);
    }

    /* Unlock placeholder */
    .insight-unlock {
        background: var(--bg2);
        border: 0.5px dashed var(--border2);
        border-radius: var(--radius-lg);
        padding: 12px 16px;
        margin-bottom: 10px;
        display: flex;
        align-items: center;
        gap: 12px;
        opacity: 0.65;
    }

    .insight-unlock-icon { font-size: 18px; flex-shrink: 0; }
    .insight-unlock-text { font-size: 12px; color: var(--text2); line-height: 1.5; }
    .insight-unlock-text strong { color: var(--text); }
</style>


<script>
    // =============================================================================
    // Insights screen — Phase 3C + Phase 4 complete
    // =============================================================================

    function renderInsights() {
        // 4.4 — Data density banner
        if (typeof renderDataQualityBanner === 'function') {
            renderDataQualityBanner('insights-density-banner-slot');
        }

        _renderFinancialHealthScore();
        _renderInsightCards();
    }


    // ─── 3C.1 FINANCIAL HEALTH SCORE (4.6: uses savingsRate()) ──────────────────

    function _renderFinancialHealthScore() {
        var sectionEl = document.getElementById('insights-health-section');
        if (!sectionEl) return;

        var allKeys = Object.keys(AppState.transactions || {})
            .filter(function(k) {
                var txs = AppState.transactions[k];
                return Array.isArray(txs) && txs.length > 0;
            });

        if (allKeys.length === 0) {
            sectionEl.innerHTML = '';
            return;
        }

        var recentKey = allKeys.sort()[allKeys.length - 1];
        var rs        = getMonthStats(recentKey);

        // 1. Savings rate ≥ 20% → 25pts — 4.6: use savingsRate()
        var savRatePct = (typeof savingsRate === 'function') ? savingsRate(recentKey)
            : (rs.inc > 0 ? Math.round((rs.sav / rs.inc) * 100) : 0);
        var c1Pass    = savRatePct >= 20;
        var c1Score   = c1Pass ? 25 : Math.round(savRatePct / 20 * 25);

        // 2. DTI ratio < 36% → 20pts
        var dti    = AppState.debtToIncomeRatio || 0;
        var c2Pass = dti > 0 && dti < 36;
        var c2Score = dti === 0 ? 20 : (dti < 36 ? 20 : Math.round(Math.max(0, (72 - dti) / 72 * 20)));

        // 3. Emergency fund > 0 → 20pts
        var savingsGoals = AppState.savingsGoals || [];
        var efGoal  = savingsGoals.find(function(g) {
            return g.name.toLowerCase().indexOf('emergency') !== -1;
        });
        var c3Pass  = efGoal && (parseFloat(efGoal.saved_amount) || 0) > 0;
        var c3Score = c3Pass ? 20 : 0;

        // 4. No over-budget categories → 20pts
        var goals   = (AppState.goals && AppState.goals[curKey()]) || [];
        var catMap  = {};
        var txsCur  = curTxs();
        if (Array.isArray(txsCur)) {
            txsCur.forEach(function(tx) {
                if (tx.type !== 'expense') return;
                catMap[tx.category || 'Other'] = (catMap[tx.category || 'Other'] || 0) + (parseFloat(tx.amount) || 0);
            });
        }
        var overCount = goals.filter(function(g) {
            return g.monthly_limit > 0 && (catMap[g.category] || 0) > g.monthly_limit;
        }).length;
        var c4Pass  = goals.length > 0 && overCount === 0;
        var c4Score = goals.length === 0 ? 10 : Math.round(Math.max(0, (1 - overCount / Math.max(goals.length, 1))) * 20);

        // 5. Net worth positive → 15pts
        var nwSummary = AppState.netWorthSummary;
        var nw        = nwSummary ? nwSummary.net_worth : 0;
        var c5Pass    = nw > 0;
        var c5Score   = c5Pass ? 15 : 0;

        var totalScore = Math.max(0, Math.min(100, c1Score + c2Score + c3Score + c4Score + c5Score));

        var grade      = totalScore >= 90 ? 'A' : totalScore >= 75 ? 'B' : totalScore >= 60 ? 'C' : totalScore >= 45 ? 'D' : 'F';
        var gradeColor = totalScore >= 75 ? 'var(--acc)' : totalScore >= 60 ? 'var(--amber)' : 'var(--red)';

        var R = 34, CX = 40, CY = 40;
        var circumference = 2 * Math.PI * R;
        var dashOffset    = circumference * (1 - totalScore / 100);

        var summary = totalScore >= 90 ? 'Excellent — your finances are in great shape.'
            : totalScore >= 75  ? 'Good — strong foundations with room to improve.'
                : totalScore >= 60  ? 'Fair — some areas need attention.'
                    : totalScore >= 45  ? 'Needs work — focus on the failing components.'
                        :                     'At risk — take action on multiple areas.';

        var components = [
            { label: 'Savings ≥20%',   pass: c1Pass, score: c1Score, max: 25 },
            { label: 'DTI <36%',       pass: c2Pass, score: c2Score, max: 20 },
            { label: 'Emergency fund', pass: c3Pass, score: c3Score, max: 20 },
            { label: 'On budget',      pass: c4Pass, score: c4Score, max: 20 },
            { label: '+ve net worth',  pass: c5Pass, score: c5Score, max: 15 }
        ];

        var chipsHtml = components.map(function(c) {
            return (
                '<span class="fhs-chip ' + (c.pass ? 'fhs-chip-pass' : 'fhs-chip-fail') + '">' +
                (c.pass ? '✓' : '○') + ' ' + c.label +
                '</span>'
            );
        }).join('');

        sectionEl.innerHTML = (
            '<div class="fhs-card">' +
            '<div class="fhs-ring-wrap">' +
            '<svg width="80" height="80" viewBox="0 0 80 80">' +
            '<circle cx="' + CX + '" cy="' + CY + '" r="' + R + '" fill="none" stroke="var(--border)" stroke-width="7"/>' +
            '<circle cx="' + CX + '" cy="' + CY + '" r="' + R + '" fill="none" stroke="' + gradeColor + '" ' +
            'stroke-width="7" stroke-linecap="round" ' +
            'stroke-dasharray="' + circumference + '" stroke-dashoffset="' + dashOffset + '"/>' +
            '</svg>' +
            '<div class="fhs-grade">' +
            '<span class="fhs-grade-letter" style="color:' + gradeColor + ';">' + grade + '</span>' +
            '<span class="fhs-grade-score">' + totalScore + '/100</span>' +
            '</div>' +
            '</div>' +
            '<div class="fhs-meta">' +
            '<div class="fhs-title">Financial Health Score</div>' +
            '<div class="fhs-summary">' + summary + '</div>' +
            '<div class="fhs-components">' + chipsHtml + '</div>' +
            '</div>' +
            '</div>'
        );
    }


    // ─── 3C.2–3C.6 INSIGHT CARDS (4.5: navigateTo for all CTAs) ─────────────────

    function _renderInsightCards() {
        var bodyEl = document.getElementById('insights-body');
        if (!bodyEl) return;

        var allKeys = Object.keys(AppState.transactions || {})
            .filter(function(k) {
                var txs = AppState.transactions[k];
                return Array.isArray(txs) && txs.length > 0;
            })
            .sort()
            .slice(-12);

        if (allKeys.length === 0) {
            bodyEl.innerHTML = (
                '<div style="color:var(--text2);font-size:13px;padding:1rem 0;">' +
                'Not enough data yet. Add some transactions to see insights.' +
                '</div>'
            );
            return;
        }

        var recentKey = allKeys[allKeys.length - 1];
        var rs        = getMonthStats(recentKey);

        var insights = [];
        var unlocks  = [];

        // ── Insight 1: Savings rate (4.6: use savingsRate()) ─────────────────────
        var savRatePct = (typeof savingsRate === 'function') ? savingsRate(recentKey)
            : (rs.inc > 0 ? Math.round((rs.sav / rs.inc) * 100) : 0);
        var savBody;
        if (savRatePct >= 20) {
            savBody = 'Your savings rate is <strong>' + savRatePct + '%</strong> — hitting the 20% benchmark! Keep it up.';
        } else if (savRatePct >= 10) {
            savBody = 'Your savings rate is <strong>' + savRatePct + '%</strong>. Good progress — aim for 20% for stronger financial health.';
        } else if (rs.inc > 0) {
            savBody = 'Your savings rate is <strong>' + savRatePct + '%</strong>. Consider automating a savings transfer — even 5% makes a difference over time.';
        } else {
            savBody = 'No income recorded for this month. Record your income to see your savings rate.';
        }
        insights.push({
            icon:     '📈',
            title:    'Savings rate',
            body:     savBody,
            urgency:  savRatePct >= 20 ? 'green' : savRatePct >= 10 ? 'amber' : 'red',
            score:    savRatePct >= 20 ? 0 : savRatePct >= 10 ? 2 : 5,
            cta:      null
        });

        // ── Insight 2: 3-month expense trend ─────────────────────────────────────
        if (allKeys.length >= 2) {
            var trendKeys   = allKeys.slice(-Math.min(3, allKeys.length));
            var trendExpArr = trendKeys.map(function(k) { return getMonthStats(k).exp; });
            var trendBody;

            if (trendKeys.length >= 3) {
                var n = trendExpArr.length;
                var xMean = (n - 1) / 2;
                var yMean = trendExpArr.reduce(function(s, v) { return s + v; }, 0) / n;
                var num = 0, den = 0;
                trendExpArr.forEach(function(y, x) {
                    num += (x - xMean) * (y - yMean);
                    den += (x - xMean) * (x - xMean);
                });
                var slope = den !== 0 ? num / den : 0;

                if (Math.abs(slope) < yMean * 0.03) {
                    trendBody = 'Expenses have <strong>held steady</strong> over the last 3 months — consistent spending behaviour.';
                } else if (slope > 0) {
                    var pct3 = yMean > 0 ? Math.round((slope / yMean) * 100) : 0;
                    trendBody = 'Expenses have been <strong style="color:var(--red)">rising</strong> — up roughly ' + pct3 + '% per month over the last 3 months. Worth reviewing.';
                } else {
                    var pct3d = yMean > 0 ? Math.round((Math.abs(slope) / yMean) * 100) : 0;
                    trendBody = 'Expenses have been <strong style="color:var(--acc)">falling</strong> — down roughly ' + pct3d + '% per month over the last 3 months. Great discipline!';
                }
            } else {
                var prev2 = getMonthStats(trendKeys[0]).exp;
                var curr2 = trendExpArr[trendExpArr.length - 1];
                var chg   = prev2 > 0 ? Math.round(((curr2 - prev2) / prev2) * 100) : 0;
                if (chg > 0) {
                    trendBody = 'Expenses <strong style="color:var(--red)">increased by ' + chg + '%</strong> vs last month.';
                } else if (chg < 0) {
                    trendBody = 'Expenses <strong style="color:var(--acc)">decreased by ' + Math.abs(chg) + '%</strong> vs last month — great work!';
                } else {
                    trendBody = 'Expenses are <strong>unchanged</strong> vs last month.';
                }
            }

            insights.push({
                icon:    '💸',
                title:   'Expense trend',
                body:    trendBody,
                urgency: (trendExpArr[trendExpArr.length - 1] > trendExpArr[0] * 1.1) ? 'amber' : 'green',
                score:   3,
                // 4.5: navigateTo with context
                cta:     { label: 'View Spending →', tab: 'spending', context: null }
            });
        } else {
            unlocks.push({ title: 'Expense trend', months: 2 });
        }

        // ── Insight 3: Average monthly spend ─────────────────────────────────────
        if (allKeys.length >= 3) {
            var avgExp = Math.round(
                allKeys.reduce(function(sum, k) { return sum + getMonthStats(k).exp; }, 0) /
                allKeys.length
            );
            var curExp   = rs.exp;
            var avgNote  = curExp > avgExp
                ? 'Spending is <strong style="color:var(--amber);">above</strong> your ' + allKeys.length + '-month average (' + fmt(avgExp) + '/mo) this month.'
                : 'Spending is <strong style="color:var(--acc);">below</strong> your ' + allKeys.length + '-month average (' + fmt(avgExp) + '/mo) — good discipline!';

            insights.push({
                icon:    '📊',
                title:   'Average monthly spend',
                body:    'Your ' + allKeys.length + '-month average is <strong>' + fmt(avgExp) + '</strong>/mo. ' + avgNote,
                urgency: curExp > avgExp * 1.15 ? 'amber' : 'green',
                score:   4,
                cta:     { label: 'View Trends →', tab: 'trends', context: null }
            });
        } else {
            unlocks.push({ title: 'Average monthly spend', months: 3 });
        }

        // ── Insight 4: Recurring commitment ratio ─────────────────────────────────
        var recurring     = (AppState.recurring || []).filter(function(r) { return r.active; });
        var recMonthlyAmt = recurring.reduce(function(sum, r) { return sum + (parseFloat(r.amount) || 0); }, 0);
        if (recurring.length > 0 && rs.inc > 0) {
            var recPct = Math.round((recMonthlyAmt / rs.inc) * 100);
            var recBody;
            if (recPct > 70) {
                recBody = '<strong>' + recPct + '%</strong> of your income (' + fmt(recMonthlyAmt) + ') is committed to recurring expenses. That leaves very little discretionary room — consider reviewing your subscriptions.';
            } else if (recPct > 50) {
                recBody = '<strong>' + recPct + '%</strong> of your income (' + fmt(recMonthlyAmt) + ') goes to recurring expenses. That\'s manageable, but leaves limited flexibility for unplanned costs.';
            } else {
                recBody = '<strong>' + recPct + '%</strong> of your income (' + fmt(recMonthlyAmt) + ') is committed to recurring expenses — a healthy ratio that leaves room for savings and discretionary spending.';
            }
            insights.push({
                icon:    '🔄',
                title:   'Recurring commitment ratio',
                body:    recBody,
                urgency: recPct > 70 ? 'red' : recPct > 50 ? 'amber' : 'green',
                score:   recPct > 70 ? 1 : recPct > 50 ? 3 : 6,
                cta:     { label: 'Manage Recurring →', tab: 'recurring', context: null }
            });
        }

        // ── Insight 5: Over-budget categories (4.5: navigateTo with category context) ─
        var goals   = (AppState.goals && AppState.goals[curKey()]) || [];
        var catMap2 = {};
        var txsCur  = curTxs();
        if (Array.isArray(txsCur)) {
            txsCur.forEach(function(tx) {
                if (tx.type !== 'expense') return;
                catMap2[tx.category || 'Other'] = (catMap2[tx.category || 'Other'] || 0) + (parseFloat(tx.amount) || 0);
            });
        }
        var overGoals = goals.filter(function(g) {
            return g.monthly_limit > 0 && (catMap2[g.category] || 0) > g.monthly_limit;
        });
        if (overGoals.length > 0) {
            var overNames = overGoals.slice(0, 3).map(function(g) { return '<strong>' + _escIns(g.category) + '</strong>'; }).join(', ');
            var firstOverCat = overGoals[0].category;
            insights.push({
                icon:    '⚠️',
                title:   'Over-budget categories',
                body:    'You\'ve exceeded your spending limit for ' + overNames +
                    (overGoals.length > 3 ? ' and ' + (overGoals.length - 3) + ' more' : '') + ' this month.',
                urgency: 'red',
                score:   0,
                // 4.5: navigate to spending tab with category context to highlight it
                cta:     { label: 'View in Spending →', tab: 'spending', context: { categoryName: firstOverCat } }
            });
        }

        // ── Insight 6: Debt overview ──────────────────────────────────────────────
        var debts        = AppState.debts || [];
        var totalDebt    = debts.reduce(function(sum, d) { return sum + (parseFloat(d.amount_owed) || 0); }, 0);
        var totalMonthly = debts.reduce(function(sum, d) { return sum + (parseFloat(d.monthly_payment) || 0); }, 0);
        if (debts.length > 0) {
            var dtiVal  = AppState.debtToIncomeRatio || 0;
            var dtiNote = dtiVal > 36 ? '⚠ DTI above 36% is considered high risk.'
                : dtiVal > 20 ? 'DTI is moderate — within acceptable range.'
                    :                'DTI is healthy.';
            insights.push({
                icon:    '💳',
                title:   'Debt overview',
                body:    '<strong>' + debts.length + '</strong> active debt' + (debts.length > 1 ? 's' : '') +
                    ' totalling <strong>' + fmt(totalDebt) + '</strong>.' +
                    (totalMonthly > 0 ? ' Monthly payments: ' + fmt(totalMonthly) + '.' : '') +
                    (dtiVal > 0 ? ' DTI: ' + dtiVal + '%. ' + dtiNote : ''),
                urgency: dtiVal > 36 ? 'red' : dtiVal > 20 ? 'amber' : 'green',
                score:   dtiVal > 36 ? 1 : 5,
                cta:     { label: 'View Debt Tracker →', tab: 'debt', context: null }
            });
        }

        // ── Insight 7: Net worth ──────────────────────────────────────────────────
        var nwSummary = AppState.netWorthSummary;
        if (nwSummary && nwSummary.item_count > 0) {
            var nw = nwSummary.net_worth;
            insights.push({
                icon:    nw >= 0 ? '📈' : '📉',
                title:   'Net worth',
                body:    'Your net worth is <strong style="color:' + (nw >= 0 ? 'var(--acc)' : 'var(--red)') + ';">' + fmt(nw) + '</strong>. ' +
                    (nw < 0 ? 'Liabilities exceed assets — focus on paying down debt.' :
                        nw === 0 ? 'Exactly at zero — every payment toward debt improves this.' :
                            'Assets exceed liabilities. Keep building!'),
                urgency: nw < 0 ? 'red' : 'green',
                score:   nw < 0 ? 1 : 7,
                cta:     { label: 'View Net Worth →', tab: 'networth', context: null }
            });
        }

        // 3C.6: sort by urgency score, cap at 5
        insights.sort(function(a, b) { return (a.score || 99) - (b.score || 99); });
        var topInsights = insights.slice(0, 5);

        // 4.5: Build CTA using navigateTo()
        var html = topInsights.map(function(ins) {
            var ctaHtml = '';
            if (ins.cta) {
                var navCall;
                if (ins.cta.context) {
                    navCall = 'typeof navigateTo === \'function\' ? navigateTo(\'' +
                        ins.cta.tab + '\', ' + JSON.stringify(ins.cta.context) + ') : switchTabSidebar(\'' + ins.cta.tab + '\')';
                } else {
                    navCall = 'typeof navigateTo === \'function\' ? navigateTo(\'' +
                        ins.cta.tab + '\') : switchTabSidebar(\'' + ins.cta.tab + '\')';
                }

                ctaHtml = (
                    '<div class="insight-cta">' +
                    '<button onclick="' + navCall + '">' +
                    _escIns(ins.cta.label) +
                    '</button>' +
                    '</div>'
                );
            }

            return (
                '<div class="insight-card urgency-' + (ins.urgency || 'blue') + '">' +
                '<div class="insight-icon">' + ins.icon + '</div>' +
                '<div class="insight-body">' +
                '<div class="insight-title" style="color:' + _urgencyColor(ins.urgency) + ';">' + _escIns(ins.title) + '</div>' +
                '<div class="insight-text">' + ins.body + '</div>' +
                ctaHtml +
                '</div>' +
                '</div>'
            );
        }).join('');

        // 3C.2 — Unlock placeholders
        var unlocksHtml = unlocks.map(function(u) {
            return (
                '<div class="insight-unlock">' +
                '<div class="insight-unlock-icon">🔒</div>' +
                '<div class="insight-unlock-text">' +
                '<strong>' + _escIns(u.title) + '</strong><br/>' +
                'Add at least ' + u.months + ' months of transactions to unlock this insight.' +
                '</div>' +
                '</div>'
            );
        }).join('');

        bodyEl.innerHTML = html + unlocksHtml;
    }


    // ─── HELPERS ─────────────────────────────────────────────────────────────────

    function _urgencyColor(urgency) {
        return urgency === 'red'   ? 'var(--red)'
            : urgency === 'amber' ? 'var(--amber)'
                : urgency === 'green' ? 'var(--acc)'
                    :                       'var(--blue)';
    }

    function _escIns(str) {
        return String(str || '')
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;');
    }
</script>
