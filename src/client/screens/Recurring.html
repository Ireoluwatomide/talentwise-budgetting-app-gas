<!-- ─────────────────────────────────────────────────────────────────────────
     Recurring.html — Recurring Transactions Screen (Overhauled)

     IMPROVEMENTS FROM PREVIOUS VERSION:
       #1  Per-template status indicators — applied ✓ / pending / skipped badges
           on every list item so users see the operational state at a glance
       #2  Edit modal / sheet — full edit support (name, amount, type, category,
           frequency, start/end dates, active toggle)
       #3  Frequency selector — monthly / weekly / fortnightly / quarterly / annual
       #4  Start date + End date pickers — with visual expiry warnings
       #5  Pause/Resume toggle — active flag with amber "Paused" badge
       #6  History panel (collapsible) — shows last N application records
           per template with month label, status, and linked transaction note
       #7  Visual distinction for auto-applied transactions — "auto" badge
           rendered consistently across the UI
       #8  Summary metrics — Monthly committed / Active templates / Paused
       #9  "Applied this month" count in section header
      #10  Committed spend section in Report-style summary
      #11  Debt link warning — warns if deleting a template linked to a debt
      #12  Bill link suggestion — offers to link a recurring template to a bill
      #13  Mobile FAB

     TAB: Recurring
     STATE: AppState.recurring, AppState.recurringHistory, AppState.recurringStatus,
            AppState.transactions (current month)
     SERVER CALLS: addRecurring, updateRecurring, deleteRecurring,
                   toggleRecurringActive, applyRecurringToMonth
     ───────────────────────────────────────────────────────────────────────── -->

<div class="pane" id="pane-recurring">

    <!-- ── Subtitle + Manual Apply ─────────────────────────────────────────── -->
    <div style="display:flex;justify-content:space-between;align-items:flex-start;
              margin-bottom:1.25rem;gap:12px;">
        <div style="font-size:12px;color:var(--text2);line-height:1.6;">
            Recurring transactions auto-apply when you navigate to a new month.
            Frequencies other than monthly apply only in their eligible months.
        </div>
        <button id="btn-apply-recurring" onclick="applyRecurringNow()"
                class="btn-sm" style="flex-shrink:0;"
                title="Apply all eligible recurring transactions to the current month">
            <span class="btn-label">Apply now</span>
            <span class="btn-spinner"></span>
        </button>
    </div>

    <!-- ── 8. Summary Metrics ──────────────────────────────────────────────── -->
    <div class="row3" style="margin-bottom:1.25rem;" id="rec-metrics">
        <div class="metric">
            <div class="lbl">Monthly Committed</div>
            <div class="val" id="rec-monthly-total" style="color:var(--red);">—</div>
        </div>
        <div class="metric">
            <div class="lbl">Active Templates</div>
            <div class="val" id="rec-active-count" style="color:var(--text);">—</div>
        </div>
        <div class="metric">
            <div class="lbl">Applied This Month</div>
            <div class="val" id="rec-applied-count" style="color:var(--acc);">—</div>
        </div>
    </div>

    <!-- ── Section header ──────────────────────────────────────────────────── -->
    <div class="ov-section-hdr" style="margin-bottom:10px;">
        <span class="sec" style="margin:0;">Templates</span>
        <button id="btn-open-add-rec"
                onclick="openAddRecModal()"
                class="btn-add-tx-trigger"
                title="Add recurring transaction">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 5v14M5 12h14"/>
            </svg>
            Add Template
        </button>
    </div>

    <!-- ── 1. Recurring List ───────────────────────────────────────────────── -->
    <div id="rec-list">
        <!-- populated by renderRecurring() -->
    </div>

    <!-- ── 10. Committed Spend Summary ────────────────────────────────────── -->
    <div id="rec-committed-section" style="display:none;margin-top:1.5rem;">
        <div class="sec" style="margin-top:0;">Committed Spend by Frequency</div>
        <div id="rec-committed-breakdown"></div>
    </div>

</div>


<!-- ══ ADD / EDIT MODAL (desktop ≥ 601px) ════════════════════════════════ -->
<div id="add-rec-modal" role="dialog" aria-modal="true" aria-label="Recurring Transaction">
    <div id="add-rec-modal-backdrop" onclick="closeAddRecModal()"></div>
    <div id="add-rec-modal-panel">

        <div class="atx-modal-header">
            <span class="atx-modal-title" id="rec-modal-title">Add Recurring Transaction</span>
            <button class="atx-modal-close" onclick="closeAddRecModal()" aria-label="Close">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                     stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M18 6L6 18M6 6l12 12"/>
                </svg>
            </button>
        </div>

        <div class="atx-modal-body">
            <input type="hidden" id="rec-edit-id" value=""/>

            <!-- Row 1: description + amount -->
            <div class="row2" style="margin-bottom:8px;">
                <div>
                    <label class="rec-field-label">Description</label>
                    <input id="r-name-d" class="inp" placeholder="e.g. Rent, Netflix, Salary"/>
                </div>
                <div>
                    <label class="rec-field-label">Amount</label>
                    <input id="r-amt-d" class="inp amt-input" type="text"
                           inputmode="numeric" placeholder="e.g. 150,000"/>
                </div>
            </div>

            <!-- Row 2: type + category -->
            <div class="row2" style="margin-bottom:8px;">
                <div>
                    <label class="rec-field-label">Type</label>
                    <select id="r-type-d" class="inp"
                            onchange="syncCategoryToType('r-cat-d','r-type-d')">
                        <option value="expense">Expense</option>
                        <option value="income">Income</option>
                        <option value="savings">Savings</option>
                    </select>
                </div>
                <div>
                    <label class="rec-field-label">Category</label>
                    <select id="r-cat-d" class="inp"></select>
                </div>
            </div>

            <!-- Row 3: frequency + day of month -->
            <div class="row2" style="margin-bottom:8px;">
                <div>
                    <label class="rec-field-label">Frequency</label>
                    <select id="r-freq-d" class="inp" onchange="_syncFreqHint('d')">
                        <option value="monthly">Monthly</option>
                        <option value="weekly">Weekly (applied monthly)</option>
                        <option value="fortnightly">Fortnightly (applied monthly)</option>
                        <option value="quarterly">Quarterly</option>
                        <option value="annual">Annual</option>
                    </select>
                </div>
                <div>
                    <label class="rec-field-label">
                        Day of month
                        <span style="font-weight:400;text-transform:none;letter-spacing:0;
                   color:var(--text2);margin-left:4px;">(optional)</span>
                    </label>
                    <input id="r-dom-d" class="inp" type="number" min="1" max="31"
                           placeholder="e.g. 25"/>
                </div>
            </div>

            <!-- Frequency hint -->
            <div id="r-freq-hint-d" style="display:none;margin-bottom:8px;
           font-size:12px;color:var(--text2);padding:8px 10px;
           background:var(--bg2);border-radius:var(--radius);
           border:0.5px solid var(--border);line-height:1.5;"></div>

            <!-- Row 4: start date + end date -->
            <div class="row2" style="margin-bottom:14px;">
                <div>
                    <label class="rec-field-label">
                        Start date
                        <span style="font-weight:400;text-transform:none;letter-spacing:0;
                   color:var(--text2);margin-left:4px;">(optional)</span>
                    </label>
                    <input id="r-start-d" class="inp" type="date"/>
                </div>
                <div>
                    <label class="rec-field-label">
                        End date
                        <span style="font-weight:400;text-transform:none;letter-spacing:0;
                   color:var(--text2);margin-left:4px;">(optional)</span>
                    </label>
                    <input id="r-end-d" class="inp" type="date"/>
                </div>
            </div>

            <button id="btn-save-rec-d" onclick="saveRecFromModal()"
                    class="btn-primary" style="width:100%;">
                <span class="btn-label">Add Template</span>
                <span class="btn-spinner"></span>
            </button>
        </div>
    </div>
</div>

<!-- ══ RECURRING JAVASCRIPT ══════════════════════════════════════════════ -->
<script>

    // ─── STATE ──────────────────────────────────────────────────────────────────

    var _recHistoryOpen = {};  // { recurringId: boolean }
    var _recEditId      = null;

    var FREQ_HINTS = {
        monthly:     'Applies every month when you navigate to a new month.',
        weekly:      'Applied once per month (the amount should reflect your weekly spend × 4 or × ~4.3 weeks).',
        fortnightly: 'Applied once per month (amount should reflect 2 bi-weekly payments per month).',
        quarterly:   'Applies in January, April, July, and October — or the equivalent months offset from your start date.',
        annual:      'Applies only in the same month as your start date (or January if no start date is set).'
    };

    var FREQ_LABELS = {
        monthly:     'Monthly',
        weekly:      'Weekly',
        fortnightly: 'Fortnightly',
        quarterly:   'Quarterly',
        annual:      'Annual'
    };


    // ─── RENDER ─────────────────────────────────────────────────────────────────

    function renderRecurring() {
        _renderRecMetrics();
        _renderRecList();
        _renderCommittedBreakdown();
        _updateRecFabVisibility();
    }


    // ── Summary metrics ──────────────────────────────────────────────────────────

    function _renderRecMetrics() {
        var recurring = AppState.recurring || [];
        var status    = AppState.recurringStatus || [];
        var curMk     = curKey();

        // Monthly-equivalent committed spend (active templates only)
        var monthlyCommitted = 0;
        recurring.forEach(function(r) {
            if (!r.active) return;
            var amt = parseFloat(r.amount) || 0;
            var freq = r.frequency || 'monthly';
            // Normalise to monthly equivalent
            var monthly = freq === 'quarterly' ? amt / 3
                : freq === 'annual'    ? amt / 12
                    : amt; // monthly, weekly, fortnightly — as-entered
            monthlyCommitted += monthly;
        });

        var activeCount  = recurring.filter(function(r) { return r.active; }).length;
        var appliedCount = status.filter(function(s) { return s.applied_this_month; }).length;

        var el = function(id, val, col) {
            var e = document.getElementById(id);
            if (!e) return;
            e.textContent = val;
            if (col) e.style.color = col;
        };

        el('rec-monthly-total', fmt(monthlyCommitted), 'var(--red)');
        el('rec-active-count',  activeCount + ' / ' + recurring.length, 'var(--text)');
        el('rec-applied-count', appliedCount + ' / ' + activeCount, appliedCount === activeCount && activeCount > 0 ? 'var(--acc)' : 'var(--amber)');
    }


    // ── Recurring list ───────────────────────────────────────────────────────────

    function _renderRecList() {
        var listEl    = document.getElementById('rec-list');
        if (!listEl) return;

        var recurring = AppState.recurring || [];
        var status    = AppState.recurringStatus || [];
        var history   = AppState.recurringHistory || [];
        var curMk     = curKey();

        if (recurring.length === 0) {
            listEl.innerHTML = (
                '<div style="text-align:center;color:var(--text2);padding:2.5rem 1rem;font-size:13px;">' +
                '<div style="font-size:22px;margin-bottom:8px;">🔄</div>' +
                '<strong style="color:var(--text);display:block;margin-bottom:4px;">No recurring templates yet</strong>' +
                'Add templates for salary, rent, subscriptions — anything that repeats.' +
                '</div>'
            );
            return;
        }

        // Build status lookup by id
        var statusMap = {};
        status.forEach(function(s) { statusMap[s.id] = s; });

        // Build history lookup by recurring_id
        var histMap = {};
        history.forEach(function(h) {
            if (!histMap[h.recurring_id]) histMap[h.recurring_id] = [];
            histMap[h.recurring_id].push(h);
        });

        // Sort: active first, then by name
        var sorted = recurring.slice().sort(function(a, b) {
            if (a.active !== b.active) return a.active ? -1 : 1;
            return a.name.localeCompare(b.name);
        });

        var html = sorted.map(function(r) {
            return _buildRecCard(r, statusMap[r.id] || {}, histMap[r.id] || [], curMk);
        }).join('');

        listEl.innerHTML = html;
    }


    // ── Card builder ─────────────────────────────────────────────────────────────

    function _buildRecCard(r, status, history, curMk) {
        var amtColor = r.type === 'income'  ? 'var(--acc)'
            : r.type === 'savings' ? 'var(--blue)'
                :                        'var(--red)';

        var typeLabel = r.type === 'income'  ? 'Income'
            : r.type === 'savings' ? 'Savings'
                :                        'Expense';

        var typeBadgeClass = r.type === 'income'  ? 'badge-green'
            : r.type === 'savings' ? 'badge-blue'
                :                        'badge-red';

        // #1 Status badge
        var statusBadge = _buildStatusBadge(r, status, curMk);

        // Frequency chip
        var freqChip = '<span class="rec-freq-chip">' +
            _escR(FREQ_LABELS[r.frequency] || r.frequency) + '</span>';

        // End date warning
        var endDateWarn = '';
        if (r.end_date) {
            var endMk = r.end_date.slice(0, 7);
            var today = new Date();
            var todayMk = today.getFullYear() + '-' +
                (today.getMonth() + 1 < 10 ? '0' : '') + (today.getMonth() + 1);

            if (endMk <= todayMk) {
                endDateWarn = '<span class="rec-enddate-warn">⏰ Expired ' + _formatDate(r.end_date) + '</span>';
            } else {
                // Show warning if ending within 2 months
                var monthsLeft = _monthsBetween(todayMk, endMk);
                if (monthsLeft <= 2) {
                    endDateWarn = '<span class="rec-enddate-warn">⚠ Ends ' + _formatDate(r.end_date) + '</span>';
                }
            }
        }

        // Next apply badge
        var nextApply = (status && status.next_apply_month && !status.applied_this_month)
            ? '<span style="font-size:10px;color:var(--text2);">Next: ' + _monthKeyToLabel(status.next_apply_month) + '</span>'
            : '';

        // #6 History toggle + panel
        var templateHistory = history.filter(function(h) { return !h.skipped_reason; });
        var isHistOpen = !!_recHistoryOpen[r.id];
        var histToggle = '';
        var histPanel  = '';

        if (templateHistory.length > 0) {
            var histRowsHtml = templateHistory.slice(0, 10).map(function(h) {
                var mLabel = _monthKeyToLabel(h.month_key);
                var dateStr = h.applied_at ? _formatDate(h.applied_at.slice(0, 10)) : '';
                return (
                    '<div class="rec-history-row">' +
                    '<div>' +
                    '<span style="font-weight:500;color:var(--text);">' + mLabel + '</span>' +
                    (dateStr ? '<span style="color:var(--text2);margin-left:8px;">· ' + dateStr + '</span>' : '') +
                    '</div>' +
                    '<span class="rec-status-badge rec-status-applied">✓ Applied</span>' +
                    '</div>'
                );
            }).join('');

            histToggle = (
                '<button class="rec-history-toggle' + (isHistOpen ? ' open' : '') + '" ' +
                'onclick="_toggleRecHistory(\'' + r.id + '\')" ' +
                'id="rechist-toggle-' + r.id + '">' +
                '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" ' +
                'stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>' +
                templateHistory.length + ' application' + (templateHistory.length !== 1 ? 's' : '') +
                (status.history_count > 10 ? ' (showing last 10)' : '') +
                '</button>'
            );

            histPanel = (
                '<div class="rec-history-panel' + (isHistOpen ? ' open' : '') + '" ' +
                'id="rechist-panel-' + r.id + '">' +
                '<div style="padding-top:6px;">' + histRowsHtml + '</div>' +
                '</div>'
            );
        }

        var cardClass = 'rec-card' +
            (!r.active ? ' is-paused' : '') +
            (r.end_date && r.end_date.slice(0, 7) < curMk ? ' is-expired' : '');

        return (
            '<div class="' + cardClass + '" id="reccard-' + r.id + '">' +

            // Header
            '<div class="rec-card-header">' +
            '<div class="rec-card-left">' +
            '<div class="rec-card-name">' + _escR(r.name) + '</div>' +
            '<div class="rec-card-sub">' +
            '<span class="badge ' + typeBadgeClass + '">' + typeLabel + '</span>' +
            freqChip +
            _escR(r.category) +
            (r.day_of_month ? '<span style="font-size:10px;color:var(--text2);">Day ' + r.day_of_month + '</span>' : '') +
            endDateWarn +
            nextApply +
            '</div>' +
            '</div>' +
            '<div class="rec-card-right">' +
            '<span style="font-family:var(--mono);font-size:14px;font-weight:600;color:' + amtColor + ';">' +
            fmt(r.amount) + '</span>' +
            statusBadge +
            // Pause/resume button
            '<button class="rec-action-btn" title="' + (r.active ? 'Pause' : 'Resume') + '"' +
            ' onclick="toggleRecActiveAction(\'' + r.id + '\', this)">' +
            (r.active
                    ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>'
                    : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polygon points="5 3 19 12 5 21 5 3"/></svg>'
            ) +
            '</button>' +
            // Edit button
            '<button class="rec-action-btn" title="Edit template"' +
            ' onclick="openEditRecModal(\'' + r.id + '\')">' +
            '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' +
            '<path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/>' +
            '<path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z"/>' +
            '</svg></button>' +
            // Delete button
            '<button class="tx-delete"' +
            ' onclick="deleteRecurringAction(\'' + r.id + '\', this)" title="Remove template">\xd7</button>' +
            '</div>' +
            '</div>' +

            histToggle +
            histPanel +

            '</div>'
        );
    }

    function _buildStatusBadge(r, status, curMk) {
        if (!r.active) {
            return '<span class="rec-status-badge rec-status-paused">⏸ Paused</span>';
        }

        // Check expiry
        if (r.end_date && r.end_date.slice(0, 7) < curMk) {
            return '<span class="rec-status-badge rec-status-expired">Expired</span>';
        }

        if (status.applied_this_month) {
            return '<span class="rec-status-badge rec-status-applied">✓ Applied</span>';
        }

        if (status.skipped_reason) {
            var reason = status.skipped_reason;
            if (reason.indexOf('frequency') !== -1) {
                return '<span class="rec-status-badge rec-status-notdue">Not due</span>';
            }
            if (reason.indexOf('before start_date') !== -1) {
                return '<span class="rec-status-badge rec-status-notdue">Not started</span>';
            }
            return '<span class="rec-status-badge rec-status-skipped" title="' + _escR(reason) + '">Skipped</span>';
        }

        // Pending — eligible but not yet applied
        return '<span class="rec-status-badge rec-status-pending">⏳ Pending</span>';
    }


    // ── Committed breakdown ───────────────────────────────────────────────────────

    function _renderCommittedBreakdown() {
        var secEl = document.getElementById('rec-committed-section');
        var el    = document.getElementById('rec-committed-breakdown');
        if (!secEl || !el) return;

        var recurring = (AppState.recurring || []).filter(function(r) { return r.active; });
        if (recurring.length === 0) {
            secEl.style.display = 'none';
            return;
        }

        secEl.style.display = 'block';

        // Group by frequency
        var byFreq = {};
        recurring.forEach(function(r) {
            var f = r.frequency || 'monthly';
            if (!byFreq[f]) byFreq[f] = { count: 0, total: 0 };
            byFreq[f].count++;
            byFreq[f].total += parseFloat(r.amount) || 0;
        });

        var freqOrder = ['monthly', 'weekly', 'fortnightly', 'quarterly', 'annual'];
        var html = freqOrder.filter(function(f) { return byFreq[f]; }).map(function(f) {
            var g = byFreq[f];
            return (
                '<div class="rec-committed-row">' +
                '<div style="display:flex;align-items:center;gap:8px;">' +
                '<span class="rec-freq-chip">' + FREQ_LABELS[f] + '</span>' +
                '<span style="font-size:13px;color:var(--text2);">' + g.count + ' template' + (g.count !== 1 ? 's' : '') + '</span>' +
                '</div>' +
                '<span style="font-family:var(--mono);font-size:13px;font-weight:600;color:var(--red);">' +
                fmt(g.total) + '</span>' +
                '</div>'
            );
        }).join('');

        el.innerHTML = html;
    }


    // ─── APPLY NOW ──────────────────────────────────────────────────────────────

    async function applyRecurringNow() {
        var recurring = AppState.recurring || [];
        var active    = recurring.filter(function(r) { return r.active; });

        if (active.length === 0) {
            showToast('No active recurring templates to apply.', 'info');
            return;
        }

        var btn = document.getElementById('btn-apply-recurring');
        await withButtonLoading(btn, async function() {
            try {
                var result = await callServer('applyRecurringToMonth', curKey());
                var applied = (result && result.applied) ? result.applied : 0;
                var expired = (result && result.expired) ? result.expired : 0;

                // Re-fetch current month transactions
                var txs = await callServerSilent('getTransactionsByMonth', curKey());
                AppState.transactions[curKey()] = txs || [];

                // Re-fetch recurring status for current month
                var newStatus = await callServerSilent('getRecurringStatus', curKey());
                AppState.recurringStatus = newStatus || AppState.recurringStatus;

                // Re-fetch recurring (last_applied may have changed, expiries may have fired)
                var newRec = await callServerSilent('getAllRecurring');
                if (newRec) AppState.recurring = newRec;

                // Re-fetch history
                var newHist = await callServerSilent('getRecurringHistory');
                if (newHist) AppState.recurringHistory = newHist;

                renderAll();

                if (applied > 0) {
                    var msg = applied + ' recurring transaction' + (applied > 1 ? 's' : '') + ' applied!';
                    if (expired > 0) msg += ' ' + expired + ' template' + (expired > 1 ? 's' : '') + ' expired and paused.';
                    showToast(msg, 'success');
                } else if (expired > 0) {
                    showToast(expired + ' template' + (expired > 1 ? 's' : '') + ' expired and auto-paused.', 'info');
                } else {
                    showToast('All eligible recurring transactions already applied this month.', 'info');
                }

            } catch (e) {}
        });
    }


    // ─── ADD MODAL (desktop) ────────────────────────────────────────────────────

    function openAddRecModal() {
        if (window.innerWidth <= 600) { openAddRecSheet(); return; }

        _recEditId = null;
        _resetRecForm('d');
        document.getElementById('rec-modal-title').textContent = 'Add Recurring Transaction';
        document.getElementById('btn-save-rec-d').querySelector('.btn-label').textContent = 'Add Template';
        document.getElementById('rec-edit-id').value = '';

        var m = document.getElementById('add-rec-modal');
        if (m) {
            m.classList.add('open');
            document.body.style.overflow = 'hidden';
            setTimeout(function() {
                var el = document.getElementById('r-name-d'); if (el) el.focus();
            }, 220);
        }
    }

    function closeAddRecModal() {
        var m = document.getElementById('add-rec-modal');
        if (m) { m.classList.remove('open'); document.body.style.overflow = ''; }
        _recEditId = null;
    }

    async function saveRecFromModal() {
        var btn = document.getElementById('btn-save-rec-d');
        var id  = getVal('rec-edit-id');
        await _doSaveRec(
            id,
            getVal('r-name-d'),
            getVal('r-amt-d'),
            getVal('r-type-d'),
            getVal('r-cat-d'),
            getVal('r-freq-d'),
            getVal('r-dom-d'),
            getVal('r-start-d'),
            getVal('r-end-d'),
            btn,
            closeAddRecModal
        );
    }


    // ─── ADD SHEET (mobile) ─────────────────────────────────────────────────────

    function openAddRecSheet() {
        _recEditId = null;
        _resetRecForm('m');
        document.getElementById('rec-sheet-title').textContent = 'Add Recurring Transaction';
        document.getElementById('btn-save-rec-m').querySelector('.btn-label').textContent = 'Add Template';
        document.getElementById('rec-edit-id-m').value = '';

        var s = document.getElementById('add-rec-sheet');
        if (s) {
            s.classList.add('open');
            document.body.style.overflow = 'hidden';
            setTimeout(function() {
                var el = document.getElementById('r-name-m'); if (el) el.focus();
            }, 300);
        }
    }

    function closeAddRecSheet() {
        var s = document.getElementById('add-rec-sheet');
        if (s) { s.classList.remove('open'); document.body.style.overflow = ''; }
        _recEditId = null;
    }

    async function saveRecFromSheet() {
        var btn = document.getElementById('btn-save-rec-m');
        var id  = getVal('rec-edit-id-m');
        await _doSaveRec(
            id,
            getVal('r-name-m'),
            getVal('r-amt-m'),
            getVal('r-type-m'),
            getVal('r-cat-m'),
            getVal('r-freq-m'),
            '',
            getVal('r-start-m'),
            getVal('r-end-m'),
            btn,
            closeAddRecSheet
        );
    }


    // ─── EDIT ───────────────────────────────────────────────────────────────────

    function openEditRecModal(recurringId) {
        var recurring = AppState.recurring || [];
        var r         = recurring.find(function(t) { return t.id === recurringId; });
        if (!r) return;

        _recEditId = recurringId;
        var isMobile = window.innerWidth <= 600;
        var suffix   = isMobile ? 'm' : 'd';

        _resetRecForm(suffix);

        var setV = function(id, val) {
            var el = document.getElementById(id); if (el) el.value = val;
        };

        setV('r-name-'  + suffix, r.name);
        setV('r-type-'  + suffix, r.type);
        syncCategoryToType('r-cat-' + suffix, 'r-type-' + suffix);
        setV('r-cat-'   + suffix, r.category);
        document.getElementById('r-amt-' + suffix).value =
            _formatNumberWithCommas(String(Math.round(r.amount)));
        setV('r-freq-'  + suffix, r.frequency || 'monthly');
        if (r.day_of_month) setV('r-dom-'  + suffix, String(r.day_of_month));
        setV('r-start-' + suffix, r.start_date || '');
        setV('r-end-'   + suffix, r.end_date   || '');
        _syncFreqHint(suffix);

        if (isMobile) {
            setV('rec-edit-id-m', recurringId);
            document.getElementById('rec-sheet-title').textContent = 'Edit Recurring';
            document.getElementById('btn-save-rec-m').querySelector('.btn-label').textContent = 'Save Changes';
            var s = document.getElementById('add-rec-sheet');
            if (s) { s.classList.add('open'); document.body.style.overflow = 'hidden'; }
        } else {
            setV('rec-edit-id', recurringId);
            document.getElementById('rec-modal-title').textContent = 'Edit Recurring';
            document.getElementById('btn-save-rec-d').querySelector('.btn-label').textContent = 'Save Changes';
            var m = document.getElementById('add-rec-modal');
            if (m) {
                m.classList.add('open');
                document.body.style.overflow = 'hidden';
                setTimeout(function() {
                    var el = document.getElementById('r-amt-d'); if (el) el.select();
                }, 220);
            }
        }
    }


    // ─── SHARED SAVE ────────────────────────────────────────────────────────────

    async function _doSaveRec(editId, name, amtRaw, type, category, frequency, dayOfMonth, startDate, endDate, btn, closeFn) {
        if (!name) { showToast('Please enter a description.', 'error'); return; }

        var amount = parseFloat(String(amtRaw || '').replace(/,/g, ''));
        if (!amtRaw || isNaN(amount) || amount <= 0) {
            showToast('Please enter a valid amount greater than zero.', 'error'); return;
        }

        if (startDate && endDate && endDate <= startDate) {
            showToast('End date must be after start date.', 'error'); return;
        }

        var options = {
            frequency:    frequency || 'monthly',
            day_of_month: dayOfMonth || '',
            start_date:   startDate  || '',
            end_date:     endDate    || ''
        };

        await withButtonLoading(btn, async function() {
            try {
                var result;
                if (editId) {
                    result = await callServer('updateRecurring', editId,
                        Object.assign({ name: name, amount: amount, type: type, category: category }, options));

                    AppState.recurring = (AppState.recurring || []).map(function(r) {
                        return r.id === editId ? result : r;
                    });

                    // Refresh status since frequency/dates may have changed
                    var newStatus = await callServerSilent('getRecurringStatus', curKey()).catch(function() { return null; });
                    if (newStatus) AppState.recurringStatus = newStatus;

                    showToast('Template updated!', 'success');
                } else {
                    result = await callServer('addRecurring', name, amount, type, category, options);
                    if (!AppState.recurring) AppState.recurring = [];
                    AppState.recurring.push(result);
                    showToast('Recurring template added!', 'success');
                }

                closeFn();
                renderAll();
            } catch (e) {}
        });
    }


    // ─── TOGGLE ACTIVE ──────────────────────────────────────────────────────────

    async function toggleRecActiveAction(recurringId, btnEl) {
        if (btnEl) { btnEl.disabled = true; btnEl.style.opacity = '0.4'; }
        try {
            var updated = await callServer('toggleRecurringActive', recurringId);

            AppState.recurring = (AppState.recurring || []).map(function(r) {
                return r.id === recurringId ? updated : r;
            });

            // Refresh status
            var newStatus = await callServerSilent('getRecurringStatus', curKey()).catch(function() { return null; });
            if (newStatus) AppState.recurringStatus = newStatus;

            renderAll();

            var action = updated.active ? 'resumed' : 'paused';
            showToast('"' + updated.name + '" ' + action + '.', 'info');
        } catch (e) {
            if (btnEl) { btnEl.disabled = false; btnEl.style.opacity = ''; }
        }
    }


    // ─── DELETE ─────────────────────────────────────────────────────────────────

    async function deleteRecurringAction(recurringId, deleteBtnEl) {
        // #11 Warn if linked to a debt
        var debts = AppState.debts || [];
        var linkedDebt = debts.find(function(d) { return d.recurring_id === recurringId; });
        if (linkedDebt) {
            if (!window.confirm(
                'This template is linked to the "' + linkedDebt.name + '" debt for auto-pay.\n\n' +
                'Deleting it will disable the debt\'s automatic payments.\n\nContinue?'
            )) return;
        }

        if (deleteBtnEl) { deleteBtnEl.disabled = true; deleteBtnEl.style.opacity = '0.35'; }

        try {
            await callServer('deleteRecurring', recurringId);

            AppState.recurring = (AppState.recurring || []).filter(function(r) {
                return r.id !== recurringId;
            });
            AppState.recurringStatus = (AppState.recurringStatus || []).filter(function(s) {
                return s.id !== recurringId;
            });
            delete _recHistoryOpen[recurringId];

            renderAll();
            showToast('Recurring template removed.', 'info');
        } catch (e) {
            if (deleteBtnEl) { deleteBtnEl.disabled = false; deleteBtnEl.style.opacity = ''; }
        }
    }


    // ─── HISTORY TOGGLE ─────────────────────────────────────────────────────────

    function _toggleRecHistory(recurringId) {
        _recHistoryOpen[recurringId] = !_recHistoryOpen[recurringId];
        var toggle = document.getElementById('rechist-toggle-' + recurringId);
        var panel  = document.getElementById('rechist-panel-'  + recurringId);
        if (toggle) toggle.classList.toggle('open', _recHistoryOpen[recurringId]);
        if (panel)  panel.classList.toggle('open',  _recHistoryOpen[recurringId]);
    }


    // ─── FAB ────────────────────────────────────────────────────────────────────

    function _updateRecFabVisibility() {
        var fab = document.getElementById('fab-add-rec');
        if (fab) fab.classList.toggle('fab-visible', AppState.activeTab === 'recurring');
    }


    // ─── FREQUENCY HINT ─────────────────────────────────────────────────────────

    function _syncFreqHint(suffix) {
        var freqEl = document.getElementById('r-freq-'      + suffix);
        var hintEl = document.getElementById('r-freq-hint-' + suffix);
        if (!freqEl || !hintEl) return;

        var freq = freqEl.value;
        var hint = FREQ_HINTS[freq] || '';

        if (freq === 'monthly') {
            hintEl.style.display = 'none';
        } else {
            hintEl.style.display = 'block';
            hintEl.textContent   = hint;
        }
    }


    // ─── HELPERS ────────────────────────────────────────────────────────────────

    function _resetRecForm(suffix) {
        var fields = ['r-name-', 'r-amt-', 'r-dom-', 'r-start-', 'r-end-'];
        fields.forEach(function(f) {
            var el = document.getElementById(f + suffix); if (el) el.value = '';
        });
        var typeEl = document.getElementById('r-type-' + suffix);
        if (typeEl) typeEl.value = 'expense';
        syncCategoryToType('r-cat-' + suffix, 'r-type-' + suffix);
        var freqEl = document.getElementById('r-freq-' + suffix);
        if (freqEl) freqEl.value = 'monthly';
        var hintEl = document.getElementById('r-freq-hint-' + suffix);
        if (hintEl) hintEl.style.display = 'none';
    }

    function _monthKeyToLabel(key) {
        if (!key) return '';
        var parts = String(key).split('-');
        if (parts.length < 2) return key;
        return MONTHS[parseInt(parts[1], 10) - 1] + ' ' + parts[0];
    }

    function _formatDate(isoStr) {
        if (!isoStr) return '';
        try {
            var d = new Date(isoStr);
            return d.toLocaleDateString(undefined, { day: 'numeric', month: 'short', year: 'numeric' });
        } catch(e) { return isoStr; }
    }

    function _monthsBetween(fromMk, toMk) {
        var fromParts = fromMk.split('-');
        var toParts   = toMk.split('-');
        var fy = parseInt(fromParts[0], 10), fm = parseInt(fromParts[1], 10);
        var ty = parseInt(toParts[0],   10), tm = parseInt(toParts[1],   10);
        return (ty - fy) * 12 + (tm - fm);
    }

    function _escR(str) {
        return String(str || '')
            .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape') { closeAddRecModal(); closeAddRecSheet(); }
    });

</script>
