<!-- ─────────────────────────────────────────────────────────────────────────
     Report.html — Full Budget Summary Report

     TAB: Report

     SECTIONS (inside a single bordered card):
       1. Header bar — "Budget Summary Report" + N months recorded
       2. All-time totals (Income / Expenses / Saved)
       3. Monthly averages + savings rate
       4. Highlights (Best Month / Highest Spend Month)
       5. Top spending categories (all-time, sorted descending)
       6. Month-by-month table (all loaded months, oldest first)

     Print button triggers window.print() — styles.css hides chrome in @media print.
     All data from AppState.transactions — no server call needed.
     switchTab('report') calls renderReport() immediately (no canvas delay).
     ───────────────────────────────────────────────────────────────────────── -->

<div class="pane" id="pane-report">

    <!-- Header row: subtitle + print button -->
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1.25rem;">
        <div style="font-size:12px;color:var(--text2);">Full budget summary — all loaded months.</div>
        <button onclick="window.print()" class="btn-sm">Print / PDF</button>
    </div>

    <!-- Report body — populated by renderReport() -->
    <div id="report-body"></div>

</div>


<script>
    // =============================================================================
    // Report screen
    // =============================================================================

    /**
     * renderReport()
     *
     * Assembles the full printable report from AppState.transactions.
     * Only months that have at least one transaction are included.
     *
     * Called by switchTab('report') and renderAll() when this pane is active.
     */
    function renderReport() {
        var bodyEl = document.getElementById('report-body');
        if (!bodyEl) return;

        // ── Collect all months that have data ─────────────────────────────────────
        var keys = Object.keys(AppState.transactions || {})
            .filter(function(k) {
                var txs = AppState.transactions[k];
                return txs && txs.length > 0;
            })
            .sort(); // oldest first

        if (keys.length === 0) {
            bodyEl.innerHTML = (
                '<div style="color:var(--text2);font-size:13px;padding:1rem 0;">' +
                'No transaction data loaded yet. Add transactions to generate a report.' +
                '</div>'
            );
            return;
        }

        // ── Aggregate all-time totals ─────────────────────────────────────────────
        var totInc = 0, totExp = 0, totSav = 0;
        keys.forEach(function(k) {
            var s = getMonthStats(k);
            totInc += s.inc;
            totExp += s.exp;
            totSav += s.sav;
        });

        var n       = keys.length;
        var avgInc  = Math.round(totInc / n);
        var avgExp  = Math.round(totExp / n);
        var avgSav  = Math.round(totSav / n);
        var savRate = totInc > 0 ? Math.round((totSav / totInc) * 100) : 0;

        // ── Best and worst months ────────────────────────────────────────────────
        var bestKey  = keys.reduce(function(best, k) {
            return getMonthStats(k).bal > getMonthStats(best).bal ? k : best;
        }, keys[0]);
        var worstKey = keys.reduce(function(worst, k) {
            return getMonthStats(k).exp > getMonthStats(worst).exp ? k : worst;
        }, keys[0]);

        var bestStats  = getMonthStats(bestKey);
        var worstStats = getMonthStats(worstKey);
        var bestParts  = bestKey.split('-');
        var worstParts = worstKey.split('-');
        var bestLabel  = MONTHS[parseInt(bestParts[1], 10) - 1] + ' ' + bestParts[0];
        var worstLabel = MONTHS[parseInt(worstParts[1], 10) - 1] + ' ' + worstParts[0];

        // ── All-time category totals ─────────────────────────────────────────────
        var catTotals = {};
        keys.forEach(function(k) {
            var txs = AppState.transactions[k] || [];
            txs.forEach(function(tx) {
                if (tx.type !== 'expense') return;
                var cat = tx.category || 'Other';
                catTotals[cat] = (catTotals[cat] || 0) + (parseFloat(tx.amount) || 0);
            });
        });

        var topCats = Object.keys(catTotals)
            .map(function(cat) { return { cat: cat, amt: catTotals[cat] }; })
            .sort(function(a, b) { return b.amt - a.amt; });

        // ── Month-by-month table rows ─────────────────────────────────────────────
        var tableRows = keys.map(function(k) {
            var s       = getMonthStats(k);
            var parts   = k.split('-');
            var label   = MONTHS[parseInt(parts[1], 10) - 1].slice(0, 3) + ' ' + parts[0];
            var sp      = s.inc > 0 ? Math.round((s.sav / s.inc) * 100) : 0;
            var balCol  = s.bal >= 0 ? 'var(--text)' : 'var(--red)';

            var cell = function(val, color, mono) {
                return (
                    '<td style="padding:7px 8px;text-align:right;border-bottom:0.5px solid var(--border);' +
                    (color ? 'color:' + color + ';' : '') +
                    (mono  ? 'font-family:var(--mono);' : '') + '">' +
                    val +
                    '</td>'
                );
            };

            return (
                '<tr>' +
                '<td style="padding:7px 8px;border-bottom:0.5px solid var(--border);">' + label + '</td>' +
                cell(fmt(s.inc), 'var(--acc)',  true) +
                cell(fmt(s.exp), 'var(--red)',  true) +
                cell(fmt(s.sav), 'var(--blue)', true) +
                cell(fmt(s.bal), balCol,        true) +
                cell(sp + '%',   '',            true) +
                '</tr>'
            );
        }).join('');

        // ── Top categories rows ───────────────────────────────────────────────────
        var topCatRows = topCats.map(function(entry) {
            var catPct = totExp > 0 ? Math.round((entry.amt / totExp) * 100) : 0;
            return (
                '<div class="tx-row">' +
                '<div style="display:flex;align-items:center;gap:8px;">' +
                '<span style="width:8px;height:8px;border-radius:2px;' +
                'background:' + getCategoryColor(entry.cat) + ';display:inline-block;"></span>' +
                '<span style="font-size:13px;">' + _escRpt(entry.cat) + '</span>' +
                '</div>' +
                '<div>' +
                '<span style="font-family:var(--mono);font-size:13px;">' + fmt(entry.amt) + '</span>' +
                '<span style="font-size:11px;color:var(--text2);margin-left:8px;">' + catPct + '%</span>' +
                '</div>' +
                '</div>'
            );
        }).join('');

        // ── Table header ─────────────────────────────────────────────────────────
        var thStyle = function(i) {
            return 'padding:6px 8px;font-size:10px;font-weight:500;text-transform:uppercase;' +
                'letter-spacing:0.06em;color:var(--text2);border-bottom:0.5px solid var(--border);' +
                'text-align:' + (i === 0 ? 'left' : 'right') + ';';
        };
        var tableHeaders = ['Month', 'Income', 'Expenses', 'Saved', 'Balance', 'Save %']
            .map(function(h, i) { return '<th style="' + thStyle(i) + '">' + h + '</th>'; })
            .join('');

        // ── Assemble report ───────────────────────────────────────────────────────
        var sec = function(label) {
            return '<div style="font-size:10px;font-weight:500;letter-spacing:0.08em;' +
                'text-transform:uppercase;color:var(--text2);margin-bottom:10px;">' +
                label +
                '</div>';
        };

        var pad = 'padding:14px 18px;border-bottom:0.5px solid var(--border);';

        bodyEl.innerHTML = (
            '<div style="border:0.5px solid var(--border);border-radius:12px;overflow:hidden;">' +

            // ── Section 1: Header bar
            '<div style="background:var(--bg2);' + pad + '">' +
            '<div style="font-size:10px;font-weight:500;letter-spacing:0.08em;' +
            'text-transform:uppercase;color:var(--text2);margin-bottom:3px;">Budget Summary Report</div>' +
            '<div style="font-size:17px;font-weight:500;">' + n + ' month' + (n > 1 ? 's' : '') + ' recorded</div>' +
            '</div>' +

            // ── Section 2: Totals
            '<div style="' + pad + '">' +
            sec('Totals') +
            '<div class="row3">' +
            _statCell('Total Income',   fmt(totInc), 'var(--acc)') +
            _statCell('Total Expenses', fmt(totExp), 'var(--red)') +
            _statCell('Total Saved',    fmt(totSav), 'var(--blue)') +
            '</div>' +
            '</div>' +

            // ── Section 3: Averages
            '<div style="' + pad + '">' +
            sec('Monthly Averages') +
            '<div class="row3">' +
            _statCell('Avg Monthly Income', fmt(avgInc), '') +
            _statCell('Avg Monthly Spend',  fmt(avgExp), '') +
            _statCell('Savings Rate', savRate + '%', savRate >= 20 ? 'var(--acc)' : 'var(--amber)') +
            '</div>' +
            '</div>' +

            // ── Section 4: Highlights
            '<div style="' + pad + '">' +
            sec('Highlights') +
            '<div class="row2">' +
            '<div style="background:var(--bg2);border-radius:8px;padding:12px;">' +
            '<div style="font-size:10px;color:var(--text2);margin-bottom:2px;">Best Month</div>' +
            '<div style="font-size:13px;font-weight:500;">' + bestLabel + '</div>' +
            '<div style="font-family:var(--mono);font-size:12px;color:var(--acc);">' + fmt(bestStats.bal) + ' net</div>' +
            '</div>' +
            '<div style="background:var(--bg2);border-radius:8px;padding:12px;">' +
            '<div style="font-size:10px;color:var(--text2);margin-bottom:2px;">Highest Spend Month</div>' +
            '<div style="font-size:13px;font-weight:500;">' + worstLabel + '</div>' +
            '<div style="font-family:var(--mono);font-size:12px;color:var(--red);">' + fmt(worstStats.exp) + ' spent</div>' +
            '</div>' +
            '</div>' +
            '</div>' +

            // ── Section 5: Top categories
            '<div style="' + pad + '">' +
            sec('Top Categories') +
            topCatRows +
            '</div>' +

            // ── Section 6: Month-by-month table
            '<div style="padding:14px 18px;">' +
            sec('Month-by-Month') +
            '<table>' +
            '<thead><tr>' + tableHeaders + '</tr></thead>' +
            '<tbody>' + tableRows + '</tbody>' +
            '</table>' +
            '</div>' +

            '</div>'
        );
    }


    // ─── PRIVATE HELPERS ─────────────────────────────────────────────────────────

    function _statCell(label, value, color) {
        return (
            '<div>' +
            '<div style="font-size:11px;color:var(--text2);margin-bottom:2px;">' + label + '</div>' +
            '<div style="font-family:var(--mono);font-size:14px;font-weight:500;' +
            (color ? 'color:' + color + ';' : '') + '">' + value + '</div>' +
            '</div>'
        );
    }

    function _escRpt(str) {
        return String(str || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }
</script>
