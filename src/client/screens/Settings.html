<!-- ─────────────────────────────────────────────────────────────────────────
     Settings.html — App Settings

     TAB: Settings

     SECTIONS:
       1. Custom Categories — list + add with colour picker
       2. Divider
       3. Danger Zone — Clear Current Month

     STATE: AppState.categories
     SERVER CALLS: addCategory, deleteCategory, clearMonthTransactions
     ───────────────────────────────────────────────────────────────────────── -->

<div class="pane" id="pane-settings">

  <!-- ── 1. Custom Categories ────────────────────────────────────────────── -->
  <div class="sec" style="margin-top:0;">Custom Categories</div>
  <div id="cat-settings-list" style="margin-bottom:1rem;"></div>

  <!-- Add category form -->
  <div style="display:flex;gap:8px;margin-bottom:1.5rem;flex-wrap:wrap;">
    <input id="new-cat-name" class="inp" placeholder="Category name" style="flex:1;min-width:120px;"/>
    <input
            id="new-cat-color"
            type="color"
            value="#1D9E75"
            style="width:44px;height:38px;border:0.5px solid var(--border2);border-radius:var(--radius);
             padding:2px;cursor:pointer;background:transparent;flex-shrink:0;"/>
    <button id="btn-add-cat" onclick="addCategoryForm()" class="btn-primary">
      <span class="btn-label">Add</span>
      <span class="btn-spinner"></span>
    </button>
  </div>

  <!-- ── 2. Divider ──────────────────────────────────────────────────────── -->
  <hr class="divider"/>

  <!-- ── 3. Danger Zone ──────────────────────────────────────────────────── -->
  <div class="sec">Danger Zone</div>
  <button
          id="btn-clear-month"
          onclick="clearCurrentMonth()"
          class="btn-sm btn-danger">
    Clear Current Month
  </button>

</div>


<script>
  // =============================================================================
  // Settings screen
  // =============================================================================

  /**
   * renderSettings()
   *
   * Rebuilds the category list from AppState.categories.
   * The first 9 entries are default categories — no delete button.
   * Index 9+ are user-added — each gets a × delete button.
   *
   * Called by renderAll() when Settings pane is active.
   */
  function renderSettings() {
    var listEl = document.getElementById('cat-settings-list');
    if (!listEl) return;

    var cats = AppState.categories || [];

    if (cats.length === 0) {
      listEl.innerHTML = '<div style="font-size:13px;color:var(--text2);">No categories.</div>';
      return;
    }

    var DEFAULT_COUNT = 9; // indices 0–8 are protected defaults

    listEl.innerHTML = cats.map(function(cat, i) {
      var isDefault  = i < DEFAULT_COUNT;
      // Delete button passes itself for optimistic dimming
      var deleteBtn  = isDefault
              ? '' // defaults are protected
              : '<button class="tx-delete" onclick="deleteCat(\'' + _escAttr(cat.name) + '\', this)" ' +
              'title="Remove category">×</button>';

      return (
              '<div style="display:flex;align-items:center;gap:8px;margin-bottom:6px;">' +
              '<span style="width:14px;height:14px;border-radius:3px;background:' + cat.color +
              ';display:inline-block;flex-shrink:0;"></span>' +
              '<span style="font-size:13px;flex:1;">' + _escSt(cat.name) + '</span>' +
              deleteBtn +
              '</div>'
      );
    }).join('');
  }


  // ─── ADD CATEGORY ─────────────────────────────────────────────────────────────

  /**
   * addCategoryForm()
   * Uses withButtonLoading() to show an inline spinner while saving.
   */
  async function addCategoryForm() {
    var btn   = document.getElementById('btn-add-cat');
    var name  = getVal('new-cat-name');
    var color = document.getElementById('new-cat-color')
            ? document.getElementById('new-cat-color').value
            : '#1D9E75';

    if (!name) {
      showToast('Please enter a category name.', 'error');
      document.getElementById('new-cat-name').focus();
      return;
    }

    // Client-side duplicate check for immediate feedback.
    var cats = AppState.categories || [];
    var isDuplicate = cats.some(function(c) {
      return c.name.toLowerCase() === name.toLowerCase();
    });
    if (isDuplicate) {
      showToast('"' + name + '" already exists.', 'error');
      return;
    }

    await withButtonLoading(btn, async function() {
      try {
        var updated = await callServer('addCategory', name, color);

        // Server returns the full updated categories array.
        AppState.categories = updated;

        clearInputs('new-cat-name');
        renderAll(); // refreshes category list + all <select> dropdowns
        showToast('Category added!', 'success');

      } catch (e) {
        // Error toast shown by callServer.
      }
    });
  }


  // ─── DELETE CATEGORY ──────────────────────────────────────────────────────────

  /**
   * deleteCat(categoryName, deleteBtnEl)
   * Dims the delete button immediately as optimistic feedback.
   */
  async function deleteCat(categoryName, deleteBtnEl) {
    if (!window.confirm('Remove the "' + categoryName + '" category?')) return;

    if (deleteBtnEl) {
      deleteBtnEl.disabled = true;
      deleteBtnEl.style.opacity = '0.35';
    }

    try {
      var updated = await callServer('deleteCategory', categoryName);

      AppState.categories = updated;

      renderAll();
      showToast('Category removed.', 'info');

    } catch (e) {
      if (deleteBtnEl) {
        deleteBtnEl.disabled = false;
        deleteBtnEl.style.opacity = '';
      }
      // Error toast shown by callServer (includes "default category" protection error).
    }
  }


  // ─── CLEAR CURRENT MONTH ──────────────────────────────────────────────────────

  /**
   * clearCurrentMonth()
   * Disables the button and shows a text indicator while the server call runs.
   */
  async function clearCurrentMonth() {
    var label = monthLabel(AppState.curYear, AppState.curMonth);

    if (!window.confirm(
            'Clear all transactions for ' + label + '?\n\nThis cannot be undone.'
    )) return;

    var btn = document.getElementById('btn-clear-month');
    if (btn) {
      btn.disabled = true;
      btn.textContent = 'Clearing…';
    }

    try {
      await callServer('clearMonthTransactions', curKey());

      AppState.transactions[curKey()] = [];

      renderAll();
      showToast(label + ' cleared.', 'info');

    } catch (e) {
      // Error toast shown by callServer.
    } finally {
      if (btn) {
        btn.disabled = false;
        btn.textContent = 'Clear Current Month';
      }
    }
  }


  // ─── HELPERS ─────────────────────────────────────────────────────────────────

  function _escSt(str) {
    return String(str || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  // For use in inline onclick="..." attribute values — escapes single quotes.
  function _escAttr(str) {
    return String(str || '').replace(/'/g, "\\'").replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }
</script>
