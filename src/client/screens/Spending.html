<!-- ─────────────────────────────────────────────────────────────────────────
     Spending.html — Spending Analytics (merged Charts + Categories)

     PHASE 3 ENHANCEMENTS:
       3A.1 — Donut center total label (beforeDraw plugin) ✓ (Phase 2)
       3A.2 — Interactive donut segments → scroll + highlight ✓ (Phase 2)
       3A.3 — Month-over-month delta chips on category rows ✓ (Phase 2)
       3A.4 — Quick-edit limit inline: pencil icon opens compact limit editor
       3A.5 — Category sparklines: 3-bar inline SVG per category row
       3A.6 — CSS variable color resolution for dark mode ✓ (Phase 2)
       3A.7 — Dark mode chart live update via renderAllCharts()

     Tab ID: "spending"
     ───────────────────────────────────────────────────────────────────────── -->

<div class="pane" id="pane-spending">

    <!-- ── 1. Bar Chart: Income vs Expenses vs Savings ───────────────────────── -->
    <div class="sec" style="margin-top:0;">Income vs Expenses vs Savings</div>

    <div style="display:flex;gap:16px;margin-bottom:10px;font-size:12px;color:var(--text2);">
    <span style="display:flex;align-items:center;gap:5px;">
      <span style="width:10px;height:10px;border-radius:2px;background:var(--acc);display:inline-block;"></span>Income
    </span>
        <span style="display:flex;align-items:center;gap:5px;">
      <span style="width:10px;height:10px;border-radius:2px;background:var(--red);display:inline-block;"></span>Expenses
    </span>
        <span style="display:flex;align-items:center;gap:5px;">
      <span style="width:10px;height:10px;border-radius:2px;background:var(--blue);display:inline-block;"></span>Savings
    </span>
    </div>

    <div style="position:relative;width:100%;height:200px;margin-bottom:2rem;">
        <canvas id="spending-bar-chart"></canvas>
    </div>

    <!-- ── 2. Donut Chart: Spending by Category ──────────────────────────────── -->
    <div class="sec">Spending by Category</div>

    <div id="spending-donut-legend"
         style="display:flex;flex-wrap:wrap;gap:10px;margin-bottom:10px;font-size:12px;color:var(--text2);">
    </div>

    <div id="spending-donut-wrap" style="position:relative;width:100%;height:240px;">
        <canvas id="spending-donut-chart"></canvas>
    </div>

    <!-- ── 3. Category Breakdown List ───────────────────────────────────────── -->
    <div class="sec" style="margin-top:2rem;">Category Breakdown</div>

    <div id="spending-cat-list">
        <!-- populated by renderSpending() -->
    </div>

</div>


<!-- ══ QUICK-EDIT LIMIT MODAL (3A.4) ════════════════════════════════════ -->
<!-- Inline compact limit editor appears below category row when pencil tapped -->


<style>
    /* 3A.4 — Quick edit limit */
    .cat-quick-edit {
        background: var(--bg2);
        border: 0.5px solid var(--border2);
        border-radius: var(--radius);
        padding: 10px 12px;
        margin-top: 6px;
        display: flex;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }

    .cat-quick-edit-label {
        font-size: 11px;
        color: var(--text2);
        flex-shrink: 0;
    }

    .cat-quick-edit input {
        flex: 1;
        min-width: 100px;
        max-width: 180px;
    }

    .cat-quick-edit .cat-qe-btns {
        display: flex;
        gap: 6px;
        flex-shrink: 0;
    }

    /* 3A.5 — Sparkline SVG */
    .cat-sparkline {
        display: inline-flex;
        align-items: flex-end;
        gap: 2px;
        height: 20px;
        margin-left: 8px;
        vertical-align: middle;
        flex-shrink: 0;
    }

    /* Highlight animation when donut segment clicked */
    @keyframes catHighlight {
        0%   { background: rgba(29,158,117,0.12); }
        60%  { background: rgba(29,158,117,0.12); }
        100% { background: transparent; }
    }

    .cat-row-highlight {
        animation: catHighlight 1.4s ease forwards;
        border-radius: var(--radius);
    }
</style>


<script>
    // =============================================================================
    // Spending screen — Phase 3A complete
    // =============================================================================

    // Track which category has its quick-edit open (3A.4)
    var _spendingQEOpenCat = null;

    function renderSpending() {
        _renderSpendingBar();
        _renderSpendingDonut();
        _renderSpendingCatList();
    }


    // ─── 1. BAR CHART ─────────────────────────────────────────────────────────────

    function _renderSpendingBar() {
        destroyChart('spending-bar-chart');

        var canvas = document.getElementById('spending-bar-chart');
        if (!canvas) return;

        var stats = getMonthStats(curKey());
        var label = monthLabel(AppState.curYear, AppState.curMonth);

        var colAcc  = _resolveSpendColor('--acc',  '#1D9E75');
        var colRed  = _resolveSpendColor('--red',  '#D85A30');
        var colBlue = _resolveSpendColor('--blue', '#185FA5');

        var defaults = getChartDefaults();
        defaults.scales.x.grid = { display: false };
        defaults.scales.y.ticks.maxTicksLimit = 5;

        var chart = new Chart(canvas, {
            type: 'bar',
            data: {
                labels: [label],
                datasets: [
                    { label: 'Income',   data: [stats.inc], backgroundColor: colAcc,  borderRadius: 4, borderSkipped: false },
                    { label: 'Expenses', data: [stats.exp], backgroundColor: colRed,  borderRadius: 4, borderSkipped: false },
                    { label: 'Savings',  data: [stats.sav], backgroundColor: colBlue, borderRadius: 4, borderSkipped: false }
                ]
            },
            options: defaults
        });

        registerChart('spending-bar-chart', chart);
    }


    // ─── 2. DONUT CHART ───────────────────────────────────────────────────────────

    function _renderSpendingDonut() {
        destroyChart('spending-donut-chart');

        var wrapEl   = document.getElementById('spending-donut-wrap');
        var legendEl = document.getElementById('spending-donut-legend');
        if (!wrapEl) return;

        var breakdown = _buildSpendingBreakdown();

        if (breakdown.length === 0) {
            wrapEl.innerHTML = (
                '<div style="display:flex;align-items:center;justify-content:center;' +
                'height:100%;color:var(--text2);font-size:13px;">' +
                'No expense data for this month.' +
                '</div>'
            );
            if (legendEl) legendEl.innerHTML = '';
            return;
        }

        if (!document.getElementById('spending-donut-chart')) {
            wrapEl.innerHTML = '<canvas id="spending-donut-chart"></canvas>';
        }

        var canvas = document.getElementById('spending-donut-chart');
        if (!canvas) return;

        var labels = breakdown.map(function(item) { return item.category; });
        var data   = breakdown.map(function(item) { return item.amount;   });
        var colors = breakdown.map(function(item) { return getCategoryColor(item.category); });
        var total  = data.reduce(function(sum, v) { return sum + v; }, 0);

        if (legendEl) {
            legendEl.innerHTML = breakdown.map(function(item) {
                var color   = getCategoryColor(item.category);
                var percent = total > 0 ? Math.round((item.amount / total) * 100) : 0;
                return (
                    '<span style="display:flex;align-items:center;gap:5px;">' +
                    '<span style="width:10px;height:10px;border-radius:2px;' +
                    'background:' + color + ';display:inline-block;flex-shrink:0;"></span>' +
                    '<span>' + _escSp(item.category) + ' ' + percent + '%</span>' +
                    '</span>'
                );
            }).join('');
        }

        var symbol = (typeof FX_SYMBOLS !== 'undefined' && AppState && FX_SYMBOLS[AppState.currency])
            ? FX_SYMBOLS[AppState.currency] : '₦';

        // 3A.1 — Center total label plugin
        var centerTotalPlugin = {
            id: 'centerTotal',
            beforeDraw: function(chart) {
                if (chart.config.type !== 'doughnut') return;
                var ctx    = chart.ctx;
                var centerX = (chart.chartArea.left + chart.chartArea.right)  / 2;
                var centerY = (chart.chartArea.top  + chart.chartArea.bottom) / 2;

                var rate = (typeof FX_RATES !== 'undefined' && AppState && FX_RATES[AppState.currency]) || 1;
                var displayTotal = symbol + Math.round(total * rate).toLocaleString();

                ctx.save();
                ctx.textAlign    = 'center';
                ctx.textBaseline = 'middle';
                ctx.font      = '11px system-ui, sans-serif';
                ctx.fillStyle = '#888';
                ctx.fillText('Total', centerX, centerY - 12);
                ctx.font      = 'bold 14px system-ui, sans-serif';
                ctx.fillStyle = document.getElementById('app') &&
                document.getElementById('app').classList.contains('dark')
                    ? '#e8e6e1' : '#1a1a1a';
                ctx.fillText(displayTotal, centerX, centerY + 8);
                ctx.restore();
            }
        };

        var chart = new Chart(canvas, {
            type: 'doughnut',
            data: {
                labels:   labels,
                datasets: [{ data: data, backgroundColor: colors, borderWidth: 0, hoverOffset: 6 }]
            },
            plugins: [centerTotalPlugin],
            options: {
                responsive: true, maintainAspectRatio: false, cutout: '68%',
                plugins: {
                    legend: { display: false },
                    tooltip: {
                        callbacks: {
                            label: function(ctx) {
                                var val     = ctx.parsed || 0;
                                var rate    = (typeof FX_RATES !== 'undefined' && AppState && FX_RATES[AppState.currency]) || 1;
                                var percent = total > 0 ? Math.round((val / total) * 100) : 0;
                                return ' ' + ctx.label + ': ' + symbol +
                                    Math.round(val * rate).toLocaleString() + ' (' + percent + '%)';
                            }
                        }
                    }
                },
                // 3A.2 — Click segment → scroll + highlight category row
                onClick: function(evt, elements) {
                    if (!elements || !elements.length) return;
                    var idx     = elements[0].index;
                    var catName = labels[idx];
                    _scrollToCategoryRow(catName);
                }
            }
        });

        registerChart('spending-donut-chart', chart);
    }


    // ─── 3. CATEGORY LIST ─────────────────────────────────────────────────────────

    function _renderSpendingCatList() {
        var listEl = document.getElementById('spending-cat-list');
        if (!listEl) return;

        var txs = curTxs();
        if (!Array.isArray(txs)) txs = [];

        var catMap = {};
        txs.forEach(function(tx) {
            if (tx.type !== 'expense') return;
            var cat = tx.category || 'Other';
            catMap[cat] = (catMap[cat] || 0) + (parseFloat(tx.amount) || 0);
        });

        var entries = Object.keys(catMap)
            .map(function(cat) { return { cat: cat, amt: catMap[cat] }; })
            .sort(function(a, b) { return b.amt - a.amt; });

        if (entries.length === 0) {
            listEl.innerHTML = (
                '<div style="text-align:center;color:var(--text2);padding:2rem 0;font-size:13px;">' +
                'No expense data for this month.' +
                '</div>'
            );
            return;
        }

        var totalExp = entries.reduce(function(sum, e) { return sum + e.amt; }, 0);

        var goalMap = {};
        ((AppState.goals && AppState.goals[curKey()]) || []).forEach(function(g) {
            goalMap[g.category] = g;
        });

        // 3A.3 — Previous month spend for delta chips
        var prevKey = _getPrevMonthKey();
        var prevCatMap = {};
        if (prevKey) {
            var prevTxs = AppState.transactions[prevKey];
            if (Array.isArray(prevTxs)) {
                prevTxs.forEach(function(tx) {
                    if (tx.type !== 'expense') return;
                    prevCatMap[tx.category || 'Other'] = (prevCatMap[tx.category || 'Other'] || 0) + (parseFloat(tx.amount) || 0);
                });
            }
        }

        // 3A.5 — Build sparkline data (3 prior months)
        var sparkData = _buildSparklineData(3);

        var html = '';

        entries.forEach(function(entry) {
            var cat   = entry.cat;
            var amt   = entry.amt;
            var color = getCategoryColor(cat);
            var goal  = goalMap[cat];

            var barPct, barColor, isOver, limitLabel;

            if (goal && goal.monthly_limit > 0) {
                var limit = parseFloat(goal.monthly_limit);
                barPct    = Math.min(100, Math.round((amt / limit) * 100));
                isOver    = amt > limit;
                barColor  = isOver ? 'var(--red)' : barPct >= 70 ? 'var(--amber)' : color;
                limitLabel = (
                    '<span style="font-size:11px;color:' + (isOver ? 'var(--red)' : 'var(--text2)') + ';">' +
                    barPct + '% of limit' +
                    (isOver ? ' (' + fmt(amt - limit) + ' over)' : '') +
                    '</span>'
                );
            } else {
                barPct    = pct(amt, totalExp);
                barColor  = color;
                isOver    = false;
                limitLabel = '<span style="font-size:11px;color:var(--text2);">' + barPct + '% of spend</span>';
            }

            var overBadge = isOver ? ' <span class="badge badge-red">Over limit</span>' : '';

            // 3A.3 — Delta chip
            var deltaHtml = '';
            if (prevKey && prevCatMap[cat] !== undefined) {
                var prevAmt = prevCatMap[cat] || 0;
                var delta   = amt - prevAmt;
                if (Math.abs(delta) > 0) {
                    var deltaSign  = delta > 0 ? '↑' : '↓';
                    var deltaColor = delta > 0 ? 'var(--red)' : 'var(--acc)';
                    deltaHtml = (
                        '<span style="font-size:10px;font-weight:600;color:' + deltaColor + ';' +
                        'background:' + (delta > 0 ? 'rgba(216,90,48,0.10)' : 'rgba(29,158,117,0.10)') + ';' +
                        'padding:1px 6px;border-radius:3px;margin-left:6px;white-space:nowrap;">' +
                        deltaSign + ' ' + fmt(Math.abs(delta)) +
                        '</span>'
                    );
                }
            }

            // 3A.5 — Sparkline SVG
            var sparkHtml = _buildSparklineSVG(cat, sparkData, color);

            // 3A.4 — Goal sub-line with pencil icon quick-edit
            var goalLabel = '';
            if (goal && goal.monthly_limit > 0) {
                goalLabel = (
                    '<div style="font-size:11px;color:' + (isOver ? 'var(--red)' : 'var(--text2)') +
                    ';margin-top:2px;display:flex;align-items:center;gap:8px;">' +
                    'Limit: ' + fmt(goal.monthly_limit) + ' — ' +
                    Math.round((amt / goal.monthly_limit) * 100) + '% used' +
                    (isOver ? ' (' + fmt(amt - goal.monthly_limit) + ' over)' : '') +
                    '&nbsp;<button onclick="_openQuickEdit(\'' + _escAttrSp(cat) + '\', \'' + goal.id + '\', ' + goal.monthly_limit + ', this)" ' +
                    'class="sp-qe-trigger" title="Edit spending limit">' +
                    '<svg viewBox="0 0 24 24" width="11" height="11" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' +
                    '<path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/>' +
                    '<path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z"/>' +
                    '</svg> Edit limit' +
                    '</button>' +
                    '</div>'
                );
            } else {
                goalLabel = (
                    '<div style="font-size:11px;color:var(--text2);margin-top:2px;">' +
                    'No limit set — ' +
                    '<span style="cursor:pointer;color:var(--text2);text-decoration:underline;" ' +
                    'onclick="switchTabSidebar(\'goals\')" title="Add a spending limit for this category">' +
                    'Add limit</span>' +
                    '</div>'
                );
            }

            html += (
                '<div style="margin-bottom:1.25rem;" id="spcat-' + _catId(cat) + '">' +

                '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:5px;">' +
                '<div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">' +
                '<span style="width:10px;height:10px;border-radius:2px;' +
                'background:' + color + ';display:inline-block;flex-shrink:0;"></span>' +
                '<span style="font-size:13px;font-weight:500;">' + _escSp(cat) + '</span>' +
                overBadge +
                deltaHtml +
                sparkHtml +
                '</div>' +
                '<div style="display:flex;align-items:baseline;gap:6px;">' +
                '<span style="font-family:var(--mono);font-size:13px;">' + fmt(amt) + '</span>' +
                limitLabel +
                '</div>' +
                '</div>' +

                '<div class="prog-track">' +
                '<div class="prog-fill" style="width:' + barPct + '%;background:' + barColor + ';"></div>' +
                '</div>' +

                goalLabel +

                // 3A.4 — Quick-edit slot (hidden until triggered)
                '<div id="spqe-' + _catId(cat) + '" style="display:none;"></div>' +

                '</div>'
            );
        });

        listEl.innerHTML = html;
    }


    // ─── 3A.4 QUICK-EDIT LIMIT ────────────────────────────────────────────────────

    function _openQuickEdit(categoryName, goalId, currentLimit, triggerBtn) {
        // Close any already-open quick-edit
        if (_spendingQEOpenCat && _spendingQEOpenCat !== categoryName) {
            _closeQuickEdit(_spendingQEOpenCat);
        }

        var slotEl = document.getElementById('spqe-' + _catId(categoryName));
        if (!slotEl) return;

        // Toggle: clicking again closes it
        if (slotEl.style.display === 'block') {
            _closeQuickEdit(categoryName);
            return;
        }

        _spendingQEOpenCat = categoryName;

        slotEl.style.display = 'block';
        slotEl.innerHTML = (
            '<div class="cat-quick-edit">' +
            '<span class="cat-quick-edit-label">New limit:</span>' +
            '<input id="spqe-input-' + _catId(categoryName) + '" class="inp amt-input" type="text" ' +
            'inputmode="numeric" value="' + _formatNumberWithCommas(String(Math.round(currentLimit))) + '" ' +
            'style="padding:6px 10px;font-size:13px;height:auto;" />' +
            '<div class="cat-qe-btns">' +
            '<button id="spqe-save-' + _catId(categoryName) + '" ' +
            'onclick="_saveQuickEdit(\'' + _escAttrSp(categoryName) + '\', \'' + goalId + '\')" ' +
            'class="btn-primary" style="font-size:12px;padding:6px 12px;">' +
            '<span class="btn-label">Save</span><span class="btn-spinner"></span>' +
            '</button>' +
            '<button onclick="_closeQuickEdit(\'' + _escAttrSp(categoryName) + '\')" ' +
            'class="btn-sm" style="font-size:12px;padding:6px 10px;">Cancel</button>' +
            '</div>' +
            '</div>'
        );

        // Wire amt-input formatting
        if (typeof initAmountInputs === 'function') initAmountInputs();

        setTimeout(function() {
            var inp = document.getElementById('spqe-input-' + _catId(categoryName));
            if (inp) { inp.focus(); inp.select(); }
        }, 60);
    }

    function _closeQuickEdit(categoryName) {
        var slotEl = document.getElementById('spqe-' + _catId(categoryName));
        if (slotEl) { slotEl.style.display = 'none'; slotEl.innerHTML = ''; }
        if (_spendingQEOpenCat === categoryName) _spendingQEOpenCat = null;
    }

    async function _saveQuickEdit(categoryName, goalId) {
        var inp = document.getElementById('spqe-input-' + _catId(categoryName));
        if (!inp) return;
        var rawVal = String(inp.value).replace(/,/g, '');
        var limit  = parseFloat(rawVal);
        if (isNaN(limit) || limit <= 0) {
            showToast('Please enter a valid limit.', 'error');
            inp.focus();
            return;
        }

        var btn = document.getElementById('spqe-save-' + _catId(categoryName));
        await withButtonLoading(btn, async function() {
            try {
                var result = await callServer('updateGoal', goalId, limit);
                var key = curKey();
                if (AppState.goals[key]) {
                    AppState.goals[key] = AppState.goals[key].map(function(g) {
                        return g.id === goalId ? result : g;
                    });
                }
                _closeQuickEdit(categoryName);
                renderAll();
                showToast('Spending limit updated!', 'success');
            } catch(e) {}
        });
    }


    // ─── 3A.5 SPARKLINES ──────────────────────────────────────────────────────────

    /**
     * _buildSparklineData(numMonths)
     * Returns { 'YYYY-MM': { catName: amount } } for the N months before the current one.
     */
    function _buildSparklineData(numMonths) {
        var result = {};
        var y = AppState.curYear;
        var m = AppState.curMonth;

        for (var i = 0; i < numMonths; i++) {
            m--;
            if (m < 1) { m = 12; y--; }
            var key = monthKey(y, m);
            var txs = AppState.transactions[key];
            if (!Array.isArray(txs)) continue;
            var catMap = {};
            txs.forEach(function(tx) {
                if (tx.type !== 'expense') return;
                var cat = tx.category || 'Other';
                catMap[cat] = (catMap[cat] || 0) + (parseFloat(tx.amount) || 0);
            });
            result[key] = catMap;
        }
        return result;
    }

    /**
     * _buildSparklineSVG(catName, sparkData, color)
     * Renders a tiny 3-bar sparkline for the last 3 months of spend for this category.
     * Returns an HTML string (the SVG inline).
     */
    function _buildSparklineSVG(catName, sparkData, color) {
        var keys = Object.keys(sparkData).sort().reverse().slice(0, 3).reverse(); // oldest → newest
        if (keys.length === 0) return '';

        var values = keys.map(function(k) {
            return (sparkData[k] && sparkData[k][catName]) ? sparkData[k][catName] : 0;
        });

        // Pad to 3 bars
        while (values.length < 3) values.unshift(0);

        var maxVal = Math.max.apply(null, values);
        if (maxVal === 0) return ''; // no data → no sparkline

        var W = 24, H = 20, barW = 5, gap = 2;
        var bars = '';
        values.forEach(function(v, i) {
            var h   = maxVal > 0 ? Math.max(2, Math.round((v / maxVal) * (H - 2))) : 2;
            var x   = i * (barW + gap);
            var y   = H - h;
            var opacity = v === 0 ? '0.18' : '0.65';
            bars += '<rect x="' + x + '" y="' + y + '" width="' + barW + '" height="' + h +
                '" rx="1" fill="' + color + '" opacity="' + opacity + '"/>';
        });

        return (
            '<svg class="cat-sparkline" width="' + W + '" height="' + H + '" ' +
            'viewBox="0 0 ' + W + ' ' + H + '" title="Last 3 months">' +
            bars +
            '</svg>'
        );
    }


    // ─── 3A.7 DARK MODE CHART UPDATE ─────────────────────────────────────────────
    // Called from toggleDark() in utils.js after theme switch

    function updateSpendingChartColors() {
        // Re-render if spending tab is active; otherwise mark dirty
        if (AppState.activeTab === 'spending') {
            _renderSpendingBar();
            _renderSpendingDonut();
        }
    }


    // ─── HELPERS ──────────────────────────────────────────────────────────────────

    function _buildSpendingBreakdown() {
        var map = {};
        var txs = curTxs();
        if (!Array.isArray(txs)) return [];
        txs.forEach(function(tx) {
            if (tx.type !== 'expense') return;
            var cat = tx.category || 'Other';
            map[cat] = (map[cat] || 0) + (parseFloat(tx.amount) || 0);
        });
        return Object.keys(map)
            .map(function(cat) { return { category: cat, amount: map[cat] }; })
            .sort(function(a, b) { return b.amount - a.amount; });
    }

    function _resolveSpendColor(varName, fallback) {
        var val = getComputedStyle(document.getElementById('app') || document.documentElement)
            .getPropertyValue(varName).trim();
        return val || fallback;
    }

    function _getPrevMonthKey() {
        var y = AppState.curYear, m = AppState.curMonth - 1;
        if (m < 1) { m = 12; y--; }
        return monthKey(y, m);
    }

    // 3A.2 — Scroll and highlight category row
    function _scrollToCategoryRow(catName) {
        var id  = 'spcat-' + _catId(catName);
        var el  = document.getElementById(id);
        if (!el) return;
        el.scrollIntoView({ behavior: 'smooth', block: 'center' });
        el.classList.add('cat-row-highlight');
        setTimeout(function() { el.classList.remove('cat-row-highlight'); }, 1500);
    }

    function _catId(cat) {
        return String(cat || '').replace(/[^a-zA-Z0-9]/g, '_');
    }

    function _escSp(str) {
        return String(str || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    function _escAttrSp(str) {
        return String(str || '').replace(/'/g, "\\'").replace(/"/g, '&quot;');
    }

    // Style for quick-edit trigger button
    document.addEventListener('DOMContentLoaded', function() {
        var style = document.createElement('style');
        style.textContent = (
            '.sp-qe-trigger{background:none;border:none;cursor:pointer;color:var(--text2);' +
            'font-size:11px;font-family:var(--font);display:inline-flex;align-items:center;' +
            'gap:3px;padding:1px 4px;border-radius:3px;transition:color .12s,background .12s;}' +
            '.sp-qe-trigger:hover{color:var(--text);background:var(--border);}'
        );
        document.head.appendChild(style);
    });
</script>
