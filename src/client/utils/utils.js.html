<script>
    // =============================================================================
    // utils.js.html — Shared Client-Side Utilities
    //
    // SECTIONS:
    //   1.  Constants
    //   2.  AppState
    //   3.  Server bridge (callServer / callServerSilent)
    //   4.  Loading state helpers
    //   5.  Formatters
    //   6.  Toast notifications
    //   7.  Tab router (switchTab)
    //   8.  Month navigation  ← REWRITTEN: optimistic render + background sync
    //   9.  Category utilities
    //   10. Month stats helpers  ← PATCHED: null-safe curTxs / getMonthStats
    //   11. DOM helpers
    //   12. Chart helpers
    //   13. Dark mode & currency
    //   14. CSV export / import
    //   15. renderAll
    // =============================================================================


    // ─── 1. CONSTANTS ─────────────────────────────────────────────────────────────

    var MONTHS = [
        'January','February','March','April','May','June',
        'July','August','September','October','November','December'
    ];

    // Exchange rates relative to NGN (base currency).
    // These are approximate fixed rates — in Phase 2 these can be replaced
    // with a live FX API call on bootstrap.
    var FX_RATES = {
        NGN: 1,
        USD: 0.00062,   // ~1 USD = 1,610 NGN
        EUR: 0.00058,   // ~1 EUR = 1,724 NGN
        GBP: 0.00049    // ~1 GBP = 2,041 NGN
    };

    var FX_SYMBOLS = {
        NGN: '₦',
        USD: '$',
        EUR: '€',
        GBP: '£'
    };

    // Valid category types — used for filtering category <select> elements.
    var CATEGORY_TYPES = ['income', 'expense', 'savings'];


    // ─── 2. APP STATE ─────────────────────────────────────────────────────────────

    // Build default state first, then merge in bootstrap data from the server.
    // This ensures every key always exists even if __BOOTSTRAP__ is partial.
    var _now = new Date();

    var _DEFAULT_STATE = {
        curYear:      _now.getFullYear(),
        curMonth:     _now.getMonth() + 1,   // 1-indexed (1 = January)
        currency:     'NGN',
        darkMode:     false,
        categories:   [],
        transactions: {},                      // { 'YYYY-MM': [tx, ...] }
        goals:        {},
        bills:        [],
        savingsGoals: [],
        debts:        [],
        netWorthItems:[],
        recurring:    [],
        isLoading:    false,
        activeTab:    'overview'
    };

    // Merge bootstrap data into defaults.
    // __BOOTSTRAP__ is injected by doGet() in Main.gs before this script loads.
    var _boot = (typeof window !== 'undefined' && window.__BOOTSTRAP__) ? window.__BOOTSTRAP__ : {};

    var AppState = Object.assign({}, _DEFAULT_STATE, _boot);

    // currentMonthKey from bootstrap may need to be split into curYear/curMonth.
    if (_boot.currentMonthKey) {
        var _parts = _boot.currentMonthKey.split('-');
        AppState.curYear  = parseInt(_parts[0], 10);
        AppState.curMonth = parseInt(_parts[1], 10);
    }

    // Normalise dark_mode key from server (snake_case) to camelCase.
    if (_boot.preferences) {
        AppState.currency   = _boot.preferences.currency   || 'NGN';
        AppState.darkMode   = _boot.preferences.dark_mode  || false;
        AppState.categories = _boot.preferences.categories || [];
    }


    // ─── 3. SERVER BRIDGE ─────────────────────────────────────────────────────────

    /**
     * callServer(fnName, ...args)
     *
     * Wraps google.script.run in a Promise so all screen files can use
     * async/await instead of nested callbacks.
     *
     * Sets AppState.isLoading while the call is in flight so inputs can
     * be disabled during server round-trips.
     */
    function callServer(fnName) {
        var args = Array.prototype.slice.call(arguments, 1);
        AppState.isLoading = true;

        return new Promise(function(resolve, reject) {
            var runner = google.script.run
                .withSuccessHandler(function(result) {
                    AppState.isLoading = false;
                    resolve(result);
                })
                .withFailureHandler(function(err) {
                    AppState.isLoading = false;
                    var msg = (err && err.message) ? err.message : String(err);
                    showToast(msg, 'error');
                    reject(err);
                });

            // Dynamically call the named server function with spread args.
            runner[fnName].apply(runner, args);
        });
    }

    /**
     * callServerSilent(fnName, ...args)
     *
     * Same as callServer but does NOT set isLoading or show error toasts.
     * Used for background preference saves where UI blocking would feel wrong.
     */
    function callServerSilent(fnName) {
        var args = Array.prototype.slice.call(arguments, 1);

        return new Promise(function(resolve, reject) {
            var runner = google.script.run
                .withSuccessHandler(resolve)
                .withFailureHandler(function(err) {
                    // Log silently — don't surface background errors to the user.
                    console.warn('callServerSilent error (' + fnName + '):', err);
                    reject(err);
                });

            runner[fnName].apply(runner, args);
        });
    }


    // ─── 4. LOADING STATE HELPERS ─────────────────────────────────────────────────

    /**
     * setButtonLoading(btnEl, isLoading)
     *
     * Puts a .btn-primary button into a loading state:
     *   - Adds .loading class → CSS shows the inline spinner, dims the label
     *   - Disables the button to prevent double-submits
     *   - Disables all .inp fields within the same .pane ancestor
     *
     * For .btn-sm buttons it simply disables them (no spinner needed).
     *
     * The button should have this structure (initAllBtnStructures() ensures it):
     *   <button class="btn-primary">
     *     <span class="btn-label">Add Transaction</span>
     *     <span class="btn-spinner"></span>
     *   </button>
     */
    function setButtonLoading(btnEl, isLoading) {
        if (!btnEl) return;

        if (isLoading) {
            btnEl.disabled = true;
            btnEl.classList.add('loading');

            // Disable sibling inputs in the nearest .pane ancestor so the user
            // cannot edit fields while the server call is in flight.
            var pane = btnEl.closest ? btnEl.closest('.pane') : null;
            if (!pane) pane = btnEl.parentElement;
            if (pane) {
                pane.querySelectorAll('.inp').forEach(function(inp) {
                    inp.dataset._wasDisabled = inp.disabled ? '1' : '0';
                    inp.disabled = true;
                });
            }
        } else {
            btnEl.disabled = false;
            btnEl.classList.remove('loading');

            var pane = btnEl.closest ? btnEl.closest('.pane') : null;
            if (!pane) pane = btnEl.parentElement;
            if (pane) {
                pane.querySelectorAll('.inp').forEach(function(inp) {
                    if (inp.dataset._wasDisabled !== '1') {
                        inp.disabled = false;
                    }
                    delete inp.dataset._wasDisabled;
                });
            }
        }
    }

    /**
     * withButtonLoading(btnEl, asyncFn)
     *
     * Convenience wrapper that calls setButtonLoading(true) before asyncFn
     * and setButtonLoading(false) in a finally block, regardless of success
     * or failure. Usage:
     *
     *   async function addTx() {
     *     await withButtonLoading(document.getElementById('btn-add-tx'), async () => {
     *       var result = await callServer('addTransaction', ...);
     *       // update AppState, renderAll(), showToast(...)
     *     });
     *   }
     */
    async function withButtonLoading(btnEl, asyncFn) {
        setButtonLoading(btnEl, true);
        try {
            await asyncFn();
        } finally {
            setButtonLoading(btnEl, false);
        }
    }

    /**
     * initAllBtnStructures()
     *
     * Ensures every .btn-primary button in the document has the
     * .btn-label + .btn-spinner child structure required by the CSS loading
     * animation. Idempotent — safe to call multiple times.
     *
     * Called once from Index.html boot sequence after all panes are in the DOM.
     */
    function initAllBtnStructures() {
        document.querySelectorAll('.btn-primary').forEach(function(btn) {
            // Skip buttons that have already been structured
            if (btn.querySelector('.btn-label')) return;

            var text = btn.textContent.trim();
            btn.innerHTML = (
                '<span class="btn-label">' + text + '</span>' +
                '<span class="btn-spinner"></span>'
            );
        });
    }


    // ─── 5. FORMATTERS ────────────────────────────────────────────────────────────

    /**
     * fmt(amount)
     * Converts a raw NGN number to the current currency with symbol + separators.
     * Handles negatives, zeros, and NaN defensively.
     */
    function fmt(amount) {
        var num = parseFloat(amount);
        if (isNaN(num)) num = 0;

        var rate      = FX_RATES[AppState.currency]   || 1;
        var symbol    = FX_SYMBOLS[AppState.currency] || '₦';
        var converted = Math.round(num * rate);

        var isNeg     = converted < 0;
        var abs       = Math.abs(converted);
        var formatted = symbol + abs.toLocaleString();

        return isNeg ? '-' + formatted : formatted;
    }

    /**
     * pct(value, total)
     * Returns an integer percentage, capped at 100, guarded against division by zero.
     */
    function pct(value, total) {
        if (!total || total === 0) return 0;
        return Math.min(100, Math.round((value / total) * 100));
    }

    /**
     * monthLabel(year, month)
     * e.g. monthLabel(2026, 3) → 'March 2026'
     */
    function monthLabel(year, month) {
        return MONTHS[month - 1] + ' ' + year;
    }

    /**
     * monthKey(year, month)
     * e.g. monthKey(2026, 3) → '2026-03'
     */
    function monthKey(year, month) {
        return year + '-' + (month < 10 ? '0' : '') + month;
    }

    /**
     * curKey()
     * Returns the YYYY-MM key for the currently displayed month.
     */
    function curKey() {
        return monthKey(AppState.curYear, AppState.curMonth);
    }

    /**
     * parseMonthKey(key)
     * Parses '2026-03' into { year: 2026, month: 3 }
     */
    function parseMonthKey(key) {
        var parts = String(key).split('-');
        return {
            year:  parseInt(parts[0], 10),
            month: parseInt(parts[1], 10)
        };
    }


    // ─── 6. TOAST NOTIFICATIONS ───────────────────────────────────────────────────

    // Track the current toast timeout so rapid calls don't stack.
    var _toastTimer = null;

    /**
     * showToast(message, type, duration)
     *
     * Displays a non-blocking notification at the bottom of the screen.
     * type: 'success' | 'error' | 'info' (default 'info')
     * duration: ms visible (default 3000)
     */
    function showToast(message, type, duration) {
        type     = type     || 'info';
        duration = duration || 3000;

        // Create the toast container if it doesn't exist yet.
        var toast = document.getElementById('toast');
        if (!toast) {
            toast = document.createElement('div');
            toast.id = 'toast';
            toast.style.cssText = [
                'position:fixed',
                'bottom:24px',
                'left:50%',
                'transform:translateX(-50%)',
                'padding:10px 18px',
                'border-radius:8px',
                'font-size:13px',
                'font-weight:500',
                'z-index:9999',
                'pointer-events:none',
                'transition:opacity 0.2s ease',
                'opacity:0',
                'max-width:320px',
                'text-align:center',
                'box-shadow:0 2px 12px rgba(0,0,0,0.15)'
            ].join(';');
            document.body.appendChild(toast);
        }

        // Apply colour based on type.
        var styles = {
            success: { bg: '#1D9E75', color: '#fff' },
            error:   { bg: '#D85A30', color: '#fff' },
            info:    { bg: '#1a1a1a', color: '#f5f5f3' }
        };
        var style           = styles[type] || styles.info;
        toast.style.background = style.bg;
        toast.style.color      = style.color;
        toast.textContent      = message;
        toast.style.opacity    = '1';

        if (_toastTimer) clearTimeout(_toastTimer);
        _toastTimer = setTimeout(function() {
            toast.style.opacity = '0';
        }, duration);
    }

    /**
     * showLoading(show)
     * Toggles a subtle full-screen loading overlay.
     * Used during longer server operations (e.g. applying a budget template).
     */
    function showLoading(show) {
        var overlay = document.getElementById('loading-overlay');

        if (show) {
            if (!overlay) {
                overlay = document.createElement('div');
                overlay.id = 'loading-overlay';
                overlay.style.cssText = [
                    'position:fixed',
                    'inset:0',
                    'background:rgba(255,255,255,0.6)',
                    'z-index:9998',
                    'display:flex',
                    'align-items:center',
                    'justify-content:center',
                    'font-size:13px',
                    'color:#666'
                ].join(';');
                overlay.textContent = 'Loading…';
                document.body.appendChild(overlay);
            }
            overlay.style.display = 'flex';
        } else {
            if (overlay) overlay.style.display = 'none';
        }
    }


    // ─── 7. TAB ROUTER ────────────────────────────────────────────────────────────

    /**
     * switchTab(tabId)
     *
     * Activates the given tab pane, deactivates all others.
     * Chart tabs need a 50ms delay before rendering because Chart.js
     * requires the canvas element to be visible (non-zero dimensions) first.
     */
    function switchTab(tabId) {
        // Deactivate all tabs and panes.
        var tabs  = document.querySelectorAll('.tab');
        var panes = document.querySelectorAll('.pane');

        tabs.forEach(function(t)  { t.classList.remove('active'); });
        panes.forEach(function(p) { p.classList.remove('active'); });

        // Activate the selected tab button and pane.
        var tabBtn  = document.getElementById('tab-'  + tabId);
        var tabPane = document.getElementById('pane-' + tabId);

        if (tabBtn)  tabBtn.classList.add('active');
        if (tabPane) tabPane.classList.add('active');

        AppState.activeTab = tabId;

        // Chart tabs: delay render until canvas is visible.
        var chartTabs = {
            'charts':     function() { if (typeof renderCharts     === 'function') renderCharts();     },
            'multimonth': function() { if (typeof renderMultiMonth === 'function') renderMultiMonth(); },
            'forecast':   function() { if (typeof renderForecast   === 'function') renderForecast();   }
        };

        if (chartTabs[tabId]) {
            setTimeout(chartTabs[tabId], 50);
            // Still update FAB before returning.
            if (typeof _updateFabVisibility === 'function') _updateFabVisibility();
            return;
        }

        // Non-chart tabs that need a fresh render on switch.
        // Every data tab is listed here so navigating to it always draws
        // the current AppState — even on first load after a page refresh,
        // when renderAll() only rendered the default 'overview' tab.
        var renderOnSwitch = {
            'overview':   function() { if (typeof renderOverview    === 'function') renderOverview();    },
            'goals':      function() { if (typeof renderGoals       === 'function') renderGoals();       },
            'bills':      function() { if (typeof renderBills       === 'function') renderBills();       },
            'savings':    function() { if (typeof renderSavings     === 'function') renderSavings();     },
            'debt':       function() { if (typeof renderDebt        === 'function') renderDebt();        },
            'networth':   function() { if (typeof renderNetWorth    === 'function') renderNetWorth();    },
            'recurring':  function() { if (typeof renderRecurring   === 'function') renderRecurring();   },
            'settings':   function() { if (typeof renderSettings    === 'function') renderSettings();    },
            'report':     function() { if (typeof renderReport      === 'function') renderReport();      },
            'insights':   function() { if (typeof renderInsights    === 'function') renderInsights();    },
            'categories': function() { if (typeof renderCategories  === 'function') renderCategories();  },
            'templates':  function() { if (typeof renderTemplates   === 'function') renderTemplates();   }
        };

        if (renderOnSwitch[tabId]) {
            renderOnSwitch[tabId]();
        }

        if (typeof _updateFabVisibility === 'function') {
            _updateFabVisibility();
        }
    }


    // ─── 8. MONTH NAVIGATION ──────────────────────────────────────────────────────
    //
    // OPTIMISTIC PATTERN — how it works:
    //
    //   OLD (blocking):
    //     click → await server fetch → await recurring apply → renderAll()
    //     Result: 6–10s freeze before anything appears
    //
    //   NEW (optimistic):
    //     click → update month counters → renderAll() immediately (~0ms)
    //             ↳ shows cached data if visited before, or empty state otherwise
    //     then  → background fetch if not cached → re-render on arrival
    //     then  → background recurring apply → re-render only if new rows added
    //
    //   Stale-result guard: after every async step, checks curKey() === key
    //   before writing to AppState. Rapid navigation discards out-of-order results.
    //
    //   Debounce: _monthNavInFlight prevents overlapping calls from double-taps.
    //   It resets immediately after the optimistic render so the user can keep
    //   tapping — but one background sync per navigation is still enforced.

    // null sentinel: means "this month is known to be uncached, fetch in progress"
    // undefined:     means "this month has never been referenced"
    // []:            means "fetched from server, no transactions"
    // [{...}, ...]:  means "fetched from server, has transactions"

    var _monthNavInFlight = false;

    /**
     * prevMonth()
     * Steps back one calendar month with an instant optimistic render.
     */
    async function prevMonth() {
        if (_monthNavInFlight) return;
        _monthNavInFlight = true;

        AppState.curMonth -= 1;
        if (AppState.curMonth < 1) {
            AppState.curMonth = 12;
            AppState.curYear  -= 1;
        }

        // Step 1: render NOW from whatever is already in cache.
        _renderMonthInstant();

        // Step 2: release debounce so rapid taps still work responsively.
        _monthNavInFlight = false;

        // Step 3: background sync — fetch + recurring (non-blocking).
        _backgroundSyncMonth(curKey());
    }

    /**
     * nextMonth()
     * Steps forward one calendar month with an instant optimistic render.
     */
    async function nextMonth() {
        if (_monthNavInFlight) return;
        _monthNavInFlight = true;

        AppState.curMonth += 1;
        if (AppState.curMonth > 12) {
            AppState.curMonth = 1;
            AppState.curYear  += 1;
        }

        _renderMonthInstant();
        _monthNavInFlight = false;
        _backgroundSyncMonth(curKey());
    }

    /**
     * _renderMonthInstant()
     *
     * Renders the new month from AppState immediately — zero server calls.
     *
     * If this month has never been loaded (undefined), we set it to null
     * (fetch-in-progress sentinel) so curTxs() returns [] and the UI shows
     * "No transactions this month" cleanly rather than stale data or errors.
     *
     * If it was previously fetched (array), it renders the real cached data
     * instantly — repeat visits to past months feel completely synchronous.
     */
    function _renderMonthInstant() {
        var key = curKey();

        if (AppState.transactions[key] === undefined) {
            // Never seen this month — mark as pending fetch so curTxs() returns [].
            AppState.transactions[key] = null;
        }

        // Show a subtle "syncing" dot on the month label when fetching.
        _setMonthSyncIndicator(AppState.transactions[key] === null);

        // Disable nav buttons only during the instant render (< 50ms), not the
        // background fetch, so the user can keep tapping through months freely.
        if (typeof setMonthNavLoading === 'function') setMonthNavLoading(false);

        renderAll();
        if (typeof updateSidebar === 'function') updateSidebar();
    }

    /**
     * _backgroundSyncMonth(key)
     *
     * Runs entirely in the background without blocking the UI.
     *
     * Phase 1 — fetch transactions if not cached:
     *   Checks for null sentinel (pending) or missing key. If cached ([]),
     *   skips the fetch entirely. On arrival, stale-result guard ensures
     *   we only update AppState if the user hasn't navigated away.
     *
     * Phase 2 — apply recurring:
     *   Calls applyRecurringToMonth silently. If it created new rows (applied > 0),
     *   re-fetches the month to pick them up, then re-renders.
     */
    async function _backgroundSyncMonth(key) {
        var needsFetch = !AppState.transactions[key] ||
            !Array.isArray(AppState.transactions[key]);

        // ── Phase 1: fetch transactions ────────────────────────────────────────
        if (needsFetch) {
            try {
                var txs = await callServerSilent('getTransactionsByMonth', key);

                // Stale-result guard — user may have navigated away while we waited.
                if (curKey() !== key) return;

                AppState.transactions[key] = txs || [];
                _setMonthSyncIndicator(false);
                renderAll();
                if (typeof updateSidebar === 'function') updateSidebar();
            } catch(e) {
                if (curKey() === key) {
                    // On error, leave as empty so UI shows "No transactions" rather
                    // than staying in a loading state forever.
                    AppState.transactions[key] = [];
                    _setMonthSyncIndicator(false);
                    renderAll();
                }
                console.warn('Month fetch failed for', key, e);
                return; // Don't attempt recurring if the fetch itself failed.
            }
        }

        // ── Phase 2: apply recurring (fire-and-forget) ─────────────────────────
        if (!AppState.recurring || AppState.recurring.length === 0) return;

        try {
            var result = await callServerSilent('applyRecurringToMonth', key);

            // Only re-fetch if the server actually added new rows.
            if (result && result.applied > 0 && curKey() === key) {
                var updatedTxs = await callServerSilent('getTransactionsByMonth', key);
                if (curKey() === key) {
                    AppState.transactions[key] = updatedTxs || [];
                    renderAll();
                }
            }
        } catch(e) {
            // Recurring failures are non-fatal — transactions were already loaded.
            console.warn('Recurring apply failed for', key, e);
        }
    }

    /**
     * _setMonthSyncIndicator(isSyncing)
     *
     * Shows/hides a subtle pulsing dot next to the month label to signal
     * that a background fetch is in progress. Gives the user a visual cue
     * without blocking interaction.
     *
     * Targets both the header month label (#hd-month) and the sidebar label
     * (#sidebar-month-label) if present.
     */
    function _setMonthSyncIndicator(isSyncing) {
        var dotId = 'month-sync-dot';
        var dot   = document.getElementById(dotId);

        if (!isSyncing) {
            if (dot) dot.style.opacity = '0';
            return;
        }

        // Create the dot once and reuse it.
        if (!dot) {
            dot = document.createElement('span');
            dot.id = dotId;
            dot.style.cssText = [
                'display:inline-block',
                'width:6px',
                'height:6px',
                'border-radius:50%',
                'background:var(--acc)',
                'margin-left:6px',
                'vertical-align:middle',
                'opacity:0',
                'transition:opacity 0.2s ease',
                'animation:monthSyncPulse 1.2s ease-in-out infinite'
            ].join(';');

            // Inject the keyframe once.
            if (!document.getElementById('month-sync-style')) {
                var style = document.createElement('style');
                style.id = 'month-sync-style';
                style.textContent = [
                    '@keyframes monthSyncPulse {',
                    '  0%, 100% { opacity: 0.25; transform: scale(0.85); }',
                    '  50%       { opacity: 1;    transform: scale(1.1);  }',
                    '}'
                ].join('');
                document.head.appendChild(style);
            }

            // Attach to the header month label if it exists.
            var hdMonth = document.getElementById('hd-month');
            if (hdMonth && hdMonth.parentElement) {
                hdMonth.parentElement.appendChild(dot);
            } else {
                document.body.appendChild(dot); // fallback
            }
        }

        dot.style.opacity = '1';
    }

    /**
     * applyRecurringForMonth()
     * Public alias kept for backward compatibility (called from Recurring.html).
     */
    async function applyRecurringForMonth() {
        await _backgroundSyncMonth(curKey());
    }

    /**
     * _ensureMonthLoaded(key)
     * Kept for backward compatibility. Delegates to the background sync path.
     */
    async function _ensureMonthLoaded(key) {
        if (AppState.transactions[key] && Array.isArray(AppState.transactions[key])) return;
        AppState.transactions[key] = null;
        try {
            var txs = await callServerSilent('getTransactionsByMonth', key);
            AppState.transactions[key] = txs || [];
        } catch(e) {
            AppState.transactions[key] = [];
        }
    }


    // ─── 9. CATEGORY UTILITIES ────────────────────────────────────────────────────

    function getCategoryColor(categoryName) {
        var cats  = AppState.categories || [];
        var match = cats.find(function(c) {
            return c.name.toLowerCase() === String(categoryName).toLowerCase();
        });
        return match ? match.color : '#888780';
    }

    function getCategoriesByType(type) {
        var cats = AppState.categories || [];
        var norm = String(type || '').toLowerCase();

        if (CATEGORY_TYPES.indexOf(norm) === -1) return cats;

        var filtered = cats.filter(function(c) { return c.type === norm; });
        return filtered.length > 0 ? filtered : cats;
    }

    /**
     * populateCategorySelects()
     *
     * Rebuilds all shared category <select> elements from AppState.categories.
     * Each select is scoped to its paired type select (if one exists in the
     * same form group — identified by a data-type-select attribute).
     *
     * Preserves the currently selected value across re-renders.
     * Called on boot and after adding/deleting a category.
     *
     * Select IDs and their paired type-select IDs:
     *   tx-cat   ← paired with tx-type   (Overview inline form, legacy)
     *   tx-cat-d ← paired with tx-type-d (Overview desktop modal)
     *   tx-cat-m ← paired with tx-type-m (Overview mobile sheet)
     *   g-cat    ← always expense (Goals — budget goals are always expense limits)
     *   r-cat    ← paired with r-type    (Recurring form)
     */
    function populateCategorySelects() {
        // Mappings: { catSelectId: typeSelectId | null }
        // null means always show a specific fixed type (see below).
        var pairs = [
            { catId: 'tx-cat',   typeId: 'tx-type'   },
            { catId: 'tx-cat-d', typeId: 'tx-type-d'  },
            { catId: 'tx-cat-m', typeId: 'tx-type-m'  },
            { catId: 'g-cat',    typeId: null          },  // fixed: expense
            { catId: 'r-cat',    typeId: 'r-type'      }
        ];

        pairs.forEach(function(pair) {
            var catEl = document.getElementById(pair.catId);
            if (!catEl) return;

            // Determine which type to filter by.
            var filterType;
            if (pair.typeId === null) {
                // Goals — always expense.
                filterType = 'expense';
            } else {
                var typeEl = document.getElementById(pair.typeId);
                filterType = typeEl ? typeEl.value : 'expense';
            }

            _fillCategorySelect(catEl, filterType);
        });
    }

    /**
     * syncCategoryToType(catSelectId, typeSelectId)
     *
     * Re-fills a single category <select> based on the current value of its
     * paired type <select>. Call this from the type select's onchange handler.
     *
     * Example (in HTML):
     *   <select id="tx-type-d" onchange="syncCategoryToType('tx-cat-d','tx-type-d')">
     */
    function syncCategoryToType(catSelectId, typeSelectId) {
        var catEl  = document.getElementById(catSelectId);
        var typeEl = document.getElementById(typeSelectId);
        if (!catEl || !typeEl) return;

        _fillCategorySelect(catEl, typeEl.value);
    }

    /**
     * _fillCategorySelect(selectEl, type)
     *
     * Internal helper — repopulates a <select> element with categories
     * filtered to the given type. Tries to preserve the previously selected
     * value; falls back to the first option if it's no longer present.
     */
    function _fillCategorySelect(selectEl, type) {
        var current = selectEl.value;
        var cats    = getCategoriesByType(type);

        selectEl.innerHTML = '';
        cats.forEach(function(cat) {
            var opt         = document.createElement('option');
            opt.value       = cat.name;
            opt.textContent = cat.name;
            selectEl.appendChild(opt);
        });

        if (current && selectEl.querySelector('option[value="' + current + '"]')) {
            selectEl.value = current;
        }
    }


    // ─── 10. MONTH STATS HELPERS ──────────────────────────────────────────────────
    //
    // PATCH: both helpers are now null-safe.
    //
    // AppState.transactions[key] can be:
    //   undefined  — never referenced (treated as empty)
    //   null       — fetch in progress (treated as empty, dot is showing)
    //   []         — fetched, no transactions
    //   [{...}]    — fetched, has transactions
    //
    // Using `|| []` would coerce null → [] correctly, but being explicit
    // with Array.isArray() makes the intent clear and guards against any
    // accidental non-array value that could sneak in.

    function getMonthStats(key) {
        var raw = AppState.transactions[key];
        var txs = (raw && Array.isArray(raw)) ? raw : [];

        var inc = 0, exp = 0, sav = 0;
        txs.forEach(function(tx) {
            var amt = parseFloat(tx.amount) || 0;
            if      (tx.type === 'income')  inc += amt;
            else if (tx.type === 'expense') exp += amt;
            else if (tx.type === 'savings') sav += amt;
        });

        return { inc: inc, exp: exp, sav: sav, bal: inc - exp - sav };
    }

    function curTxs() {
        var raw = AppState.transactions[curKey()];
        return (raw && Array.isArray(raw)) ? raw : [];
    }


    // ─── 11. DOM HELPERS ──────────────────────────────────────────────────────────

    function $(id) { return document.getElementById(id); }

    /**
     * setHTML(id, html)
     * Sets innerHTML of an element by id. Warns if element not found
     * rather than throwing — keeps renders resilient to missing stubs.
     */
    function setHTML(id, html) {
        var el = document.getElementById(id);
        if (!el) { console.warn('setHTML: element #' + id + ' not found'); return; }
        el.innerHTML = html;
    }

    /**
     * getVal(id)
     * Returns the trimmed value of an input/select by id, or '' if not found.
     */
    function getVal(id) {
        var el = document.getElementById(id);
        return el ? String(el.value).trim() : '';
    }

    /**
     * clearInputs(...ids)
     * Clears the value of one or more input elements by id.
     */
    function clearInputs() {
        var ids = Array.prototype.slice.call(arguments);
        ids.forEach(function(id) {
            var el = document.getElementById(id);
            if (el) el.value = '';
        });
    }


    // ─── 12. CHART HELPERS ────────────────────────────────────────────────────────

    // Registry maps canvasId → Chart.js instance so we can destroy before recreate.
    var chartRegistry = {};

    /**
     * destroyChart(canvasId)
     * Destroys an existing Chart.js instance on the given canvas.
     * Must be called before creating a new chart on the same canvas —
     * Chart.js throws "Canvas already in use" otherwise.
     */
    function destroyChart(canvasId) {
        if (chartRegistry[canvasId]) {
            chartRegistry[canvasId].destroy();
            delete chartRegistry[canvasId];
        }
    }

    /**
     * registerChart(canvasId, chartInstance)
     * Stores a Chart.js instance in the registry after creation.
     */
    function registerChart(canvasId, chartInstance) {
        chartRegistry[canvasId] = chartInstance;
    }

    /**
     * getChartDefaults()
     * Returns a base Chart.js options object shared across all charts.
     * Returns a fresh object each time so callers can extend without mutating.
     */
    function getChartDefaults() {
        return {
            responsive:          true,
            maintainAspectRatio: false,
            plugins: {
                legend: { display: false }
            },
            scales: {
                x: {
                    grid:  { display: false },
                    ticks: { color: '#888', font: { size: 11 } }
                },
                y: {
                    grid:  { color: 'rgba(128,128,128,0.1)' },
                    ticks: {
                        color: '#888',
                        font:  { size: 11 },
                        callback: function(v) {
                            var symbol = FX_SYMBOLS[AppState.currency] || '₦';
                            var rate   = FX_RATES[AppState.currency]   || 1;
                            return symbol + Math.round(v * rate).toLocaleString();
                        }
                    }
                }
            }
        };
    }


    // ─── 13. DARK MODE & CURRENCY ─────────────────────────────────────────────────

    /**
     * toggleDark()
     * Flips dark mode state, updates DOM class, persists via server.
     */
    function toggleDark() {
        AppState.darkMode = !AppState.darkMode;

        var app     = document.getElementById('app');
        var darkBtn = document.getElementById('dark-btn');

        if (AppState.darkMode) {
            app.classList.add('dark');
            if (darkBtn) darkBtn.textContent = 'Light';
        } else {
            app.classList.remove('dark');
            if (darkBtn) darkBtn.textContent = 'Dark';
        }

        var sidebar = document.getElementById('app-sidebar');
        if (sidebar) sidebar.classList.toggle('dark', AppState.darkMode);
        document.body.classList.toggle('dark', AppState.darkMode);

        callServerSilent('setDarkMode', AppState.darkMode).catch(function() {});
    }

    /**
     * setCurrency(value)
     * Updates the active currency, re-renders all amounts, persists to server.
     */
    function setCurrency(value) {
        AppState.currency = value;
        renderAll();
        callServerSilent('setCurrency', value).catch(function() {});
    }


    // ─── 14. CSV ──────────────────────────────────────────────────────────────────

    /**
     * exportCSV()
     *
     * Calls the server to generate a CSV string for the current month,
     * then triggers a browser file download via a temporary <a> element.
     * No server storage — the CSV is streamed directly to the client.
     */
    async function exportCSV() {
        try {
            var csv = await callServer('exportTransactionsToCSV', curKey());

            if (!csv || csv.trim() === '') {
                showToast('No transactions to export this month.', 'info');
                return;
            }

            // Build a Blob and trigger a download via a temporary anchor element.
            var blob     = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            var url      = URL.createObjectURL(blob);
            var filename = 'budget_' + curKey() + '.csv';

            var a           = document.createElement('a');
            a.href          = url;
            a.download      = filename;
            a.style.display = 'none';
            document.body.appendChild(a);
            a.click();

            // Clean up immediately — revoking too early on some browsers cancels the download,
            // so use a short timeout.
            setTimeout(function() {
                URL.revokeObjectURL(url);
                document.body.removeChild(a);
            }, 250);

            showToast('Exported ' + filename, 'success');

        } catch (e) {
            // Error toast shown by callServer.
        }
    }


    // ─── 15. Import CSV ──────────────────────────────────────────────────────────────────

    /**
     * importCSV(event)
     *
     * Reads the selected .csv file, sends it to the server for parsing and
     * insertion, then merges the returned transactions into AppState and
     * refreshes the UI.
     *
     * Called by the hidden file input in Overview.html:
     *   <input type="file" accept=".csv" onchange="importCSV(event)"/>
     */
    function importCSV(event) {
        var file = event.target.files && event.target.files[0];
        if (!file) return;

        // Reset the input so the same file can be re-selected if needed.
        event.target.value = '';

        var reader    = new FileReader();
        reader.onload = function(e) {
            var csvText = e.target.result;

            if (!csvText || !csvText.trim()) {
                showToast('The selected file appears to be empty.', 'error');
                return;
            }

            // Send to server — callServer returns a Promise.
            callServer('importTransactionsFromCSV', csvText, curKey())
                .then(function(result) {
                    var imported = result && result.imported ? result.imported : 0;
                    var skipped  = result && result.skipped  ? result.skipped  : 0;

                    // Re-fetch the current month's transactions to get the server's
                    // authoritative list (includes the newly imported rows with IDs).
                    return callServerSilent('getTransactionsByMonth', curKey())
                        .then(function(txs) {
                            AppState.transactions[curKey()] = txs || [];
                            renderAll();

                            var msg = 'Imported ' + imported + ' transaction' + (imported !== 1 ? 's' : '') + '.';
                            if (skipped > 0) msg += ' ' + skipped + ' row' + (skipped !== 1 ? 's' : '') + ' skipped.';
                            showToast(msg, imported > 0 ? 'success' : 'info');
                        });
                })
                .catch(function() {});
        };

        reader.onerror = function() {
            showToast('Could not read the file. Please try again.', 'error');
        };

        reader.readAsText(file);
    }


    // ─── 15. RENDER ALL ───────────────────────────────────────────────────────────

    /**
     * renderAll()
     *
     * Master re-render function. Called after any state mutation.
     * Renders the header, alert banners, category selects, and whichever
     * screen pane is currently active.
     *
     * Screen render functions are defined in their respective pane files.
     * We guard each call with typeof checks so renderAll() works even when
     * only some screen files are loaded (e.g. during incremental branch work).
     */
    function renderAll() {
        // ── Shared chrome ──────────────────────────────────────────────────────────
        if (typeof updateHeader            === 'function') updateHeader();
        if (typeof updateAlertBanners      === 'function') updateAlertBanners();
        if (typeof updateNotificationBell  === 'function') updateNotificationBell();
        if (typeof populateCategorySelects === 'function') populateCategorySelects();

        // ── Active pane ────────────────────────────────────────────────────────────
        var activeTab = AppState.activeTab || 'overview';

        var renderMap = {
            'overview':   function() { if (typeof renderOverview    === 'function') renderOverview();    },
            'goals':      function() { if (typeof renderGoals       === 'function') renderGoals();       },
            'savings':    function() { if (typeof renderSavings     === 'function') renderSavings();     },
            'debt':       function() { if (typeof renderDebt        === 'function') renderDebt();        },
            'networth':   function() { if (typeof renderNetWorth    === 'function') renderNetWorth();    },
            'recurring':  function() { if (typeof renderRecurring   === 'function') renderRecurring();   },
            'bills':      function() { if (typeof renderBills       === 'function') renderBills();       },
            'settings':   function() { if (typeof renderSettings    === 'function') renderSettings();    },
            'categories': function() { if (typeof renderCategories  === 'function') renderCategories();  },
            'report':     function() { if (typeof renderReport      === 'function') renderReport();      },
            'insights':   function() { if (typeof renderInsights    === 'function') renderInsights();    },
            'templates':  function() { if (typeof renderTemplates   === 'function') renderTemplates();   },
            'charts':     function() { /* rendered by switchTab — avoids canvas flicker */ },
            'multimonth': function() { /* rendered by switchTab */ },
            'forecast':   function() { /* rendered by switchTab */ }
        };

        if (renderMap[activeTab]) {
            renderMap[activeTab]();
        }
    }
</script>
