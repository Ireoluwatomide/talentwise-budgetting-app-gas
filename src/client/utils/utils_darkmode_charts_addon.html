<script>
    // =============================================================================
    // utils_darkmode_charts_addon.html — Phase 3A.7 Dark Mode Chart Live Update
    //
    // Include AFTER utils.js and Spending.html/Trends.html in Index.html.
    //
    // Patches toggleDark() to also call renderAllCharts() after the theme switch,
    // ensuring all registered Chart.js instances reflect the new color scheme
    // without requiring a page reload.
    //
    // renderAllCharts() re-renders any analytics screen that is currently active.
    // For inactive chart tabs, _chartTabsDirty is set so switchTab() re-renders.
    // =============================================================================

    /**
     * renderAllCharts()
     *
     * Re-renders all active Chart.js instances after a theme change.
     * Active chart tabs are re-rendered immediately (50ms delay for canvas).
     * Inactive chart tabs are marked dirty.
     */
    function renderAllCharts() {
        var activeTab = AppState.activeTab || 'overview';

        // Spending tab
        if (activeTab === 'spending') {
            setTimeout(function() {
                if (typeof renderSpending === 'function') renderSpending();
            }, 50);
        } else {
            _chartTabsDirty.spending = true;
        }

        // Trends tab
        if (activeTab === 'trends') {
            setTimeout(function() {
                if (typeof renderTrends === 'function') renderTrends();
            }, 50);
        } else {
            _chartTabsDirty.trends = true;
        }
    }

    // Patch toggleDark() to call renderAllCharts() after theme switch.
    // We wait for DOMContentLoaded so all screen scripts are loaded first.
    document.addEventListener('DOMContentLoaded', function() {
        if (typeof toggleDark === 'function') {
            var _originalToggleDark = toggleDark;
            window.toggleDark = function() {
                _originalToggleDark();
                renderAllCharts();
            };
        }
    });
</script>
